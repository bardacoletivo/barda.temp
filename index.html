<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BARDA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
  --footer-h:44px;
  --nav-w:280px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body{
  margin:0; width:100%; height:100%;
  overflow:hidden;
  background:white;
  font-family:'IBM Plex Sans',sans-serif;
  color:black;
}

/* ── PUSH WRAPPER ─────────────────────────────── */
/* Everything except the nav slides left when menu opens */
#site-wrap{
  position:fixed;
  inset:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
#site-wrap.nav-open{
  transform:translateX(calc(-1 * var(--nav-w)));
}

/* ── LOGO ─────────────────────────────────────── */
.logo{
  position:fixed;
  top:20px; right:24px;
  z-index:500;
  font-family:'Space Grotesk',sans-serif;
  font-size:21px; font-weight:500;
  color:var(--blue);
  cursor:pointer;
  margin:0;
  line-height:1;
}

/* ── HAMBURGER ────────────────────────────────── */
.hamburger{
  position:fixed;
  top:50px; right:24px;
  z-index:500;
  width:32px;          /* sized by JS to match logo width */
  display:flex; flex-direction:column; gap:6px;
  cursor:pointer;
  padding:4px 0;
  background:none; border:none;
  touch-action:manipulation;
}
.hamburger span{
  display:block; height:2px;
  background:black;
}

/* ── LANG TOGGLE ──────────────────────────────── */
.lang-toggle{
  position:fixed;
  top:20px; left:24px;
  z-index:500;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px; font-weight:500; letter-spacing:.06em;
  border:1px solid black; background:white; color:black;
  padding:5px 12px;
  cursor:pointer; touch-action:manipulation;
  transition:background .15s,color .15s,border-color .15s;
}
.lang-toggle:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* ── STATEMENT ────────────────────────────────── */
.statement{
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:min(640px,82vw);
  text-align:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:22px; line-height:1.35;
  z-index:1;
  pointer-events:none;
}

/* ── PHYSICS WORLD ────────────────────────────── */
#world{
  position:fixed; inset:0;
  overflow:hidden; z-index:10;
  /* world catches drag only within itself */
  touch-action:none;
}

/* ── UI LAYER — always above world ───────────── */
.logo,
.hamburger,
.lang-toggle,
.close-button,
.nav-menu,
.nav-overlay,
.site-footer{
  pointer-events:auto;
}

/* ── PHYSICS BUTTONS ──────────────────────────── */
.physics-button{
  position:absolute;
  display:flex; align-items:center; justify-content:center;
  padding:12px 18px;
  border:1px solid black; background:white; color:black;
  font-family:'Space Grotesk',sans-serif; font-size:20px;
  cursor:pointer; user-select:none; white-space:nowrap;
  min-width:80px; max-width:min(340px,80vw);
  touch-action:none;   /* lets Matter.js handle touch drag */
  transition:background .15s,color .15s,border-color .15s;
}
.physics-button:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* ── NAV OVERLAY (dim) ────────────────────────── */
.nav-overlay{
  display:none;
  position:fixed; inset:0;
  z-index:550;
  background:rgba(0,0,0,.15);
}
.nav-overlay.open{ display:block; }

/* ── NAV MENU ─────────────────────────────────── */
.nav-menu{
  position:fixed;
  top:0; right:calc(-1 * var(--nav-w));  /* starts off-screen right */
  width:var(--nav-w); height:100%;
  background:white;
  border-left:1px solid #e0e0e0;
  z-index:600;
  display:flex; flex-direction:column;
  padding:80px 32px 32px 32px;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  transition:right .32s cubic-bezier(.4,0,.2,1);
}
.nav-menu.open{ right:0; }

.nav-menu-close{
  position:absolute; top:0; left:0;
  width:48px; height:48px;
  border:none; background:var(--blue); color:white;
  font-size:28px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation;
}

.nav-about-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--blue);
  margin:0 0 20px 0; text-align:left;
  cursor:pointer; background:none; border:none; padding:0;
  touch-action:manipulation;
}
.nav-about-label:hover{ opacity:.7; }

.nav-divider{ border:none; border-top:1px solid #e0e0e0; margin:20px 0; }

.nav-project-btn{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px; font-weight:400;
  background:none; border:none;
  padding:12px 0;
  cursor:pointer; text-align:right; width:100%; color:black;
  touch-action:manipulation;
  transition:color .15s;
}
.nav-project-btn:hover{ color:var(--blue); }

/* ── OVERLAY (project windows) ────────────────── */
.overlay-container{
  display:none;
  position:fixed; inset:0;
  align-items:center; justify-content:center;
  z-index:300;
  pointer-events:none;
}
.overlay-container.active{ display:flex; }

.overlay-content{
  width:min(980px,92vw);
  /* leave room for footer + a gap */
  height:calc(min(80vh,940px) - var(--footer-h) - 12px);
  display:flex; flex-direction:column;
  position:relative;
  border:2px solid var(--blue);
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  pointer-events:auto;
  /* push window up so it clears the footer */
  margin-bottom:calc(var(--footer-h) + 12px);
}

/* fixed close button inside the window, top-right corner */
.close-button{
  position:absolute;
  top:0; right:0;
  width:48px; height:48px;
  border:none; background:var(--blue); color:white;
  font-size:28px; line-height:1;
  cursor:pointer; z-index:10;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation;
  flex-shrink:0;
}

/* scrollable content inside, padded to clear the close button */
#content{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:52px 52px 52px 52px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:var(--blue) transparent;
}
#content::-webkit-scrollbar{ width:4px; }
#content::-webkit-scrollbar-track{ background:transparent; }
#content::-webkit-scrollbar-thumb{ background:var(--blue); border-radius:0; }
#content::-webkit-scrollbar-button{ display:none; }

/* ── BILINGUAL ────────────────────────────────── */
.bilingual{
  display:grid; grid-template-columns:1fr 1fr;
  gap:0 40px; margin-bottom:18px;
}
.bilingual p{ margin:0; }
.lang-label{
  font-size:11px; font-weight:500; letter-spacing:.08em;
  color:var(--blue); text-transform:uppercase;
  margin-bottom:6px !important;
}
@media(max-width:600px){ .bilingual{ grid-template-columns:1fr; } }

/* ── BIOS ─────────────────────────────────────── */
.bios{ margin-top:40px; border-top:1px solid #e0e0e0; padding-top:32px; }
.bios h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--blue); margin:0 0 28px 0;
}
.bio{ margin-bottom:32px; padding-bottom:32px; border-bottom:1px solid #f0f0f0; }
.bio:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
.bio-name{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:500; margin:0 0 10px 0; }
.bio p{ font-size:14px; line-height:1.65; color:#333; margin:0; }

/* ── CONTENT INNER ────────────────────────────── */
.content-inner{ max-width:760px; }
.content-inner h2{ margin:0 0 18px 0; font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:500; }
.content-inner p{ margin:0 0 18px 0; font-size:15px; line-height:1.65; }

/* ── SWIPER ───────────────────────────────────── */
.swiper{ width:100%; height:58vh; margin-top:34px; }
.swiper-slide{ display:flex; align-items:center; justify-content:center; }
.swiper-slide img{ width:100%; height:100%; object-fit:contain; }
.swiper-button-next,.swiper-button-prev{ color:var(--blue); }
.swiper-pagination-bullet-active{ background:var(--blue); }

/* ── FOOTER ───────────────────────────────────── */
.site-footer{
  position:fixed; bottom:0; left:0; right:0;
  z-index:40;
  background:var(--blue); color:white;
  display:flex; align-items:center; justify-content:center;
  gap:28px;
  height:var(--footer-h);
  padding:0 24px;
  font-family:'Space Grotesk',sans-serif; font-size:13px;
}
.site-footer a{ color:white; text-decoration:none; opacity:.85; transition:opacity .15s; }
.site-footer a:hover{ opacity:1; }
.footer-ig{ display:flex; align-items:center; gap:7px; }
.footer-ig svg{ width:16px; height:16px; fill:white; }

/* ── MOBILE ───────────────────────────────────── */
@media(max-width:768px){
  .statement{ width:84vw; font-size:18px; }

  .physics-button{ font-size:17px; padding:10px 14px; }

  .overlay-content{
    width:96vw;
    height:calc(75vh - var(--footer-h) - 8px);
    margin-bottom:calc(var(--footer-h) + 8px);
  }

  #content{ padding:52px 20px 20px 20px; }

  .content-inner h2{ font-size:26px; }
  .swiper{ height:40vh; }

  .site-footer{ font-size:11px; gap:18px; }
}
</style>
</head>
<body>

<!-- everything that slides left lives inside #site-wrap -->
<div id="site-wrap">

  <h1 class="logo" id="logoHome">BARDA</h1>

  <button class="lang-toggle" id="langToggle">EN</button>

  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <div class="statement">Images as tools for collective transformation</div>

  <div id="world"></div>

  <div class="overlay-container" id="overlay">
    <div class="overlay-content">
      <button class="close-button" id="close">×</button>
      <div id="content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="mailto:bardacoletivo@gmail.com" title="Email" style="display:flex;align-items:center;opacity:.85;transition:opacity .15s;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.144C21.69 2.28 24 3.434 24 5.457z"/></svg>
    </a>
    <a href="https://instagram.com/bardacoletivo" target="_blank" title="Instagram" style="display:flex;align-items:center;opacity:.85;transition:opacity .15s;">

    </a>
  </footer>

</div><!-- /#site-wrap -->

<!-- nav lives OUTSIDE site-wrap so it slides in from the right edge -->
<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-menu" id="navMenu">
  <button class="nav-menu-close" id="navClose">×</button>
  <button class="nav-about-label" id="navAbout">About</button>
  <hr class="nav-divider">
  <button class="nav-project-btn" data-key="membrana">Membrana</button>
  <button class="nav-project-btn" data-key="porvir">Porvir</button>
  <button class="nav-project-btn" data-key="imagens">Imagens Verdes</button>
  <button class="nav-project-btn" data-key="casa">A Casa de Falar Baixinho</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
/* ── REFS ─────────────────────────────────────── */
const siteWrap   = document.getElementById("site-wrap");
const overlay    = document.getElementById("overlay");
const content    = document.getElementById("content");
const closeBtn   = document.getElementById("close");
const worldEl    = document.getElementById("world");
const langBtn    = document.getElementById("langToggle");
const hamburger  = document.getElementById("hamburger");
const navMenu    = document.getElementById("navMenu");
const navOverlay = document.getElementById("navOverlay");
const navClose   = document.getElementById("navClose");

let swiperInst = null;
let currentLang = "pt";

/* ── LOGO → home ──────────────────────────────── */
document.getElementById("logoHome").addEventListener("click", closeOverlay);

/* ── HAMBURGER size = logo width ──────────────── */
window.addEventListener("load", () => {
  const logoW = document.getElementById("logoHome").offsetWidth;
  if(logoW > 0) hamburger.style.width = logoW + "px";
});

/* ── NAV open / close ─────────────────────────── */
function openNav(){
  navMenu.classList.add("open");
  navOverlay.classList.add("open");
  siteWrap.classList.add("nav-open");
}
function closeNav(){
  navMenu.classList.remove("open");
  navOverlay.classList.remove("open");
  siteWrap.classList.remove("nav-open");
}

hamburger.addEventListener("click", openNav);
navClose.addEventListener("click", closeNav);
navOverlay.addEventListener("click", closeNav);

document.getElementById("navAbout").addEventListener("click", () => { closeNav(); openProject("about"); });
document.querySelectorAll(".nav-project-btn").forEach(btn => {
  btn.addEventListener("click", () => { closeNav(); openProject(btn.dataset.key); });
});

/* ── LANGUAGE TOGGLE ──────────────────────────── */
function applyLang(lang){
  const isEN = lang === "en";
  document.querySelectorAll(".bilingual").forEach(b => {
    const pt = b.querySelector("div:nth-child(1)");
    const en = b.querySelector("div:nth-child(2)");
    if(pt && en){
      pt.style.display = isEN ? "none" : "block";
      en.style.display = isEN ? "block" : "none";
      b.style.gridTemplateColumns = "1fr";
    }
  });
}

langBtn.addEventListener("click", () => {
  currentLang = currentLang === "pt" ? "en" : "pt";
  langBtn.textContent = currentLang === "pt" ? "EN" : "PT";
  applyLang(currentLang);
});

/* ── PROJECT DATA ─────────────────────────────── */
const projectData = {
  membrana:{
    title:"Membrana",
    text:`<div class="content-inner">
      <h2>Membrana</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Exposição coletiva · 2023–2025</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>A exposição parte do conceito científico de adaptação sensorial — uma ferramenta que equilibra a sensibilidade dos estímulos que recebemos — e convoca os visitantes a reflectir sobre os sentidos, alargando os domínios da percepção. É na ligação entre o público e o privado que surge a concepção da "Membrana", expandindo as formas de ver para refletir sobre as conexões entre as pessoas. Através de dispositivos que exploram a cor, o movimento e a interface entre os sentidos e a realidade, a exposição apresenta uma abstração e desconstrução do quotidiano, expondo camadas mais profundas da compreensão da realidade.</p></div>
        <div><p class="lang-label">EN</p><p>The exhibition departs from the scientific concept of sensory adaptation — a tool that balances the sensitivity of the stimuli we receive — calling visitors to reflect on the senses and expand the domains of perception. It is in the connection between the public and the private that the conception of the "Membrane" arises, expanding ways of seeing to reflect on the connections between people. Through devices that explore colour, movement, and the interface between senses and reality, the exhibition presents an abstraction and deconstruction of the everyday, exposing deeper layers of understanding reality.</p></div>
      </div>
    </div>`,
    images:["images/membrana/01.jpg","images/membrana/02.jpg","images/membrana/03.jpg"]
  },
  porvir:{
    title:"Porvir",
    text:`<div class="content-inner">
      <h2>Porvir</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Projeto de arte participativa · Serra do Açor · 2024</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>Porvir é um projeto de intercâmbio multidisciplinar que envolve artistas locais, artistas externos e a comunidade, com o objetivo de imaginar o futuro através da arte participativa. Focado em quatro aldeias da Serra do Açor, o Porvir procura, através da expressão artística, construir um espaço de partilha, investigação, criação e exposição, estimulando o pensamento crítico das comunidades envolvidas. O projeto culmina em exposições coletivas no espaço público, promovendo discussões abertas e trocas de ideias entre participantes, público e instituições.</p></div>
        <div><p class="lang-label">EN</p><p>Porvir is a multidisciplinary exchange project involving local artists, external artists, and the community, aimed at envisioning the future through participatory art. Focused on four villages in the Serra do Açor region, Porvir seeks, through artistic expression, to build a space for sharing, research, creation, and exhibition, while stimulating the critical thinking of the involved communities. The project culminates in collective exhibitions in the public space, promoting open discussions and idea exchanges among participants, the public, and institutions.</p></div>
      </div>
    </div>`,
    images:["images/porvir/01.jpg","images/porvir/02.jpg","images/porvir/03.jpg"]
  },
  imagens:{
    title:"Imagens Verdes",
    text:`<div class="content-inner">
      <h2>Imagens Verdes</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Oficinas de expressão artística · Porto · 2023–2025</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>Imagens Verdes é um projeto contínuo de transformação que reúne pessoas com 65 ou mais anos para uma exploração única da autoexpressão. Através de oficinas dinâmicas que integram teatro, música, ilustração e fotografia, os participantes mergulham nas suas memórias, partilhando experiências entre si. Dedicado à promoção do intercâmbio entre artistas e a comunidade sénior do Bonfim no Porto, o projeto explora memórias afetivas através de práticas interdisciplinares, promovendo a democratização cultural e a expressão artística.</p></div>
        <div><p class="lang-label">EN</p><p>Imagens Verdes is an ongoing project aimed at transformation, bringing together individuals aged 65 and above for a unique exploration of self-expression. Through dynamic workshops that integrate theatre, music, illustration, and photography, participants delve into the realms of their memories, sharing their experiences with one another. Dedicated to promoting exchange between artists and the senior community of Bonfim in Porto, we explore affective memories through interdisciplinary practices, fostering cultural democratisation and artistic expression.</p></div>
      </div>
    </div>`,
    images:["images/imagensverdes/01.jpg","images/imagensverdes/02.jpg","images/imagensverdes/03.jpg"]
  },
  casa:{
    title:"A Casa de Falar Baixinho",
    text:`<div class="content-inner">
      <h2>A Casa de Falar Baixinho</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Exposição · Encontros da Imagem · 2025</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>Integrada no núcleo expositivo Argumentários, que celebra e revisita a história do festival, a intervenção do Colectivo Barda responde ao desafio de recuperar memórias e experiências que moldaram de forma sensível e contínua a identidade dos Encontros da Imagem. Partindo de eventos reais da Semana de Abertura de 2018, o coletivo explora encontros, trocas e gestos inscritos na memória da comunidade reunida em torno do festival. Cada imagem em A casa de falar baixinho evoca episódios específicos, convocando afetos, práticas e momentos que, embora ausentes da documentação formal, ficaram marcados nos corpos e na memória particular de cada edição.</p></div>
        <div><p class="lang-label">EN</p><p>Integrated into the exhibition core Argumentários, which aims to celebrate and revisit the history of the festival, the intervention by Colectivo Barda responds to the challenge of recovering memories and experiences that have sensitively shaped the identity of Encontros da Imagem. Drawing from real events during the Opening Week of 2018, the collective explores encounters, exchanges and gestures inscribed in the memory of the community gathered around the festival. Each image in A casa de falar baixinho evokes specific episodes, calling forth affects, practices and moments that, although absent from formal documentation, left their mark on bodies and became embedded in the memory of each edition.</p></div>
      </div>
    </div>`,
    images:["images/casafalarbaixinho/1.jpg","images/casafalarbaixinho/2.jpg","images/casafalarbaixinho/3.jpg"]
  },
  about:{
    title:"About",
    text:`<div class="content-inner">
      <h2>BARDA</h2>
      <div class="bilingual" style="margin-bottom:28px;">
        <div><p class="lang-label">PT</p><p>O Colectivo Barda enfatiza as artes visuais como meio de transformação e capacitação de comunidades periféricas, usando a imagem como ferramenta de intervenção e questionamento, promovendo a criação de sinergias entre comunidade e território através de diálogos experimentais. Barda é uma manifestação de vontade colaborativa que tomou a forma de um coletivo.</p></div>
        <div><p class="lang-label">EN</p><p>Barda Collective emphasises visual arts as a means of transformation and empowerment for peripheral communities, using imagery as a tool for intervention and questioning, promoting the creation of synergies between community and territory through experimental dialogues. Barda is a manifestation of collaborative will that has taken the form of a collective.</p></div>
      </div>
      <div class="bios">
        <h3>Who is Barda?</h3>
        <div class="bio"><p class="bio-name">Ana Luísa Rego</p><p>Born in Cinfães (1974), lives in Porto. She began her journey in photography during the analog era, complementing her education with a Photography course at Oficina Da Imagem (2009), a documentary photography workshop at Instituto Português de Fotografia (2015), and a Master's in Artistic Photography at IPCI (2019). She was a founding member of cultural association Espaço Compasso and social association Moving Cause. In her practice, she documents themes inspired by social, cultural, and scientific issues through an interdisciplinary and collaborative approach. She exhibits individually and collectively in Portugal and abroad, with highlights at Fnac Galleries, Fundação Oriente Dili-Timor, Encontros de Imagem, PhotoAlicante, and HybridArt Space Gallery in Budapest.</p></div>
        <div class="bio"><p class="bio-name">Carlos Trancoso</p><p>Born in 1989, visual artist based in Porto. Trained in Architecture at FAUP and holding a Master's in Artistic Photography from IPCI, his practice explores the intersections between nature, technology and systems of observation, combining photographic thinking with spatial, sonic and computational processes. He works across photography, installation, video and experimental image-making devices. Since 2022 he has been a member of the European Futures Photography platform through Ci.Clo. In 2024 he won the Intergalactica Open Call, leading to the publication of his photobook <em>How to Build a Telescope</em> by XYZ Books in 2025.</p></div>
        <div class="bio"><p class="bio-name">Diana Sá</p><p>Born in Espinho in 1985. She attended the professional photography course at the Portuguese Institute of Photography and the Master's in Artistic Photography at IPCI. In 2020, she participated in an artistic residency in the Azores and received an honorable mention from FNAC in photography. She has participated in group exhibitions in Portugal and abroad. She is interested in long-term projects about territory, everyday life, and the ephemeral.</p></div>
        <div class="bio"><p class="bio-name">Guida Marques</p><p>Born in 1986, neo-rural, lives in Serra do Açor since 2017. Master's in Multimedia Art – Performance/Installation at Fine Arts of Lisbon (2019) and Master's in Architecture at the University of Coimbra (2011). She develops reconstructions of schist houses and performances/installations focused on the body/place/memory relationship. Activist in defense of the forest, organic agriculture, and traditional architecture. She participated in the Manifesta 12 Contemporary Art Biennial and is one of the invited architects for the Portuguese representation at the Venice Architecture Biennale 2023.</p></div>
        <div class="bio"><p class="bio-name">Hernâni Sousa</p><p>Born in Espinho in 1982. Holds a Master's in Information Science from the Faculty of Engineering at the University of Porto. Completed the Professional Photography Course at the Portuguese Institute of Photography (2018) and the Master's in Artistic Photography at IPCI (2019). He develops personal projects using the photographic medium around themes of intimacy and territory, with particular interest in semiotics and the politicisation of things.</p></div>
        <div class="bio"><p class="bio-name">Inês Fernandes</p><p>Born in Porto (1996). Graduated in New Communication Technologies from the University of Aveiro and attended the Master's in Artistic Photography at IPCI. In 2019, she interned at Jornal Público, and since then has worked simultaneously as a photographer and freelancer in graphic design and video editing. Her projects address contemporary themes focused on social and environmental issues, with a preference for rural and decentralised contexts. Her work has been featured in international publications including Musée Magazine (New York) and Gallery Photographs (Tokyo).</p></div>
        <div class="bio"><p class="bio-name">Ivan Da Silva</p><p>Born in the late 80s, finds the theme of his work in neighboring centuries, shifting digital images to analog processes. Through experimental image analysis systems, he deconstructs everyday images in an ecology of images. He has participated in exhibitions at Circulation(s), Encontros da Imagem, Museu da Vila Velha de Vila Real, and Museu do Douro. He works as a visual arts teacher and was coordinator of the Imagens Verdes project.</p></div>
        <div class="bio"><p class="bio-name">Juliana Maar</p><p>Born in 1981, began her journey in photography in 2013. She participated in group exhibitions in Lisbon and Paris, collaborated with publisher "do lado esquerdo" and launched the fanzine <em>underword</em>. She uses the body and self-portraiture as her main vehicles of expression. She attended the Master's in Artistic Photography at IPCI in 2019. Neo-rural in Serra do Açor for six years.</p></div>
        <div class="bio"><p class="bio-name">Marco Duarte</p><p>Born in 1978, freelance documentary photographer tackling social issues in his visual projects. In 2021 he joined the community participation project "Alquimia – Como vejo o meu bairro" in Guimarães. In 2022, he co-founded the Barda collective, participating in various collaborative projects since then.</p></div>
      </div>
    </div>`,
    images:[]
  }
};

/* ── SWIPER ───────────────────────────────────── */
function buildSwiper(images){
  if(!images.length) return "";
  const slides = images.map(img=>`<div class="swiper-slide"><img src="${img}"></div>`).join("");
  return `<div class="swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}
function initSwiper(){
  swiperInst = new Swiper(".swiper",{
    loop:true,
    pagination:{el:".swiper-pagination"},
    navigation:{nextEl:".swiper-button-next",prevEl:".swiper-button-prev"}
  });
}

/* ── OPEN / CLOSE PROJECT ─────────────────────── */
function openProject(key){
  const item = projectData[key];
  content.innerHTML = item.text + buildSwiper(item.images);
  overlay.classList.add("active");
  worldEl.style.zIndex = "0";
  applyLang(currentLang);
  content.scrollTop = 0;
  if(item.images.length){ setTimeout(initSwiper, 80); }
}

function closeOverlay(){
  overlay.classList.remove("active");
  worldEl.style.zIndex = "10";
  content.innerHTML = "";
  if(swiperInst){ swiperInst.destroy(); swiperInst = null; }
}

closeBtn.addEventListener("click", closeOverlay);

/* ── PHYSICS ──────────────────────────────────── */
const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;

const engine = Engine.create();
engine.gravity.y = 1.2;
const world = engine.world;

const W  = window.innerWidth;
const H  = window.innerHeight;
const cx = W / 2;
const cy = H / 2;

// floor sits just above the footer
const FOOTER_H = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--footer-h")) || 44;
const floorY = H - FOOTER_H;

const floor     = Bodies.rectangle(W/2, floorY + 30, W, 60, {isStatic:true});
const leftWall  = Bodies.rectangle(-30,  H/2, 60, H, {isStatic:true});
const rightWall = Bodies.rectangle(W+30, H/2, 60, H, {isStatic:true});
Composite.add(world, [floor, leftWall, rightWall]);

function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

const items = [
  { label:"Membrana",              key:"membrana", x:cx-W*.22, y:cy-H*.55, w:clampW(190), h:54 },
  { label:"Porvir",                key:"porvir",   x:cx+W*.04, y:cy-H*.70, w:clampW(140), h:54 },
  { label:"Imagens Verdes",        key:"imagens",  x:cx+W*.20, y:cy-H*.62, w:clampW(240), h:54 },
  { label:"Casa de Falar Baixinho",key:"casa",     x:cx-W*.04, y:cy-H*.85, w:clampW(320), h:54 },
  { label:"About",                 key:"about",    x:cx+W*.28, y:cy-H*.78, w:clampW(130), h:54 }
];

items.forEach(item => {
  const body = Bodies.rectangle(item.x, item.y, item.w, item.h, {
    restitution:.1, friction:.8, frictionAir:.02
  });
  Composite.add(world, body);

  const el = document.createElement("div");
  el.className = "physics-button";
  el.textContent = item.label;
  worldEl.appendChild(el);

  // drag-safe tap
  let startX, startY;
  el.addEventListener("pointerdown", e => { startX = e.clientX; startY = e.clientY; });
  el.addEventListener("pointerup",   e => {
    const d = Math.hypot(e.clientX - startX, e.clientY - startY);
    if(d < 8) openProject(item.key);
  });

  item.body = body;
  item.el   = el;
});

// mouse / touch drag for physics — bind ONLY to #world, not the whole body
// This lets all UI buttons (hamburger, lang, close, nav) receive touch events freely
const mouse = Mouse.create(worldEl);
// keep Matter's internal pixel ratio in sync
mouse.pixelRatio = window.devicePixelRatio;
const mc = MouseConstraint.create(engine, {
  mouse, constraint:{ stiffness:.2, render:{ visible:false } }
});
// prevent Matter from swallowing touch events that start outside #world
mc.mouse.element.removeEventListener("touchstart", mc.mouse.mousedown);
mc.mouse.element.removeEventListener("touchmove",  mc.mouse.mousemove);
mc.mouse.element.removeEventListener("touchend",   mc.mouse.mouseup);
mc.mouse.element.addEventListener("touchstart", mc.mouse.mousedown, { passive: true });
mc.mouse.element.addEventListener("touchmove",  mc.mouse.mousemove, { passive: true });
mc.mouse.element.addEventListener("touchend",   mc.mouse.mouseup,   { passive: true });
Composite.add(world, mc);

Runner.run(Runner.create(), engine);

function tick(){
  items.forEach(({ body, el, w, h }) => {
    el.style.width     = w + "px";
    el.style.height    = h + "px";
    el.style.left      = (body.position.x - w/2) + "px";
    el.style.top       = (body.position.y - h/2) + "px";
    el.style.transform = `rotate(${body.angle}rad)`;
  });
  requestAnimationFrame(tick);
}
tick();

window.addEventListener("resize", () => location.reload());
</script>
