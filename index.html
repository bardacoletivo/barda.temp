<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>BARDA</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
  --footer-h:48px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
  font-family:'IBM Plex Sans',sans-serif;
  color:black;
  /* Garante que eventos de clique funcionem no iOS */
  cursor: default; 
}

.logo{
  position:fixed;
  top:20px;
  right:24px;
  z-index:50;
  font-family:'Space Grotesk',sans-serif;
  font-size:21px;
  font-weight:500;
  color:var(--blue);
  cursor: pointer;
}

.statement{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(640px,82vw);
  text-align:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;
  line-height:1.35;
  z-index:1;
  pointer-events:none;
}

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:10;
}

.physics-button{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 18px;
  border:1px solid black;
  background:white;
  color:black;
  font-family:'Space Grotesk',sans-serif;
  font-size:25px;
  text-decoration:none;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
  min-width:80px;
  max-width:min(340px,80vw);
  transition:
    background .15s linear,
    color .15s linear,
    border-color .15s linear;
}

.physics-button:hover{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.overlay-container{
  display:none;
  position:fixed;
  inset:0;
  align-items:center;
  justify-content:center;
  z-index:100;
  pointer-events:none;
}

.overlay-content{
  width:min(980px,92vw);
  height:min(90vh,940px);
  padding:0;
  overflow:hidden; /* Mudado para oculto para fixar o botão */
  position:relative;
  border:2px solid var(--blue);
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  pointer-events:auto;
  display: flex;
  flex-direction: column;
}

/* Área de scroll interna para manter o botão fixo */
#content {
  overflow-y: auto;
  padding: 60px 52px 52px 52px;
  height: 100%;
  width: 100%;
}

.close-button{
  position:absolute;
  top:0;
  right:0;
  width:48px;
  height:48px;
  border:none;
  background:var(--blue);
  color:white;
  font-size:28px;
  cursor:pointer;
  z-index:110;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* BILINGUAL */

.bilingual{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap: 0 40px;
  margin-bottom:18px;
}

.bilingual p{
  margin:0;
}

.lang-label{
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
  color:var(--blue);
  text-transform:uppercase;
  margin-bottom:6px !important;
}

/* BIOS */

.bios{
  margin-top:40px;
  border-top:1px solid #e0e0e0;
  padding-top:32px;
}

.bios h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--blue);
  margin:0 0 28px 0;
}

.bio{
  margin-bottom:32px;
  padding-bottom:32px;
  border-bottom:1px solid #f0f0f0;
}

.bio:last-child{
  border-bottom:none;
  margin-bottom:0;
  padding-bottom:0;
}

.bio-name{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px;
  font-weight:500;
  margin:0 0 10px 0;
}

.bio p{
  font-size:14px;
  line-height:1.65;
  color:#333;
  margin:0;
}

@media(max-width:600px){
  .bilingual{
    grid-template-columns:1fr;
  }
}

/* SCROLLBAR */

#content::-webkit-scrollbar{
  width:4px;
}

#content::-webkit-scrollbar-track{
  background:transparent;
}

#content::-webkit-scrollbar-thumb{
  background:var(--blue);
  border-radius:0;
}

#content{
  scrollbar-width:thin;
  scrollbar-color:var(--blue) transparent;
}

/* LANG TOGGLE */

.lang-toggle{
  position:fixed;
  top:20px;
  left:24px;
  z-index:50;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  font-weight:500;
  letter-spacing:.06em;
  border:1px solid black;
  background:white;
  color:black;
  padding:5px 12px;
  cursor:pointer;
  transition: background .15s linear, color .15s linear, border-color .15s linear;
}

.lang-toggle:hover{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* HAMBURGER */

.hamburger{
  position:fixed;
  top:70px;
  right:24px;
  z-index:50;
  color: var(--blue);
  width:65px;
  display:flex;
  flex-direction:column;
  gap:6px;
  cursor:pointer;
  padding:10px 0; /* Aumentado para melhor toque no mobile */
  background:none;
  border:none;
}

.hamburger span{
  display:block;
  height:1.5px;
  background:var(--blue);
  pointer-events: none;
}

/* NAV MENU */

.nav-menu{
  display:none;
  position:fixed;
  top:0;
  right:0;
  width:280px;
  height:100%;
  background:white;
  border-left:1px solid #e0e0e0;
  z-index:200;
  flex-direction:column;
  padding:80px 32px 32px 32px;
  overflow-y:auto;
}

.nav-menu.open{
  display:flex;
}

.nav-menu-close{
  position:absolute;
  top:0;
  left:0;
  width:42px;
  height:42px;
  border:none;
  background:var(--blue);
  color:white;
  font-size:24px;
  cursor:pointer;
}

.nav-about-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px;
  font-weight:500;
  color:var(--blue);
  margin:0 0 20px 0;
  text-align:right;
  cursor:pointer;
  background:none;
  border:none;
  padding:0;
}

.nav-divider{
  border:none;
  border-top:1px solid #e0e0e0;
}

.nav-project-btn{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px;
  font-weight:400;
  background:none;
  border:none;
  padding:10px 0;
  cursor:pointer;
  text-align:left;
  width:100%;
  color:black;
}

.nav-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:190;
  background:transparent;
}

.nav-overlay.open{
  display:block;
}

/* FOOTER */

.site-footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:40;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:0 24px;
  height:var(--footer-h);
}

.footer-icon-link{
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-decoration:none;
  width:20px;
  height:20px;
}

.footer-icon-link svg{
  width:22px;
  height:22px;
  fill:white;
  display:block;
}

/* CONTENT */

.content-inner{
  max-width:760px;
}

.content-inner h2{
  margin:0 0 18px 0;
  font-family:'Space Grotesk',sans-serif;
  font-size:34px;
  font-weight:500;
}

.content-inner p{
  margin:0 0 18px 0;
  font-size:15px;
  line-height:1.65;
}

.swiper{
  width:100%;
  height:58vh;
  margin-top:34px;
}

.swiper-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
}

@media(max-width:768px){
  .statement{
    width:84vw;
    font-size:18px;
  }
  .physics-button{
    font-size:17px;
    padding:10px 14px;
  }
  #content {
    padding: 60px 20px 20px 20px;
  }
  .overlay-content{
    width:96vw;
    height:88vh;
  }
  .content-inner h2{
    font-size:26px;
  }
  .swiper{
    height:42vh;
  }
}
</style>
</head>

<body>

<h1 class="logo" id="logoHome">BARDA</h1>

<button class="lang-toggle" id="langToggle">EN</button>

<button class="hamburger" id="hamburger" aria-label="Menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<div class="nav-overlay" id="navOverlay"></div>

<nav class="nav-menu" id="navMenu">
  <button class="nav-menu-close" id="navClose">×</button>
  <button class="nav-about-label" id="navAbout">About</button>
  <hr class="nav-divider">
  <button class="nav-project-btn" data-key="membrana">Membrana</button>
  <button class="nav-project-btn" data-key="porvir">Porvir</button>
  <button class="nav-project-btn" data-key="imagens">Imagens Verdes</button>
  <button class="nav-project-btn" data-key="casa">A Casa de Falar Baixinho</button>
</nav>

<div class="statement">
  Images as tools for collective transformation
</div>

<div id="world"></div>

<div class="overlay-container" id="overlay">
  <div class="overlay-content">
    <button class="close-button" id="close">×</button>
    <div id="content"></div>
  </div>
</div>

<footer class="site-footer">
  <a href="mailto:bardacoletivo@gmail.com" class="footer-icon-link" title="Email">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.910 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>
  </a>
  <a href="https://instagram.com/bardacoletivo" target="_blank" class="footer-icon-link" title="Instagram">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
  </a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
const overlay = document.getElementById("overlay");
const contentContainer = document.getElementById("content");
const closeBtn = document.getElementById("close");
const worldElement = document.getElementById("world");
const langToggleBtn = document.getElementById("langToggle");

// Funções de clique corrigidas para iOS (iPhone)
function addSafeClick(el, fn) {
  if(!el) return;
  el.addEventListener("click", (e) => {
    e.preventDefault();
    fn();
  }, false);
}

addSafeClick(document.getElementById("logoHome"), () => {
  overlay.style.display = "none";
  worldElement.style.zIndex = "10";
  contentContainer.innerHTML = "";
  if(swiperInstance){ swiperInstance.destroy(); swiperInstance = null; }
});

const hamburger = document.getElementById("hamburger");
const navMenu = document.getElementById("navMenu");
const navOverlay = document.getElementById("navOverlay");
const navClose = document.getElementById("navClose");

function openNav(){ navMenu.classList.add("open"); navOverlay.classList.add("open"); }
function closeNav(){ navMenu.classList.remove("open"); navOverlay.classList.remove("open"); }

addSafeClick(hamburger, openNav);
addSafeClick(navClose, closeNav);
addSafeClick(navOverlay, closeNav);

addSafeClick(document.getElementById("navAbout"), () => { closeNav(); openProject("about"); });

document.querySelectorAll(".nav-project-btn").forEach(btn => {
  addSafeClick(btn, () => { closeNav(); openProject(btn.dataset.key); });
});

let swiperInstance = null;
let currentLang = "pt";

addSafeClick(langToggleBtn, () => {
  if(currentLang === "pt"){
    currentLang = "en";
    langToggleBtn.textContent = "PT";
    document.querySelectorAll(".bilingual > div:nth-child(1)").forEach(el => el.style.display = "none");
    document.querySelectorAll(".bilingual > div:nth-child(2)").forEach(el => { el.style.display = "block"; el.parentElement.style.gridTemplateColumns = "1fr"; });
  } else {
    currentLang = "pt";
    langToggleBtn.textContent = "EN";
    document.querySelectorAll(".bilingual > div:nth-child(1)").forEach(el => el.style.display = "block");
    document.querySelectorAll(".bilingual > div:nth-child(2)").forEach(el => { el.style.display = "none"; el.parentElement.style.gridTemplateColumns = "1fr"; });
  }
});

const projectData = {
  membrana:{
    title:"Membrana",
    text:`<div class="content-inner">
      <h2>Membrana</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Exposição coletiva · 2023–2025</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>A exposição parte do conceito científico de adaptação sensorial — uma ferramenta que equilibra a sensibilidade dos estímulos que recebemos — e convoca os visitantes a reflectir sobre os sentidos, alargando os domínios da percepção.</p></div>
        <div><p class="lang-label">EN</p><p>The exhibition departs from the scientific concept of sensory adaptation — a tool that balances the sensitivity of the stimuli we receive — calling visitors to reflect on the senses.</p></div>
      </div>
    </div>`,
    images:["images/membrana/01.jpg","images/membrana/02.jpg","images/membrana/03.jpg"]
  },
  porvir:{
    title:"Porvir",
    text:`<div class="content-inner">
      <h2>Porvir</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Projeto de arte participativa · Serra do Açor · 2024</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>Porvir é um projeto de intercâmbio multidisciplinar que envolve artistas locais, artistas externos e a comunidade, com o objetivo de imaginar o futuro através da arte participativa.</p></div>
        <div><p class="lang-label">EN</p><p>Porvir is a multidisciplinary exchange project involving local artists, external artists, and the community, aimed at envisioning the future through participatory art.</p></div>
      </div>
    </div>`,
    images:["images/porvir/01.jpg","images/porvir/02.jpg","images/porvir/03.jpg"]
  },
  imagens:{
    title:"Imagens Verdes",
    text:`<div class="content-inner">
      <h2>Imagens Verdes</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Oficinas de expressão artística · Porto · 2023–2025</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>Imagens Verdes é um projeto contínuo de transformação que reúne pessoas com 65 ou mais anos para uma exploração única da autoexpressão.</p></div>
        <div><p class="lang-label">EN</p><p>Imagens Verdes is an ongoing project aimed at transformation, bringing together individuals aged 65 and above for a unique exploration of self-expression.</p></div>
      </div>
    </div>`,
    images:["images/imagensverdes/01.jpg","images/imagensverdes/02.jpg","images/imagensverdes/03.jpg"]
  },
  casa:{
    title:"A Casa de Falar Baixinho",
    text:`<div class="content-inner">
      <h2>A Casa de Falar Baixinho</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Exposição · Encontros da Imagem · 2025</p>
      <div class="bilingual">
        <div><p class="lang-label">PT</p><p>Integrada no núcleo expositivo Argumentários, que celebra e revisita a história do festival, a intervenção do Colectivo Barda responde ao desafio de recuperar memórias.</p></div>
        <div><p class="lang-label">EN</p><p>Integrated into the exhibition core Argumentários, the intervention by Colectivo Barda responds to the challenge of recovering memories and experiences.</p></div>
      </div>
    </div>`,
    images:["images/casafalarbaixinho/1.jpg","images/casafalarbaixinho/2.jpg","images/casafalarbaixinho/3.jpg"]
  },
  about:{
    title:"About",
    text:`<div class="content-inner">
      <h2>BARDA</h2>
      <div class="bilingual" style="margin-bottom:28px;">
        <div><p class="lang-label">PT</p><p>O Colectivo Barda enfatiza as artes visuais como meio de transformação e capacitação de comunidades periféricas.</p></div>
        <div><p class="lang-label">EN</p><p>Barda Collective emphasises visual arts as a means of transformation and empowerment for peripheral communities.</p></div>
      </div>
      <div class="bios">
        <h3>Who is Barda?</h3>
        <div class="bio"><p class="bio-name">Ana Luísa Rego</p><p>Born in Cinfães (1974), lives in Porto. Master's in Artistic Photography at IPCI.</p></div>
        <div class="bio"><p class="bio-name">Carlos Trancoso</p><p>Born in 1989, visual artist based in Porto. Trained in Architecture at FAUP.</p></div>
        <div class="bio"><p class="bio-name">Diana Sá</p><p>Born in Espinho in 1985. Participated in group exhibitions in Portugal and abroad.</p></div>
      </div>
    </div>`,
    images:[]
  }
};

function buildSwiper(images){
  if(!images || !images.length) return "";
  const slides = images.map(img=>`<div class="swiper-slide"><img src="${img}"></div>`).join("");
  return `<div class="swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}

function initSwiper(){
  swiperInstance = new Swiper(".swiper",{
    loop:true,
    pagination:{el:".swiper-pagination"},
    navigation:{nextEl:".swiper-button-next",prevEl:".swiper-button-prev"}
  });
}

function openProject(key){
  const item = projectData[key];
  contentContainer.innerHTML = `${item.text}${buildSwiper(item.images)}`;
  overlay.style.display = "flex";
  worldElement.style.zIndex = "0";

  if(currentLang === "en"){
    document.querySelectorAll(".bilingual > div:nth-child(1)").forEach(el => el.style.display = "none");
    document.querySelectorAll(".bilingual > div:nth-child(2)").forEach(el => { el.style.display = "block"; el.parentElement.style.gridTemplateColumns = "1fr"; });
  } else {
    document.querySelectorAll(".bilingual > div:nth-child(1)").forEach(el => el.style.display = "block");
    document.querySelectorAll(".bilingual > div:nth-child(2)").forEach(el => { el.style.display = "none"; el.parentElement.style.gridTemplateColumns = "1fr"; });
  }

  contentContainer.scrollTop = 0;
  if(item.images && item.images.length){ setTimeout(()=>{ initSwiper(); },100); }
}

addSafeClick(closeBtn, () => {
  overlay.style.display = "none";
  worldElement.style.zIndex = "10";
  contentContainer.innerHTML = "";
  if(swiperInstance){ swiperInstance.destroy(); swiperInstance = null; }
});

// ── Physics ──────────────────────────────────────────────────────────────────

const Engine = Matter.Engine, Runner = Matter.Runner, Bodies = Matter.Bodies, Composite = Matter.Composite, Mouse = Matter.Mouse, MouseConstraint = Matter.MouseConstraint;
const engine = Engine.create();
engine.gravity.y = 1.2;
const world = engine.world;

const W = window.innerWidth, H = window.innerHeight, cx = W / 2, cy = H / 2;
const floorY = H - 48;

const floor = Bodies.rectangle(W/2, floorY + 30, W, 60, {isStatic:true});
const leftWall = Bodies.rectangle(-30, H/2, 60, H, {isStatic:true});
const rightWall = Bodies.rectangle(W+30, H/2, 60, H, {isStatic:true});
Composite.add(world,[floor,leftWall,rightWall]);

function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

const items = [
  { label:"Membrana", key:"membrana", x: cx - W*0.22, y: cy - H*0.55, w: clampW(190), h:54 },
  { label:"Porvir", key:"porvir", x: cx + W*0.04, y: cy - H*0.70, w: clampW(140), h:54 },
  { label:"Imagens Verdes", key:"imagens", x: cx + W*0.20, y: cy - H*0.62, w: clampW(240), h:54 },
  { label:"Casa de Falar Baixinho",key:"casa", x: cx - W*0.04, y: cy - H*0.85, w: clampW(320), h:54 },
  { label:"About", key:"about", x: cx + W*0.28, y: cy - H*0.78, w: clampW(130), h:54 }
];

items.forEach(item => {
  const body = Bodies.rectangle(item.x, item.y, item.w, item.h, { restitution:0.1, friction:0.8, frictionAir:0.02 });
  Composite.add(world,body);

  const el = document.createElement("div");
  el.className = "physics-button";
  el.innerHTML = item.label;
  worldElement.appendChild(el);

  let _px, _py;
  el.addEventListener("pointerdown", e => { _px = e.clientX; _py = e.clientY; });
  el.addEventListener("pointerup", e => {
    const dx = e.clientX - _px, dy = e.clientY - _py;
    if(Math.sqrt(dx*dx + dy*dy) < 6){ openProject(item.key); }
  });

  item.body = body;
  item.el = el;
});

const mouse = Mouse.create(document.body);
const mouseConstraint = MouseConstraint.create(engine,{ mouse:mouse, constraint:{ stiffness:0.2, render:{ visible:false } } });
Composite.add(world,mouseConstraint);

const runner = Runner.create();
Runner.run(runner,engine);

function update(){
  items.forEach(item => {
    const body = item.body;
    item.el.style.width = item.w + "px";
    item.el.style.height = item.h + "px";
    item.el.style.left = (body.position.x - item.w/2) + "px";
    item.el.style.top = (body.position.y - item.h/2) + "px";
    item.el.style.transform = `rotate(${body.angle}rad)`;
  });
  requestAnimationFrame(update);
}
update();

window.addEventListener("resize",()=>{ location.reload(); });
</script>

</body>
</html>
