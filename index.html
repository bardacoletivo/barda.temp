<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BARDA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f4fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
  --nav-w:280px;
  --header-h:90px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body, * { cursor: none !important; }

#custom-cursor-container {
  position: fixed; top: 0; left: 0; width: 0; height: 0;
  pointer-events: none; z-index: 9999; display: block;
}
.cursor-circle {
  position: absolute; width: 16px; height: 16px;
  background-color: var(--blue); border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease;
  display: flex; align-items: center; justify-content: center;
  z-index: 2; will-change: left, top;
}
.cursor-dot {
  position: absolute; width: 4px; height: 4px;
  background-color: black; border-radius: 50%;
  transform: translate(-50%, -50%); z-index: 1; will-change: left, top;
}
#custom-cursor-container.grow .cursor-circle { width: 38px; height: 38px; }
#custom-cursor-container.plus .cursor-circle { width: 28px; height: 28px; }
#custom-cursor-container.plus .cursor-circle::after {
  content: '+'; color: white; font-family: Arial, sans-serif;
  font-size: 16px; font-weight: bold; position: absolute;
}
#custom-cursor-container.plus .cursor-dot { display: none; }

@media (max-width: 1024px) {
  html, body, * { cursor: auto !important; }
  #custom-cursor-container { display: none !important; }
}

html, body{
  margin:0; width:100%; height:100%; overflow:hidden;
  background:#f3f6fa; font-family:'IBM Plex Sans',sans-serif; color:black;
}
#site-wrap{
  position:fixed; inset:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1); will-change:transform;
}
#site-wrap.nav-open{ transform:translateX(calc(-1 * var(--nav-w))); }

/* ── HEADER DESKTOP PADRÃO ── */
.logo{
  position:fixed; top:20px; right:24px; z-index:500;
  font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:500;
  color:var(--blue); cursor:pointer; margin:0; line-height:1;
}
.hamburger{
  position:fixed; top:50px; right:24px; z-index:500; width:32px;
  display:flex; flex-direction:column; gap:6px;
  cursor:pointer; padding:4px 0; background:transparent; border:none; touch-action:manipulation;
}
.hamburger span{ display:block; height:2px; background:var(--blue); }

.lang-toggle{
  position:fixed; top:20px; left:24px; z-index:500;
  font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:500;
  border:1px solid black; background:white; padding:5px 12px; cursor:pointer;
  touch-action:manipulation; transition:background .2s,color .2s,border-color .2s;
}
.lang-toggle:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* Contentor invisível em desktop, serve para blindar o mobile */
.mobile-header-container { display: none; }

/* ── STATEMENT ── */
.statement{
  position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
  width:min(640px,82vw); text-align:center;
  font-family:'Space Grotesk',sans-serif; font-size:22px; line-height:1.35;
  z-index:1; pointer-events:none;
  min-height:3.5em;
}
.statement .typed-cursor, .overlay-content .typed-cursor {
  color: var(--blue); font-weight:300; opacity:1;
  animation: typedBlink 0.7s infinite;
}
@keyframes typedBlink{ 0%,100%{opacity:1} 50%{opacity:0} }

#world{ position:fixed; inset:0; overflow:hidden; z-index:10; touch-action:none; }

.logo,.hamburger,.lang-toggle,.close-button,
.nav-menu,.nav-overlay{ pointer-events:auto; }

/* Botões normais de texto */
.physics-button{
  position:absolute; display:flex; align-items:center; justify-content:center;
  padding:12px 18px; border:1px solid black; background:white;
  font-family:'Space Grotesk',sans-serif; font-size:20px; cursor:pointer;
  user-select:none; white-space:nowrap;
  min-width:80px; max-width:min(340px,80vw);
  touch-action:none; transition:background .15s,color .15s,border-color .15s;
  border-radius: 0;
}
.physics-button:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* Botões de Destaque Azul (Sobre e Estivemos Aqui) */
.physics-button.featured-blue {
  background: var(--blue);
  color: white;
  border: 1px solid var(--blue);
}
.physics-button.featured-blue:hover {
  background: white;
  color: var(--blue);
  border-color: var(--blue);
}

/* Botões de ícones */
.physics-icon-button {
  position:absolute; display:flex; align-items:center; justify-content:center;
  background:var(--blue); border:1px solid var(--blue); cursor:pointer;
  touch-action:none; transition:background .15s, border-color .15s;
  border-radius: 0;
}
.physics-icon-button svg {
  transition: fill .15s;
}
.physics-icon-button:hover {
  background: white;
  border-color: var(--blue);
}
.physics-icon-button:hover svg {
  fill: var(--blue);
}

.nav-overlay{ display:none; position:fixed; inset:0; z-index:550; background:rgba(0,0,0,.15); }
.nav-overlay.open{ display:block; }

.nav-menu{
  position:fixed; top:0; right:calc(-1 * var(--nav-w));
  width:var(--nav-w); height:100%; background:white;
  border-left:1px solid #e0e0e0; z-index:600;
  display:flex; flex-direction:column;
  padding:80px 32px 32px 32px; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  transition:right .32s cubic-bezier(.4,0,.2,1);
}
.nav-menu.open{ right:0; }
.nav-menu-close{
  position:absolute; top:0; left:0; width:35px; height:35px;
  border:none; background:var(--blue); color:white; font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; touch-action:manipulation;
}
.nav-about-label{
  font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:500;
  letter-spacing:.1em; text-transform:uppercase; color:var(--blue);
  margin:0 0 20px 0; text-align:left;
  cursor:pointer; background:none; border:none; padding:0; touch-action:manipulation;
}
.nav-about-label:hover{ opacity:.7; }
.nav-divider{ border:none; border-top:1px solid #e0e0e0; margin:20px 0; }
.nav-project-btn{
  font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:400;
  background:none; border:none; padding:12px 0;
  cursor:pointer; text-align:right; width:100%; color:black;
  touch-action:manipulation; transition:color .15s;
}
.nav-project-btn:hover{ color:var(--blue); }

.overlay-container{
  display:none; position:fixed;
  top:var(--header-h); left:0; right:0; bottom:20px;
  align-items:center; justify-content:center;
  z-index:300; pointer-events:none; padding:12px 4vw;
}
.overlay-container.active{ display:flex; }
.overlay-content{
  width:min(980px,92vw); height:100%;
  display:flex; flex-direction:column; position:relative;
  border:2px solid var(--blue); background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px); pointer-events:auto; overflow:hidden;
}
.close-button{
  position:absolute; top:0; right:0; width:35px; height:35px;
  border:none; background:var(--blue); color:white; font-size:22px; cursor:pointer;
  z-index:10; display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; flex-shrink:0;
}
#content{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:52px 52px 52px 52px; margin-top:35px; padding-top:16px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; stroke-color:var(--blue) transparent;
}
#content::-webkit-scrollbar{ width:4px; }
#content::-webkit-scrollbar-track{ background:transparent; }
#content::-webkit-scrollbar-thumb{ background:var(--blue); border-radius:0; }
#content::-webkit-scrollbar-button{ display:none; }

.content-inner{ max-width:760px; }
.content-inner h2{ margin:0 0 18px 0; font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:500; min-height: 1.2em; }
.content-inner p{ margin:0 0 18px 0; font-size:16px; line-height:1.65; }

.btn-visit{
  display:inline-block; padding:10px 20px; border:1px solid var(--blue);
  color:var(--blue); text-decoration:none; font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:500; margin-bottom:30px; transition:all .2s;
}
.btn-visit:hover{ background:var(--blue); color:white; }

.bios{ margin-top:40px; border-top:1px solid #e0e0e0; padding-top:32px; }
.bios h3{ font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--blue); text-transform:uppercase; margin:0 0 28px 0; }
.bio{ margin-bottom:32px; padding-bottom:32px; border-bottom:1px solid #f0f0f0; }
.bio:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
.bio-name{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:500; margin:0 0 10px 0; }
.bio p{ font-size:14px; line-height:1.65; color:#333; margin:0; }

.swiper-button-next, .swiper-button-prev {
  --swiper-navigation-size: 28px;
  width: 32px;
  height: 32px;
}
.swiper{ width:100%; height:55vh; margin: 24px 0; }
.swiper-slide{ display:flex; align-items:center; justify-content:center; }
.swiper-slide img{ width:100%; height:100%; object-fit:contain; cursor:zoom-in; }
.swiper-button-next,.swiper-button-prev{ color:var(--blue); }
.swiper-pagination-bullet-active{ background:var(--blue); }

/* Estilos adicionais para imagem estática sem zoom */
.static-image-container { width:100%; height:55vh; margin: 24px 0; display:flex; align-items:center; justify-content:center; }
.static-image-container img { width:100%; height:100%; object-fit:contain; cursor:default !important; }

#lightbox{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.98); z-index:2000;
  flex-direction:column; align-items:center; justify-content:center;
}
#lightbox.active{ display:flex; }
.lightbox-close{
  position:absolute; top:20px; right:24px; width:44px; height:44px;
  border:none; background:none; color:white; font-size:40px; cursor:pointer;
  z-index:2100; touch-action:manipulation;
}
.swiper-lightbox{ width:100%; height:100%; margin-top:0; }
.swiper-lightbox .swiper-slide img{ max-width:95vw; max-height:90vh; object-fit:contain; cursor:default; }
.swiper-lightbox .swiper-button-next,
.swiper-lightbox .swiper-button-prev{ color:white; }

/* ── LAYOUT RESPONSIVO GERAL (TABLETS / PHONES) ── */
@media(max-width:768px){
  :root { --nav-w: 240px; --header-h: 70px; }
  
  /* Ocultar elementos fixed soltos que causavam bugs de estouro de caixa no iOS */
  #site-wrap > .logo, 
  #site-wrap > .hamburger, 
  #site-wrap > .lang-toggle { 
    display: none !important; 
  }

  /* Criação de uma barra nativa mecânica e imune a cortes de overflow */
  .mobile-header-container {
    display: flex !important;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: transparent;
    z-index: 500;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: none;
  }
  .mobile-header-container * { pointer-events: auto; }
  
  /* Alinhamento flexível que impede colisões e mantém consistência visual */
  .mobile-header-container .lang-toggle { position: static; padding: 5px 12px; font-size: 13px; }
  
  .mobile-right-actions {
    display: flex;
    align-items: center;
    gap: 20px; /* Margem controlada entre o Hambúrguer e o Logótipo */
  }
  .mobile-header-container .logo { position: static; font-size: 20px; }
  .mobile-header-container .hamburger { 
    position: static; 
    width: 28px; 
    height: auto; 
    display: flex; 
    flex-direction: column; 
    gap: 5px; 
    padding: 4px 0;
  }

  .statement{ width:84vw; font-size:17px; top: 38%; }
  .physics-button{ font-size:15px; padding:10px 14px; }
  .overlay-content{ width:96vw; }
  
  #content{ padding:16px 16px 20px 16px; margin-top:0px; }
  .content-inner h2{ font-size:24px; margin-bottom:12px; padding-right:30px; }
  .swiper, .static-image-container{ height:38vh; }

  .swiper-button-next, .swiper-button-prev {
    --swiper-navigation-size: 18px !important;
    width: 22px !important;
    height: 22px !important;
  }
}

/* ── AJUSTE EXTREMO: IPHONE SE 1ª GERAÇÃO (LARGURAS ATÉ 320PX/360PX) ── */
@media(max-width:360px){
  :root { --header-h: 55px; --nav-w: 215px; }
  .mobile-header-container { padding: 0 12px; }
  .mobile-right-actions { gap: 14px; }
  .mobile-header-container .logo { font-size: 18px; }
  .mobile-header-container .lang-toggle { padding: 4px 9px; font-size: 12px; }
  .mobile-header-container .hamburger { width: 24px; gap: 4px; }

  .statement { font-size: 13px; top: 34%; }
  .physics-button { font-size: 12px !important; padding: 5px 8px !important; }
  
  .nav-menu { padding: 60px 16px 16px 16px; }
  .nav-project-btn { font-size: 14px; padding: 7px 0; }
  
  .overlay-container { bottom: 10px; }
  .content-inner h2 { font-size: 19px; }
  .content-inner p { font-size: 13px; line-height: 1.45; }
  .bio-name { font-size: 14px; }
  .bio p { font-size: 12px; }
}
</style>
</head>
<body>

<div id="custom-cursor-container">
  <div class="cursor-circle"></div>
  <div class="cursor-dot"></div>
</div>

<!-- BARRA DE TOPO EXCLUSIVA MOBILE (Imune a bugs de corte do Safari iOS) -->
<div class="mobile-header-container">
  <button class="lang-toggle mobileLang">EN</button>
  <div class="mobile-right-actions">
    <button class="hamburger mobileHam" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <h1 class="logo mobileLogo">BARDA</h1>
  </div>
</div>

<div id="site-wrap">
  <!-- Elementos Desktop originais mantidos intactos -->
  <h1 class="logo" id="logoHome">BARDA</h1>
  <button class="lang-toggle" id="langToggle">EN</button>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <div class="statement">
    <span id="typed-statement"></span>
  </div>

  <div id="world"></div>

  <div class="overlay-container" id="overlay">
    <div class="overlay-content">
      <button class="close-button" id="close">×</button>
      <div id="content"></div>
    </div>
  </div>
</div>

<div id="lightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <div class="swiper swiper-lightbox">
    <div class="swiper-wrapper" id="lightbox-wrapper"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>
</div>

<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-menu" id="navMenu">
  <button class="nav-menu-close" id="navClose">×</button>
  <button class="nav-about-label" id="navAbout">
    <span class="lang-pt">Sobre</span><span class="lang-en" style="display:none">About</span>
  </button>
  <hr class="nav-divider">
  <button class="nav-project-btn" data-key="membrana">Membrana</button>
  <button class="nav-project-btn" data-key="porvir">Porvir</button>
  <button class="nav-project-btn" data-key="imagens">Imagens Verdes</button>
  <button class="nav-project-btn" data-key="casa">A Casa de Falar Baixinho</button>
  <button class="nav-project-btn" data-key="arquivo">Estivemos aqui!</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
/* ── TAB TYPED EFFECT ── */
(function loopTabTitle() {
  const strings = ["BARDA", "COLETIVO"];
  let wordIndex = 0;
  let charIndex = 5; 
  let isDeleting = false;

  function type() {
    const fullWord = strings[wordIndex];
    if (isDeleting) {
      charIndex = Math.max(1, charIndex - 2);
    } else {
      charIndex = Math.min(fullWord.length, charIndex + 2);
    }
    document.title = fullWord.substring(0, charIndex);
    let typeSpeed = 40; 

    if (!isDeleting && charIndex === fullWord.length) {
      typeSpeed = 2000; 
      isDeleting = true;
    } else if (isDeleting && charIndex === 1) {
      isDeleting = false;
      wordIndex = (wordIndex + 1) % strings.length;
      charIndex = 1; 
      typeSpeed = 200; 
    }
    setTimeout(type, typeSpeed);
  }
  setTimeout(type, 2000);
})();

/* ── REFS ── */
const siteWrap        = document.getElementById("site-wrap");
const overlay          = document.getElementById("overlay");
const content          = document.getElementById("content");
const closeBtn        = document.getElementById("close");
const worldEl         = document.getElementById("world");
const langBtn        = document.getElementById("langToggle");
const hamburger       = document.getElementById("hamburger");
const navMenu         = document.getElementById("navMenu");
const navOverlay      = document.getElementById("navOverlay");
const navClose        = document.getElementById("navClose");
const lightbox        = document.getElementById("lightbox");
const lightboxWrapper = document.getElementById("lightbox-wrapper");
const lightboxClose   = document.getElementById("lightboxClose");
const cursorContainer = document.getElementById("custom-cursor-container");
const cursorCircle    = document.querySelector(".cursor-circle");
const cursorDot       = document.querySelector(".cursor-dot");

let swiperInst = null, swiperLightbox = null, currentLang = "pt", tempImages = [];
const isMobileDevice = window.innerWidth <= 1024;
let mouseX = 0, mouseY = 0, ballX = 0, ballY = 0;
const speed = 0.15;

if (!isMobileDevice) {
  document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    cursorDot.style.left = mouseX + 'px';
    cursorDot.style.top  = mouseY + 'px';
  });
  (function updateSmoothCursor() {
    ballX += (mouseX - ballX) * speed;
    ballY += (mouseY - ballY) * speed;
    cursorCircle.style.left = ballX + 'px';
    cursorCircle.style.top  = ballY + 'px';
    requestAnimationFrame(updateSmoothCursor);
  })();
}

function setupCursorHovers() {
  if (isMobileDevice) return;
  document.querySelectorAll('a, button, .physics-button, .physics-icon-button, .logo, .hamburger, .nav-project-btn, .swiper-button-next, .swiper-button-prev').forEach(el => {
    if (!el.dataset.cursorBound) {
      el.dataset.cursorBound = "true";
      el.addEventListener('mouseenter', () => cursorContainer.classList.add('grow'));
      el.addEventListener('mouseleave', () => cursorContainer.classList.remove('grow'));
    }
  });
}
setupCursorHovers();

/* ── TYPED.JS ── */
const typedStringsPT = [
  "Sempre em construção",
  "Barda é uma manifestação de vontade colaborativa que ganhou a forma de coletivo",
  "enfatiza as artes visuais como meio de transformação e instrumento de empoderamento para comunidades periféricas",
  "utiliza a imagem como ferramenta de intervenção e questionamento.",
  "promovendo a criação de sinergias entre comunidade e território através de diálogos experimentais"
];
const typedStringsEN = [
  "Always in construction",
  "Barda is a manifestation of collaborative will that has taken the form of a collective",
  "emphasizes visual arts as a means of transformation and empowerment for peripheral communities",
  "uses imagery as a tool for intervention and questioning.",
  "promoting the creation of synergies between community and territory through experimental dialogues"
];

let typedInstance = null;
let typedProjectTitleInstance = null; 

function initTyped(lang) {
  if (typedInstance) { typedInstance.destroy(); typedInstance = null; }
  typedInstance = new Typed("#typed-statement", {
    strings: lang === "en" ? typedStringsEN : typedStringsPT,
    typeSpeed: 38,
    backSpeed: 18,
    backDelay: 2800,
    startDelay: 300,
    loop: true,
    smartBackspace: false,
    cursorChar: "|",
  });
}
initTyped("pt");

/* ── LANG SWITCH ── */
function applyLang(lang) {
  const isEN = lang === "en";
  document.querySelectorAll(".lang-pt").forEach(el => el.style.display = isEN ? "none" : "block");
  document.querySelectorAll(".lang-en").forEach(el => el.style.display = isEN ? "block" : "none");
  if (typeof items !== 'undefined') {
    items.forEach(item => { 
      if (item.el && !item.isIcon) item.el.textContent = isEN ? item.labelEN : item.labelPT; 
    });
  }
}

function toggleLanguageGlobal() {
  currentLang = currentLang === "pt" ? "en" : "pt";
  const label = currentLang === "pt" ? "EN" : "PT";
  langBtn.textContent = label;
  document.querySelector(".mobileLang").textContent = label;
  applyLang(currentLang);
  initTyped(currentLang);
}
langBtn.addEventListener("click", toggleLanguageGlobal);
document.querySelector(".mobileLang").addEventListener("click", toggleLanguageGlobal);

/* ── LIGHTBOX ── */
function openLightbox(idx) {
  if (!tempImages.length) return;
  lightboxWrapper.innerHTML = tempImages.map(img => `<div class="swiper-slide"><img src="${img}"></div>`).join("");
  lightbox.classList.add("active");
  if (swiperLightbox) swiperLightbox.destroy();
  swiperLightbox = new Swiper(".swiper-lightbox", {
    initialSlide: idx, loop: true,
    navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
    keyboard: { enabled: true }
  });
}
lightboxClose.addEventListener("click", () => {
  lightbox.classList.remove("active");
  if (swiperLightbox) { swiperLightbox.destroy(); swiperLightbox = null; }
});

/* ── PROJECT DATA ── */
const projectData = {
  membrana:{
    titlePT:"Membrana", titleEN:"Membrana",
    metaPT:"Exposição coletiva · ACERT, Tondela · 2023–2025",
    metaEN:"Collective exhibition · ACERT, Tondela · 2023–2025",
    description:`
      <div class="lang-pt">
        <p>À medida que as interfaces se tornam o lugar recorrente da experiência quotidiana, impõe-se a urgência de reencontrar formas de relação com o mundo que sejam mais atentas, empáticas e porosas. A ubiquidade da mediação digital, ao condensar os gestos num toque e a presença num fluxo de dados, tende a reduzir a vida a uma versão operativa, esvaziando-a de fricção, de espera, de escuta. Contra esse alheamento, que dissocia o corpo do ambiente, importa reativar os sentidos como vias de conhecimento e de relação. Mais do que tudo, importa pensar o mundo não como um conjunto de dados a processar, mas como lugar tangível.</p>
        <p>A partir da figura da membrana, as obras em exposição evocam processos de adaptação sensorial que os corpos desenvolvem na sua relação com o mundo. As membranas regulam trocas de substâncias e de energia entre interior e exterior. São permeáveis, não asseguram a distância; antes permitem a infiltração e a contaminação. Por isso mesmo, contrastam com o modo de operar da interface, que tende a preservar a separação entre corpos, funcionando como superfície de visualização e de tradução.</p>
        <p>Em exposição, multiplicam-se os suportes de impressão de imagem que se desviam da unconventional impressão fotográfica, cedendo lugar a materiais que, pela sua própria natureza, sugerem a ideia de membrana. A importância da matéria é tanto maior quanto se omitem, na folha de sala, os títulos das peças, destacando-se o material: vinil dicróico, látex, tecido de poliéster, acetato...entre outras transparências e películas.</p>
        <p>No seu conjunto, configuram um aparato que convoca os sentidos. Ainda que diante de imagens — muitas delas fotográficas, associadas quase sempre a um referente externo, passado, “real” — não se impõe aqui a ideia de representação, mas antes a de presença. Exemplar, nesse sentido, é a peça em vinil dicróico, que funciona quase como um sumário de intenções porque a sua propriedade de mudar de cor consoante a posição do observador ativa, de forma imediata, a consciência de si no espaço — ver torna-se, aqui, também um modo de se perceber enquanto corpo situado.</p>
        <p style="margin-top: 24px; font-weight: 500; text-align: right; color: var(--blue);">Vera Carmo</p>
      </div>
      <div class="lang-en">
        <p>As interfaces become the recurring place of everyday experience, there is an urgent need to rediscover ways of relating to the world that are more attentive, empathetic, and porous. The ubiquity of digital mediation, by condensing gestures into a single touch and presence into a data stream, tends to reduce life to an operational version, emptying it of friction, waiting, and listening. Against this alienation, which dissociates the body from the environment, it is crucial to reactivate the senses as pathways to knowledge and connection. Above all, it matters to think of the world not as a set of data to be processed, but as a tangible place.</p>
        <p>Starting from the figure of the membrane, the works on display evoke processes of sensory adaptation that bodies develop in their relationship with the world. Membranes regulate exchanges of substances and energy between the interior and exterior. They are permeable, they do not guarantee distance; instead, they allow infiltration and contamination. For this very reason, they contrast with the operational mode of the interface, which tends to preserve the separation between bodies, functioning merely as a surface for display and translation.</p>
        <p>In the exhibition, image printing mediums deviate from conventional photographic prints, giving way to materials that, by their very nature, suggest the idea of a membrane. The importance of matter is highlighted by omitting the titles of the pieces from the gallery text, emphasizing instead the medium: dichroic vinyl, latex, polyester fabric, acetate... among other transparencies and films.</p>
        <p>As a whole, they configure an apparatus that begs the senses. Even when facing images—many of them photographic, almost always associated with an external, past, “real” referent—the idea of representation does not impose itself here, but rather that of presence. Exemplary in this sense is the dichroic vinyl piece, which functions almost as a summary of intentions because its property of changing color depending on the observer's position immediately activates self-awareness in space—seeing becomes, here, also a way of perceiving oneself as a situated body.</p>
        <p style="margin-top: 24px; font-weight: 500; text-align: right; color: var(--blue);">Vera Carmo</p>
      </div>`,

/* ── CAROUSEL ── */
function buildSwiper(imgs, isAbout) {
  if (!imgs || !imgs.length) return "";
  if (isAbout) {
    return `<div class="static-image-container"><img src="${imgs[0]}"></div>`;
  }
  const slides = imgs.map((img, i) => `<div class="swiper-slide"><img src="${img}" onclick="openLightbox(${i})"></div>`).join("");
  return `<div class="swiper main-swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}
function initSwiper() {
  if (swiperInst) swiperInst.destroy();
  swiperInst = new Swiper(".main-swiper", {
    loop: true,
    pagination: { el: ".swiper-pagination" },
    navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }
  });
}
function openProject(key) {
  if (key === "email" || key === "instagram") return;
  const item = projectData[key];
  tempImages = item.images;
  
  if (typedProjectTitleInstance) {
    typedProjectTitleInstance.destroy();
    typedProjectTitleInstance = null;
  }

  let headerHtml = `<div class="content-inner"><h2 id="project-title-typed"></h2>`;
  if (item.metaPT || item.metaEN) {
    headerHtml += `<div style="font-size:13px;color:var(--blue);text-transform:uppercase;margin-bottom:20px;">
      <span class="lang-pt">${item.metaPT}</span>
      <span class="lang-en">${item.metaEN}</span>
    </div>`;
  }
  headerHtml += `</div>`;
  
  content.innerHTML = headerHtml + buildSwiper(item.images, item.isAboutPage) + `<div class="content-inner">${item.description}</div>`;
  overlay.classList.add("active");
  worldEl.style.zIndex = "0";
  applyLang(currentLang);
  content.scrollTop = 0;

  const titleText = currentLang === 'en' ? item.titleEN : item.titlePT;
  
  typedProjectTitleInstance = new Typed("#project-title-typed", {
    strings: [titleText],
    typeSpeed: 40,
    showCursor: false,
    loop: false
  });

  if (item.images && item.images.length && !item.isAboutPage) {
    setTimeout(() => {
      initSwiper();
      const swiperEl = document.querySelector('.main-swiper');
      if (swiperEl && !isMobileDevice) {
        swiperEl.addEventListener('mouseenter', () => cursorContainer.classList.add('plus'));
        swiperEl.addEventListener('mouseleave', () => cursorContainer.classList.remove('plus'));
        
        document.querySelectorAll('.swiper-button-next, .swiper-button-prev').forEach(btn => {
          btn.addEventListener('mouseenter', (e) => {
            e.stopPropagation();
            cursorContainer.classList.remove('plus');
            cursorContainer.classList.add('grow');
          });
          btn.addEventListener('mouseleave', (e) => {
            e.stopPropagation();
            cursorContainer.classList.remove('grow');
            cursorContainer.classList.add('plus');
          });
        });
      }
    }, 100);
  }
  setupCursorHovers();
}
function closeOverlay() {
  overlay.classList.remove("active");
  worldEl.style.zIndex = "10";
  content.innerHTML = "";
  cursorContainer.classList.remove('plus');
  if (swiperInst) { swiperInst.destroy(); swiperInst = null; }
  
  if (typedProjectTitleInstance) {
    typedProjectTitleInstance.destroy();
    typedProjectTitleInstance = null;
  }
}

/* ── PHYSICS ── */
const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;
const engine = Engine.create();
engine.gravity.y = 1.2;
const world = engine.world;

const W = window.innerWidth, H = window.innerHeight;
const cx = W / 2, cy = H / 2;
const floorY = H;

Composite.add(world, [
  Bodies.rectangle(W/2, floorY+30, W, 60, {isStatic:true}), 
  Bodies.rectangle(-30, H/2, 60, H, {isStatic:true}),       
  Bodies.rectangle(W+30, H/2, 60, H, {isStatic:true})        
]);

function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

const mailIconSVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.144C21.69 2.28 24 3.434 24 5.457z"/></svg>`;

const isMicroMobile = window.innerWidth <= 360;
const bHeight = isMicroMobile ? 42 : 54; 
const iconSize = isMicroMobile ? 48 : 60;

const items = [
  { labelPT:"Membrana",               labelEN:"Membrana",               key:"membrana",  x:cx-W*.20, y:cy-H*.55, w:clampW(isMicroMobile ? 120 : 190), h:bHeight, isIcon:false },
  { labelPT:"Porvir",                  labelEN:"Porvir",                  key:"porvir",    x:cx+W*.04, y:cy-H*.70, w:clampW(isMicroMobile ? 90 : 140),  h:bHeight, isIcon:false },
  { labelPT:"Imagens Verdes",         labelEN:"Imagens Verdes",         key:"imagens",   x:cx+W*.20, y:cy-H*.62, w:clampW(isMicroMobile ? 150 : 240), h:bHeight, isIcon:false },
  { labelPT:"Casa de Falar Baixinho", labelEN:"Casa de Falar Baixinho", key:"casa",      x:cx-W*.04, y:cy-H*.85, w:clampW(isMicroMobile ? 195 : 320), h:bHeight, isIcon:false },
  { labelPT:"Estivemos aqui!",        labelEN:"We were here!",          key:"arquivo",   x:cx-W*.15, y:cy-H*.68, w:clampW(isMicroMobile ? 150 : 210), h:bHeight, isIcon:false },
  { labelPT:"Sobre",                  labelEN:"About",                  key:"about",     x:cx+W*.28, y:cy-H*.78, w:clampW(isMicroMobile ? 90 : 130),  h:bHeight, isIcon:false },
  { labelPT:"Email",                  labelEN:"Email",                  key:"email",     x:cx-W*.10, y:cy-H*.92, w:iconSize,                          h:iconSize, isIcon:true, iconSVG:mailIconSVG,  url:"mailto:bardacoletivo@gmail.com" },
  { labelPT:"Instagram",               labelEN:"Instagram",               key:"instagram", x:cx+W*.10, y:cy-H*.95, w:iconSize,                          h:iconSize, isIcon:true, iconSVG:instaIconSVG, url:"https://instagram.com/bardacoletivo" }
];

for (let i = items.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [items[i], items[j]] = [items[j], items[i]];
}

items.forEach((item, index) => {
  const jitterX = (Math.random() - 0.5) * (W * 0.15); 
  const sequentialY = cy - H * 0.6 - (index * 75); 
  const randomAngle = (Math.random() - 0.5) * 0.5;

  item.body = Bodies.rectangle(item.x + jitterX, sequentialY, item.w, item.h, { 
    restitution: .1, 
    friction: .8, 
    frictionAir: .02,
    angle: randomAngle
  });
  
  Composite.add(world, item.body);
  item.el = document.createElement("div");
  
  if (item.isIcon) {
    item.el.className = "physics-icon-button";
    item.el.innerHTML = item.iconSVG;
    item.el.title = item.labelPT;
  } else {
    // Tanto o "about" como o "arquivo" ganham agora a classe de destaque azul
    if(item.key === "about" || item.key === "arquivo") {
      item.el.className = "physics-button featured-blue";
    } else {
      item.el.className = "physics-button";
    }
    item.el.textContent = currentLang === "en" ? item.labelEN : item.labelPT;
  }
  
  worldEl.appendChild(item.el);
  let sX, sY;
  item.el.addEventListener("pointerdown", e => { sX = e.clientX; sY = e.clientY; });
  item.el.addEventListener("pointerup", e => { 
    if (Math.hypot(e.clientX-sX, e.clientY-sY) < 8) {
      if (item.isIcon) {
        if (item.key === "instagram") window.open(item.url, "_blank");
        else window.location.href = item.url;
      } else {
        openProject(item.key); 
      }
    }
  });
});

const mc = MouseConstraint.create(engine, {
  mouse: Mouse.create(worldEl),
  constraint: { stiffness: 0.2, render: { visible: false } }
});
Composite.add(world, mc);
Runner.run(Runner.create(), engine);

let ceilingAdded = false;

(function tick() {
  if (!ceilingAdded) {
    let allButtonsBelowTop = items.every(item => (item.body.position.y - item.h/2) > 10);
    if (allButtonsBelowTop) {
      Composite.add(world, Bodies.rectangle(W/2, -30, W, 60, {isStatic:true}));
      ceilingAdded = true;
    }
  }

  items.forEach(item => {
    item.el.style.width = item.w + "px";
    item.el.style.height = item.h + "px";
    item.el.style.left = (item.body.position.x - item.w/2) + "px";
    item.el.style.top  = (item.body.position.y - item.h/2) + "px";
    item.el.style.transform = `rotate(${item.body.angle}rad)`;
  });
  requestAnimationFrame(tick);
})();

window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - W) > 50) location.reload(); });
</script>
