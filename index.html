<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BARDA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
  --footer-h:44px;
  --nav-w:280px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body{
  margin:0; width:100%; height:100%;
  overflow:hidden;
  background:white;
  font-family:'IBM Plex Sans',sans-serif;
  color:black;
}

/* ── PUSH WRAPPER ─────────────────────────────── */
#site-wrap{
  position:fixed;
  inset:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
#site-wrap.nav-open{
  transform:translateX(calc(-1 * var(--nav-w)));
}

/* ── LOGO ─────────────────────────────────────── */
.logo{
  position:fixed;
  top:20px; right:24px;
  z-index:500;
  font-family:'Space Grotesk',sans-serif;
  font-size:21px; font-weight:500;
  color:var(--blue);
  cursor:pointer;
  margin:0;
  line-height:1;
}

/* ── HAMBURGER ────────────────────────────────── */
.hamburger{
  position:fixed;
  top:50px; right:24px;
  z-index:500;
  width:32px;
  display:flex; flex-direction:column; gap:6px;
  cursor:pointer;
  padding:4px 0;
  background:none; border:none;
  touch-action:manipulation;
}
.hamburger span{
  display:block; height:2px;
  background:var(--blue);
}

/* ── LANG TOGGLE ──────────────────────────────── */
.lang-toggle{
  position:fixed;
  top:20px; left:24px;
  z-index:500;
  font-family:'Space Grotesk',sans-serif;
  font-size:14px; font-weight:500; letter-spacing:.06em;
  border:1px solid black; background:white; color:black;
  padding:5px 12px;
  cursor:pointer; touch-action:manipulation;
  transition:background .15s,color .15s,border-color .15s;
}
.lang-toggle:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* ── STATEMENT ────────────────────────────────── */
.statement{
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:min(640px,82vw);
  text-align:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:22px; line-height:1.35;
  z-index:1;
  pointer-events:none;
}

/* ── PHYSICS WORLD ────────────────────────────── */
#world{
  position:fixed; inset:0;
  overflow:hidden; z-index:10;
  touch-action:none;
}

/* ── UI LAYER ─────────────────────────────────── */
.logo, .hamburger, .lang-toggle, .close-button, .nav-menu, .nav-overlay, .site-footer{
  pointer-events:auto;
}

/* ── PHYSICS BUTTONS ──────────────────────────── */
.physics-button{
  position:absolute;
  display:flex; align-items:center; justify-content:center;
  padding:12px 18px;
  border:1px solid black; background:white; color:black;
  font-family:'Space Grotesk',sans-serif; font-size:20px;
  cursor:pointer; user-select:none; white-space:nowrap;
  min-width:80px; max-width:min(340px,80vw);
  touch-action:none;
  transition:background .15s,color .15s,border-color .15s;
}
.physics-button:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* ── NAV OVERLAY ──────────────────────────────── */
.nav-overlay{
  display:none;
  position:fixed; inset:0;
  z-index:550;
  background:rgba(0,0,0,.15);
}
.nav-overlay.open{ display:block; }

/* ── NAV MENU ─────────────────────────────────── */
.nav-menu{
  position:fixed;
  top:0; right:calc(-1 * var(--nav-w));
  width:var(--nav-w); height:100%;
  background:white;
  border-left:1px solid #e0e0e0;
  z-index:600;
  display:flex; flex-direction:column;
  padding:80px 32px 32px 32px;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  transition:right .32s cubic-bezier(.4,0,.2,1);
}
.nav-menu.open{ right:0; }

.nav-menu-close{
  position:absolute; top:0; left:0;
  width:35px; height:35px;
  border:none; background:var(--blue); color:white;
  font-size:28px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

.nav-about-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--blue);
  margin:0 0 20px 0; text-align:left;
  cursor:pointer; background:none; border:none; padding:0;
}
.nav-about-label:hover{ opacity:.7; }

.nav-divider{ border:none; border-top:1px solid #e0e0e0; margin:20px 0; }

.nav-project-btn{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px; font-weight:400;
  background:none; border:none;
  padding:12px 0;
  cursor:pointer; text-align:right; width:100%; color:black;
  transition:color .15s;
}
.nav-project-btn:hover{ color:var(--blue); }

/* ── OVERLAY (Project Windows) ────────────────── */
.overlay-container{
  display:none;
  position:fixed; inset:0;
  align-items:flex-start; justify-content:center;
  z-index:300;
  pointer-events:none;
}
.overlay-container.active{ display:flex; }

.overlay-content{
  width:min(980px,92vw);
  margin-top:90px;
  height:calc(100vh - 90px - var(--footer-h) - 16px);
  display:flex; flex-direction:column;
  position:relative;
  border:2px solid var(--blue);
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  pointer-events:auto;
}

.close-button{
  position:absolute; top:0; right:0;
  width:35px; height:35px;
  border:none; background:var(--blue); color:white;
  font-size:28px; line-height:1;
  cursor:pointer; z-index:10;
  display:flex; align-items:center; justify-content:center;
}

#content{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:52px 52px 52px 52px;
  -webkit-overflow-scrolling:touch;
  /* Firefox */
  scrollbar-width: thin;
  scrollbar-color: var(--blue) transparent;
}

/* ── SCROLLBAR STYLING ── */
#content::-webkit-scrollbar {
  width: 6px;
}
#content::-webkit-scrollbar-track {
  background: transparent;
}
#content::-webkit-scrollbar-thumb {
  background-color: var(--blue);
  border-radius: 0;
}
#content::-webkit-scrollbar-button {
  display: none;
}

/* ── BILINGUAL SYSTEM ─────────────────────────── */
.bilingual-block{
  display:static; grid-template-columns:1fr 1fr;
  gap:0 40px; margin-bottom:18px;
}
@media(max-width:600px){ .bilingual-block{ grid-template-columns:1fr; } }

.lang-label{
  font-size:11px; font-weight:500; letter-spacing:.08em;
  color:var(--blue); text-transform:uppercase;
  margin-bottom:6px !important;
}

/* ── BIOS ─────────────────────────────────────── */
.bios{ margin-top:40px; border-top:1px solid #e0e0e0; padding-top:32px; }
.bios h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--blue); margin:0 0 28px 0;
}
.bio{ margin-bottom:32px; padding-bottom:32px; border-bottom:1px solid #f0f0f0; }
.bio:last-child{ border-bottom:none; }
.bio-name{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:500; margin:0 0 10px 0; }
.bio p{ font-size:14px; line-height:1.65; color:#333; margin:0; }

/* ── CONTENT INNER ────────────────────────────── */
.content-inner{ max-width:800px; }
.content-inner h2{ margin:0 0 18px 0; font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:500; }
.content-inner p{ margin:0 0 18px 0; font-size:15px; line-height:1.65; }

/* ── SWIPER ───────────────────────────────────── */
.swiper{ width:100%; height:58vh; margin-top:34px; }
.swiper-slide img{ width:100%; height:100%; object-fit:contain; }
.swiper-button-next,.swiper-button-prev{ color:var(--blue); }
.swiper-pagination-bullet-active{ background:var(--blue); }

/* ── FOOTER ───────────────────────────────────── */
.site-footer{
  position:fixed; bottom:0; left:0; right:0;
  z-index:40; background:var(--blue); color:white;
  display:flex; align-items:center; justify-content:center;
  gap:28px; height:var(--footer-h);
  font-family:'Space Grotesk',sans-serif; font-size:13px;
}
.site-footer a{ color:white; text-decoration:none; opacity:.85; }

@media(max-width:768px){
  .statement{ width:84vw; font-size:18px; }
  .physics-button{ font-size:17px; padding:10px 14px; }
  .overlay-content{ width:96vw; margin-top:88px; height:calc(100vh - 88px - var(--footer-h) - 12px); }
  #content{ padding:52px 20px 20px 20px; }
  .content-inner h2{ font-size:26px; }
  .swiper{ height:40vh; }
}
</style>
</head>

<script>
const siteWrap   = document.getElementById("site-wrap");
const overlay    = document.getElementById("overlay");
const content    = document.getElementById("content");
const closeBtn   = document.getElementById("close");
const worldEl    = document.getElementById("world");
const langBtn    = document.getElementById("langToggle");
const hamburger  = document.getElementById("hamburger");
const navMenu    = document.getElementById("navMenu");
const navOverlay = document.getElementById("navOverlay");
const navClose   = document.getElementById("navClose");

let swiperInst = null;
let currentLang = "pt";

/* ── LANGUAGE ENGINE ──────────────────────────── */
function applyLang(lang){
  const isEN = lang === "en";
  document.querySelectorAll(".lang-pt").forEach(el => el.style.display = isEN ? "none" : "block");
  document.querySelectorAll(".lang-en").forEach(el => el.style.display = isEN ? "block" : "none");
  document.querySelectorAll(".bilingual-block").forEach(b => {
    const pt = b.querySelector(".pt-col");
    const en = b.querySelector(".en-col");
    if(pt && en){
      pt.style.display = isEN ? "none" : "block";
      en.style.display = isEN ? "block" : "none";
    }
  });
  items.forEach(item => {
    if(item.key === "about") item.el.textContent = isEN ? "About" : "Sobre";
  });
}

langBtn.addEventListener("click", () => {
  currentLang = currentLang === "pt" ? "en" : "pt";
  langBtn.textContent = currentLang === "pt" ? "EN" : "PT";
  applyLang(currentLang);
});

/* ── PROJECT DATA ─────────────────────────────── */
const projectData = {
  membrana:{
    title:"Membrana",
    text:`<div class="content-inner">
      <h2>Membrana</h2>
      <div class="lang-subheader" style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">
        <span class="lang-pt">Exposição coletiva · ACERT, Tondela · 2023–2025</span>
        <span class="lang-en">Collective exhibition · ACERT, Tondela · 2023–2025</span>
      </div>
      <div class="bilingual-block">
        <div class="pt-col">
          <p class="lang-label">PT</p>
          <p>Todas as pessoas vivem vidas diferentes, mas há coisas que fazem parte da experiência coletiva que partilhamos como seres humanos: uma delas é a experiência de navegação no mundo exterior.</p>
          <p>De manhã, quando trocamos de roupa para sair de casa, durante quanto tempo sentimos a roupa na nossa pele? Ao sair de casa, quanto tempo demoramos até deixarmos de sentir o desconforto da temperatura? E o ruído dos automóveis na calçada? Quanto desse ruído desaparece quando encontramos alguém conhecido na rua e ficamos a conversar?</p>
          <p>O corpo e a mente humana estabelecem diversas ferramentas para nos podermos guiar nessa navegação. A exposição, partindo do conceito científico de adaptação sensorial - uma ferramenta que equilibra a sensibilidade dos estímulos que recebemos - é uma passagem que convoca os visitantes a reflectir sobre os sentidos alargando os domínios da percepção.</p>
          <p>É na ligação entre o público e o privado que surge a concepção da "Membrana", expandindo as formas de ver para refletir sobre as conexões entre as pessoas. Ao atravessar essa membrana entre o público e o privado, a exposição revela interstícios invisíveis que formam a base da construção do ser social e dos territórios em que vivemos.</p>
          <p>Através de dispositivos que exploram a cor, o movimento e a interface entre os sentidos e a realidade, a exposição apresenta uma abstração e desconstrução do quotidiano, expondo camadas mais profundas da compreensão da realidade. Assim, a imersão torna-se um elemento-chave na experiência proposta, abrindo espaço para que os visitantes se envolvam num diálogo interno.</p>
        </div>
        <div class="en-col">
          <p class="lang-label">EN</p>
          <p>All people live different lives, but there are things that are part of the collective experience we share as human beings: one of them is the experience of navigating the external world.</p>
          <p>In the morning, when we change clothes to leave home, how long do we feel the clothes on our skin? When leaving home, how long does it take until we stop feeling the discomfort of the temperature? And the noise of cars on the sidewalk? How much of that noise disappears when we encounter someone we know on the street and start talking?</p>
          <p>The human body and mind establish various tools for us to navigate this journey. The exhibition, starting from the scientific concept of sensory adaptation - a tool that balances the sensitivity of the stimuli we receive - is a passage that calls visitors to reflect on the senses, expanding the domains of perception.</p>
          <p>It is in the connection between the public and the private that the conception of the "Membrane" arises, expanding the ways of seeing to reflect on the connections between people. By crossing this membrane between the public and the private, the exhibition reveals invisible interstices that form the basis of the construction of social beings and the territories in which we live.</p>
          <p>Through devices that explore color, movement, and the interface between senses and reality, the exhibition presents an abstraction and deconstruction of the everyday, exposing deeper layers of understanding reality. Thus, immersion becomes a key element in the proposed experience, opening space for visitors to engage in internal dialogue.</p>
        </div>
      </div>
    </div>`,
    images:["images/membrana/1.jpg","images/membrana/2.jpg","images/membrana/3.jpg","images/membrana/4.jpg","images/membrana/5.jpg","images/membrana/6.jpg","images/membrana/7.jpg","images/membrana/8.jpg","images/membrana/9.jpg","images/membrana/10.jpg","images/membrana/11.jpg"]
  },
  porvir:{
    title:"Porvir",
    text:`<div class="content-inner">
      <h2>Porvir</h2>
      <div class="lang-subheader" style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">
        <span class="lang-pt">Projeto de arte participativa · Serra do Açor · 2024</span>
        <span class="lang-en">Participatory art project · Serra do Açor · 2024</span>
      </div>
      <div class="bilingual-block">
        <div class="pt-col">
          <p class="lang-label">PT</p>
          <p>Porvir é um projeto de intercâmbio multidisciplinar que envolve artistas locais, artistas externos e a comunidade, com o objetivo de imaginar o futuro através da arte participativa. Focado em quatro aldeias da Serra do Açor, o Porvir procura, através da expressão artística, construir um espaço de partilha, investigação, criação e exposição, estimulando o pensamento crítico das comunidades envolvidas.</p>
          <p>Oficinas participativas são realizadas em três aldeias diferentes, onde artistas e membros da comunidade colaboram em projetos únicos. Cada aldeia acolhe um artista em residência, que desenvolve obras originais inspiradas nas experiências e dinâmicas locais. O projeto culmina em exposições coletivas no espaço público, promovendo discussões abertas e trocas de ideias entre participantes, público e instituições.</p>
        </div>
        <div class="en-col">
          <p class="lang-label">EN</p>
          <p>Porvir is a multidisciplinary exchange project involving local artists, external artists, and the community, aimed at envisioning the future through participatory art. Focused on four villages in the Serra do Açor region, Porvir seeks, through artistic expression, to build a space for sharing, research, creation, and exhibition, while stimulating the critical thinking of the involved communities.</p>
          <p>Participatory workshops are held in three different villages, where artists and community members collaborate on unique projects. Each village host an artist-in-residence, who develops original artworks inspired by local experiences and dynamics. The project culminates in collective exhibitions in the public space, promoting open discussions and idea exchanges among participants, the public, and institutions.</p>
        </div>
      </div>
    </div>`,
    images: ["images/porvir/1.jpg", "images/porvir/2.jpg", "images/porvir/3.jpg", "images/porvir/4.jpg", "images/porvir/5.jpg", "images/porvir/6.jpg", "images/porvir/7.jpg", "images/porvir/8.jpg", "images/porvir/9.jpg", "images/porvir/10.jpg", "images/porvir/11.jpg", "images/porvir/12.jpg", "images/porvir/13.jpg", "images/porvir/14.jpg", "images/porvir/15.jpg", "images/porvir/16.jpg", "images/porvir/17.jpg", "images/porvir/18.jpg", "images/porvir/19.jpg", "images/porvir/20.jpg", "images/porvir/21.jpg", "images/porvir/22.jpg", "images/porvir/23.jpg", "images/porvir/24.jpg", "images/porvir/25.jpg", "images/porvir/26.jpg", "images/porvir/27.jpg", "images/porvir/28.jpg", "images/porvir/29.jpg", "images/porvir/30.jpg", "images/porvir/31.jpg", "images/porvir/32.jpg", "images/porvir/33.jpg", "images/porvir/34.jpg", "images/porvir/35.jpg", "images/porvir/36.jpg"]
  },
  imagens:{
    title:"Imagens Verdes",
    text:`<div class="content-inner">
      <h2>Imagens Verdes</h2>
      <div class="lang-subheader" style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">
        <span class="lang-pt">Oficinas de expressão artística · Porto · 2023–2025</span>
        <span class="lang-en">Artistic expression workshops · Porto · 2023–2025</span>
      </div>
      <div class="bilingual-block">
        <div class="pt-col">
          <p class="lang-label">PT</p>
          <p>Imagens Verdes é um projeto contínuo de transformação que reúne pessoas com 65 ou mais anos para uma exploração única da autoexpressão. Através de oficinas dinâmicas que integram teatro, música, ilustração e fotografia, os participantes mergulham nas suas memórias, partilhando experiências entre si.</p>

/* ── UI HELPERS ───────────────────────────────── */
function openProject(key){
  const item = projectData[key];
  content.innerHTML = item.text + buildSwiper(item.images);
  overlay.classList.add("active");
  worldEl.style.zIndex = "0";
  applyLang(currentLang);
  content.scrollTop = 0;
  if(item.images.length){ setTimeout(initSwiper, 80); }
}

function closeOverlay(){
  overlay.classList.remove("active");
  worldEl.style.zIndex = "10";
  content.innerHTML = "";
  if(swiperInst){ swiperInst.destroy(); swiperInst = null; }
}

function buildSwiper(images){
  if(!images.length) return "";
  const slides = images.map(img=>`<div class="swiper-slide"><img src="${img}"></div>`).join("");
  return `<div class="swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}

function initSwiper(){
  swiperInst = new Swiper(".swiper",{ loop:true, pagination:{el:".swiper-pagination"}, navigation:{nextEl:".swiper-button-next",prevEl:".swiper-button-prev"} });
}

/* ── PHYSICS ENGINE ───────────────────────────── */
const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;
const engine = Engine.create();
engine.gravity.y = 1.2;
const world = engine.world;
const W = window.innerWidth;
const H = window.innerHeight;
const cx = W / 2;
const cy = H / 2;
const FOOTER_H = 44;
const floorY = H - FOOTER_H;

const floor     = Bodies.rectangle(W/2, floorY + 30, W, 60, {isStatic:true});
const leftWall  = Bodies.rectangle(-30, H/2, 60, H, {isStatic:true});
const rightWall = Bodies.rectangle(W+30, H/2, 60, H, {isStatic:true});
Composite.add(world, [floor, leftWall, rightWall]);

function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

const items = [
  { labelPT:"Membrana", labelEN:"Membrana", key:"membrana", x:cx-W*.22, y:cy-H*.55, w:clampW(190), h:54 },
  { labelPT:"Porvir", labelEN:"Porvir", key:"porvir", x:cx+W*.04, y:cy-H*.70, w:clampW(140), h:54 },
  { labelPT:"Imagens Verdes", labelEN:"Imagens Verdes", key:"imagens", x:cx+W*.20, y:cy-H*.62, w:clampW(240), h:54 },
  { labelPT:"Casa de Falar Baixinho", labelEN:"Casa de Falar Baixinho", key:"casa", x:cx-W*.04, y:cy-H*.85, w:clampW(320), h:54 },
  { labelPT:"Sobre", labelEN:"About", key:"about", x:cx+W*.28, y:cy-H*.78, w:clampW(130), h:54 }
];

items.forEach(item => {
  const body = Bodies.rectangle(item.x, item.y, item.w, item.h, { restitution:.1, friction:.8, frictionAir:.02 });
  Composite.add(world, body);
  const el = document.createElement("div");
  el.className = "physics-button";
  el.textContent = currentLang === "en" ? item.labelEN : item.labelPT;
  worldEl.appendChild(el);
  let sX, sY;
  el.addEventListener("pointerdown", e => { sX = e.clientX; sY = e.clientY; });
  el.addEventListener("pointerup", e => { if(Math.hypot(e.clientX-sX, e.clientY-sY) < 8) openProject(item.key); });
  item.body = body; item.el = el;
});

const mouse = Mouse.create(worldEl);
const mc = MouseConstraint.create(engine, { mouse, constraint:{ stiffness:.2, render:{ visible:false } } });
Composite.add(world, mc);
Runner.run(Runner.create(), engine);

function tick(){
  items.forEach(({ body, el, w, h }) => {
    el.style.width = w + "px"; el.style.height = h + "px";
    el.style.left = (body.position.x - w/2) + "px"; el.style.top = (body.position.y - h/2) + "px";
    el.style.transform = `rotate(${body.angle}rad)`;
  });
  requestAnimationFrame(tick);
}
tick();

/* ── NAV & GLOBAL ─────────────────────────────── */
hamburger.addEventListener("click", () => { navMenu.classList.add("open"); navOverlay.classList.add("open"); siteWrap.classList.add("nav-open"); });
const closeNav = () => { navMenu.classList.remove("open"); navOverlay.classList.remove("open"); siteWrap.classList.remove("nav-open"); };
navClose.addEventListener("click", closeNav);
navOverlay.addEventListener("click", closeNav);
closeBtn.addEventListener("click", closeOverlay);
document.getElementById("logoHome").addEventListener("click", closeOverlay);
document.getElementById("navAbout").addEventListener("click", () => { closeNav(); openProject("about"); });
document.querySelectorAll(".nav-project-btn").forEach(btn => btn.addEventListener("click", () => { closeNav(); openProject(btn.dataset.key); }));

window.addEventListener("load", () => { 
  const logoW = document.getElementById("logoHome").offsetWidth; 
  if(logoW > 0) hamburger.style.width = logoW + "px"; 
  applyLang(currentLang); 
});
window.addEventListener("resize", () => location.reload());
</script>
