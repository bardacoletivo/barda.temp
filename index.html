<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BARDA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f4fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
  --nav-w:280px;
  --header-h:90px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body, * { cursor: none !important; }

#custom-cursor-container {
  position: fixed; top: 0; left: 0; width: 0; height: 0;
  pointer-events: none; z-index: 9999; display: block;
}
.cursor-circle {
  position: absolute; width: 16px; height: 16px;
  background-color: var(--blue); border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease;
  display: flex; align-items: center; justify-content: center;
  z-index: 2; will-change: left, top;
}
.cursor-dot {
  position: absolute; width: 4px; height: 4px;
  background-color: black; border-radius: 50%;
  transform: translate(-50%, -50%); z-index: 1; will-change: left, top;
}
#custom-cursor-container.grow .cursor-circle { width: 38px; height: 38px; }
#custom-cursor-container.plus .cursor-circle { width: 28px; height: 28px; }
#custom-cursor-container.plus .cursor-circle::after {
  content: '+'; color: white; font-family: Arial, sans-serif;
  font-size: 16px; font-weight: bold; position: absolute;
}
#custom-cursor-container.plus .cursor-dot { display: none; }

@media (max-width: 1024px) {
  html, body, * { cursor: auto !important; }
  #custom-cursor-container { display: none !important; }
}

html, body{
  margin:0; width:100%; height:100%; overflow:hidden;
  background:#f3f6fa; font-family:'IBM Plex Sans',sans-serif; color:black;
}
#site-wrap{
  position:fixed; inset:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1); will-change:transform;
}
#site-wrap.nav-open{ transform:translateX(calc(-1 * var(--nav-w))); }

/* ── CABEÇALHO GLOBAL ── */
.logo{
  position:fixed; top:20px; right:24px; z-index:9999;
  font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:500;
  color:var(--blue); cursor:pointer; margin:0; line-height:1;
}
.hamburger{
  position:fixed; top:52px; right:24px; z-index:9999; width:32px;
  display:flex; flex-direction:column; gap:6px;
  cursor:pointer; padding:4px 0; background:transparent; border:none; touch-action:manipulation;
}
.hamburger span{ display:block; height:2px; background:var(--blue); width: 100%; }

.lang-toggle{
  position:fixed; top:20px; left:24px; z-index:9999;
  font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:500;
  border:1px solid black; background:white; padding:5px 12px; cursor:pointer;
  touch-action:manipulation; transition:background .2s,color .2s,border-color .2s;
}
.lang-toggle:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* ── STATEMENT ── */
.statement{
  position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
  width:min(640px,82vw); text-align:center;
  font-family:'Space Grotesk',sans-serif; font-size:22px; line-height:1.35;
  z-index:1; pointer-events:none; min-height:3.5em;
}
.statement .typed-cursor, .overlay-content .typed-cursor {
  color: var(--blue); font-weight:300; opacity:1; animation: typedBlink 0.7s infinite;
}
@keyframes typedBlink{ 0%,100%{opacity:1} 50%{opacity:0} }

#world{ position:fixed; inset:0; overflow:hidden; z-index:10; touch-action:none; }

.logo,.hamburger,.lang-toggle,.close-button, .nav-menu,.nav-overlay{ pointer-events:auto; }

/* Botões da Landpage */
.physics-button{
  position:absolute; display:flex; align-items:center; justify-content:center;
  padding:12px 18px; border:1px solid black; background:white;
  font-family:'Space Grotesk',sans-serif; font-size:20px; cursor:pointer;
  user-select:none; white-space:nowrap;
  min-width:80px; max-width:min(340px,80vw);
  touch-action:none; transition:background .15s,color .15s,border-color .15s;
  border-radius: 0; z-index: 12;
}
.physics-button:hover{ background:var(--blue); color:white; border-color:var(--blue); }
.physics-button.featured-blue { background: var(--blue); color: white; border: 1px solid var(--blue); }
.physics-button.featured-blue:hover { background: white; color: var(--blue); border-color: var(--blue); }

.physics-icon-button {
  position:absolute; display:flex; align-items:center; justify-content:center;
  background:var(--blue); border:1px solid var(--blue); cursor:pointer;
  touch-action:none; transition:background .15s, border-color .15s;
  border-radius: 0; z-index: 12;
}
.physics-icon-button svg { transition: fill .15s; }
.physics-icon-button:hover { background: white; border-color: var(--blue); }
.physics-icon-button:hover svg { fill: var(--blue); }

.nav-overlay{ display:none; position:fixed; inset:0; z-index:550; background:rgba(0,0,0,.15); }
.nav-overlay.open{ display:block; }

.nav-menu{
  position:fixed; top:0; right:calc(-1 * var(--nav-w));
  width:var(--nav-w); height:100%; background:white;
  border-left:1px solid #e0e0e0; z-index:600;
  display:flex; flex-direction:column;
  padding:80px 32px 32px 32px; overflow-y:auto;
  -webkit-overflow-scrolling:touch; transition:right .32s cubic-bezier(.4,0,.2,1);
}
.nav-menu.open{ right:0; }
.nav-menu-close{
  position:absolute; top:0; left:0; width:35px; height:35px;
  border:none; background:var(--blue); color:white; font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; touch-action:manipulation;
}
.nav-about-label{
  font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:500;
  letter-spacing:.1em; text-transform:uppercase; color:var(--blue);
  margin:0 0 20px 0; text-align:left;
  cursor:pointer; background:none; border:none; padding:0; touch-action:manipulation;
}
.nav-about-label:hover{ opacity:.7; }
.nav-divider{ border:none; border-top:1px solid #e0e0e0; margin:20px 0; }
.nav-project-btn{
  font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:400;
  background:none; border:none; padding:12px 0;
  cursor:pointer; text-align:right; width:100%; color:black;
  touch-action:manipulation; transition:color .15s;
}
.nav-project-btn:hover{ color:var(--blue); }

.overlay-container{
  display:none; position:fixed;
  top:var(--header-h); left:0; right:0; bottom:20px;
  align-items:center; justify-content:center;
  z-index:300; pointer-events:none; padding:12px 4vw;
}
.overlay-container.active{ display:flex; }
.overlay-content{
  width:min(980px,92vw); height:100%;
  display:flex; flex-direction:column; position:relative;
  border:2px solid var(--blue); background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px); pointer-events:auto; overflow:hidden;
}
.close-button{
  position:absolute; top:0; right:0; width:35px; height:35px;
  border:none; background:var(--blue); color:white; font-size:22px; cursor:pointer;
  z-index:110; display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; flex-shrink:0;
}
#content{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:52px; margin-top:35px; padding-top:16px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; stroke-color:var(--blue) transparent;
  position: relative; z-index: 10;
}
#content::-webkit-scrollbar{ width:4px; }
#content::-webkit-scrollbar-track{ background:transparent; }
#content::-webkit-scrollbar-thumb{ background:var(--blue); border-radius:0; }

.content-inner{ max-width:760px; position: relative; z-index: 5; pointer-events: none; }
.content-inner h2{ margin:0 0 18px 0; font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:500; min-height: 1.2em; pointer-events: auto; }
.content-inner p{ margin:0 0 18px 0; font-size:16px; line-height:1.65; pointer-events: auto; }

.btn-visit{
  display:inline-block; padding:10px 20px; border:1px solid var(--blue);
  color:var(--blue); text-decoration:none; font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:500; margin-bottom:30px; transition:all .2s;
  pointer-events: auto;
}
.btn-visit:hover{ background:var(--blue); color:white; }

/* ── ÁREA FÍSICA DO SOBRE ── */
.about-physics-area {
  position: relative;
  width: 100%;
  height: 55vh; 
  min-height: 400px;
  margin-top: 30px;
  border-top: 1px solid #e0e0e0;
  /* Retirada a borda extra que causava a "linha fina" */
  overflow: hidden;
  z-index: 20;
  pointer-events: auto;
}
.about-member-box {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  border: 1px solid black;
  background: white;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px; /* Letra maior no desktop */
  line-height: 1.15;
  
  /* Proteções estritas contra o "Fantasma" e seleção acidental */
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  -webkit-user-drag: none; 
  touch-action: none;
  
  z-index: 30;
  cursor: grab;
}
.about-member-box:active {
  cursor: grabbing;
}
.about-member-box:hover {
  background: var(--blue); color: white; border-color: var(--blue);
}

.static-image-container { 
  position: absolute; bottom: 20px; right: 24px;
  width: 220px; height: 220px;
  display: flex; align-items: center; justify-content: center; 
  z-index: 1; pointer-events: none; opacity: 0.12;
}
.static-image-container img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

/* CAROUSEL */
.swiper{ width:100%; height:55vh; margin: 24px 0; }
.swiper-slide{ display:flex; align-items:center; justify-content:center; }
.swiper-slide img{ width:100%; height:100%; object-fit:contain; cursor:zoom-in; }
.swiper-button-next,.swiper-button-prev{ color:var(--blue); }
.swiper-pagination-bullet-active{ background:var(--blue); }

#lightbox{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.98); z-index:2000;
  flex-direction:column; align-items:center; justify-content:center;
}
#lightbox.active{ display:flex; }
.lightbox-close{
  position:absolute; top:20px; right:24px; width:44px; height:44px;
  border:none; background:none; color:white; font-size:40px; cursor:pointer;
  z-index:2100; touch-action:manipulation;
}
.swiper-lightbox{ width:100%; height:100%; margin-top:0; }
.swiper-lightbox .swiper-slide img{ max-width:95vw; max-height:90vh; object-fit:contain; cursor:default; }
.swiper-lightbox .swiper-button-next, .swiper-lightbox .swiper-button-prev{ color:white; }

/* ── RESPONSIVIDADE ── */
@media(max-width:768px){
  :root { --nav-w: 240px; --header-h: 80px; }
  .logo { top: 16px; right: 16px; font-size: 20px; }
  .lang-toggle { top: 16px; left: 16px; padding: 5px 12px; font-size: 13px; }
  .hamburger { top: 46px; right: 16px; width: 28px; gap: 5px; }
  .statement{ width:84vw; font-size:17px; top: 38%; }
  .physics-button{ font-size:15px; padding:10px 14px; }
  .overlay-content{ width:96vw; }
  #content{ padding:16px; margin-top:0px; }
  .content-inner h2{ font-size:24px; margin-bottom:12px; padding-right:30px; }
  .swiper { height:38vh; }
  .static-image-container { width: 140px; height: 140px; bottom: 12px; right: 16px; }
  .about-physics-area { height: 45vh; min-height: 300px; }
  .about-member-box { font-size: 15px; } /* Ajuste da letra para mobile */
}

@media(max-width:360px){
  :root { --header-h: 70px; --nav-w: 215px; }
  .logo { top: 12px; right: 12px; font-size: 17px; }
  .lang-toggle { top: 12px; left: 12px; padding: 4px 10px; font-size: 11px; }
  .hamburger { top: 38px; right: 12px; width: 24px; gap: 4px; }
  .statement { font-size: 13px; top: 35%; }
  .physics-button { font-size: 12px !important; padding: 5px 8px !important; }
  .nav-menu { padding: 60px 16px 16px 16px; }
  .overlay-container { bottom: 10px; }
  .content-inner h2 { font-size: 19px; }
  .content-inner p { font-size: 13px; line-height: 1.45; }
  .static-image-container { width: 100px; height: 100px; }
}
</style>
</head>
<body>

<div id="custom-cursor-container">
  <div class="cursor-circle"></div>
  <div class="cursor-dot"></div>
</div>

<div id="site-wrap">
  <h1 class="logo" id="logoHome">BARDA</h1>
  <button class="lang-toggle" id="langToggle">EN</button>
  <button class="hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <div class="statement">
    <span id="typed-statement"></span>
  </div>

  <div id="world"></div>

  <div class="overlay-container" id="overlay">
    <div class="overlay-content">
      <button class="close-button" id="close">×</button>
      <div id="content"></div>
    </div>
  </div>
</div>

<div id="lightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <div class="swiper swiper-lightbox">
    <div class="swiper-wrapper" id="lightbox-wrapper"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>
</div>

<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-menu" id="navMenu">
  <button class="nav-menu-close" id="navClose">×</button>
  <button class="nav-about-label" id="navAbout">
    <span class="lang-pt">Sobre</span><span class="lang-en" style="display:none">About</span>
  </button>
  <hr class="nav-divider">
  <button class="nav-project-btn" data-key="membrana">Membrana</button>
  <button class="nav-project-btn" data-key="porvir">Porvir</button>
  <button class="nav-project-btn" data-key="imagens">Imagens Verdes</button>
  <button class="nav-project-btn" data-key="casa">A Casa de Falar Baixinho</button>
  <button class="nav-project-btn" data-key="arquivo">Estivemos aqui!</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
/* ── TAB TYPED EFFECT ── */
(function loopTabTitle() {
  const strings = ["BARDA", "COLETIVO"];
  let wordIndex = 0; let charIndex = 5; let isDeleting = false;
  function type() {
    const fullWord = strings[wordIndex];
    if (isDeleting) { charIndex = Math.max(1, charIndex - 2); } 
    else { charIndex = Math.min(fullWord.length, charIndex + 2); }
    document.title = fullWord.substring(0, charIndex);
    let typeSpeed = 40;
    if (!isDeleting && charIndex === fullWord.length) { typeSpeed = 2000; isDeleting = true; } 
    else if (isDeleting && charIndex === 1) {
      isDeleting = false; wordIndex = (wordIndex + 1) % strings.length; charIndex = 1; typeSpeed = 200;
    }
    setTimeout(type, typeSpeed);
  }
  setTimeout(type, 2000);
})();

/* ── REFS E CONTEXTO GLOBAL ── */
const siteWrap        = document.getElementById("site-wrap");
const overlay          = document.getElementById("overlay");
const content          = document.getElementById("content");
const closeBtn        = document.getElementById("close");
const worldEl         = document.getElementById("world");
const langBtn        = document.getElementById("langToggle");
const hamburger       = document.getElementById("hamburger");
const navMenu         = document.getElementById("navMenu");
const navOverlay      = document.getElementById("navOverlay");
const navClose        = document.getElementById("navClose");
const lightbox        = document.getElementById("lightbox");
const lightboxWrapper = document.getElementById("lightbox-wrapper");
const lightboxClose   = document.getElementById("lightboxClose");
const cursorContainer = document.getElementById("custom-cursor-container");
const cursorCircle    = document.querySelector(".cursor-circle");
const cursorDot       = document.querySelector(".cursor-dot");

let swiperInst = null, swiperLightbox = null, currentLang = "pt", tempImages = [];
const isMobileDevice = window.innerWidth <= 1024;
let mouseX = 0, mouseY = 0, ballX = 0, ballY = 0;
const speed = 0.15;

if (!isMobileDevice) {
  document.addEventListener('mousemove', e => {
    mouseX = e.clientX; mouseY = e.clientY;
    cursorDot.style.left = mouseX + 'px'; cursorDot.style.top  = mouseY + 'px';
  });
  (function updateSmoothCursor() {
    ballX += (mouseX - ballX) * speed; ballY += (mouseY - ballY) * speed;
    cursorCircle.style.left = ballX + 'px'; cursorCircle.style.top  = ballY + 'px';
    requestAnimationFrame(updateSmoothCursor);
  })();
}

function setupCursorHovers() {
  if (isMobileDevice) return;
  document.querySelectorAll('a, button, .physics-button, .physics-icon-button, .about-member-box, .logo, .hamburger, .nav-project-btn, .swiper-button-next, .swiper-button-prev').forEach(el => {
    if (!el.dataset.cursorBound) {
      el.dataset.cursorBound = "true";
      el.addEventListener('mouseenter', () => cursorContainer.classList.add('grow'));
      el.addEventListener('mouseleave', () => cursorContainer.classList.remove('grow'));
    }
  });
}
setupCursorHovers();

/* ── TYPED.JS ── */
const typedStringsPT = [
  "Sempre em construção",
  "Barda é uma manifestação de vontade colaborativa que ganhou a forma de coletivo",
  "enfatiza as artes visuais como meio de transformação e instrumento de empoderamento para comunidades periféricas",
  "utiliza a imagem como ferramenta de intervenção e questionamento.",
  "promovendo a criação de sinergias entre comunidade e território através de diálogos experimentais"
];
const typedStringsEN = [
  "Always in construction",
  "Barda is a manifestation of collaborative will that has taken the form of a collective",
  "emphasizes visual arts as a means of transformation and empowerment for peripheral communities",
  "uses imagery as a tool for intervention and questioning.",
  "promoting the creation of synergies between community and territory through experimental dialogues"
];

let typedInstance = null;
let typedProjectTitleInstance = null;

function initTyped(lang) {
  if (typedInstance) { typedInstance.destroy(); typedInstance = null; }
  typedInstance = new Typed("#typed-statement", {
    strings: lang === "en" ? typedStringsEN : typedStringsPT,
    typeSpeed: 38, backSpeed: 18, backDelay: 2800, startDelay: 300, loop: true, smartBackspace: false, cursorChar: "|",
  });
}
initTyped("pt");

/* ── SWITCH IDIOMA ── */
function applyLang(lang) {
  const isEN = lang === "en";
  document.querySelectorAll(".lang-pt").forEach(el => el.style.display = isEN ? "none" : "block");
  document.querySelectorAll(".lang-en").forEach(el => el.style.display = isEN ? "block" : "none");
  if (typeof BardaLand !== 'undefined' && BardaLand.items) {
    BardaLand.items.forEach(item => { if (item.el && !item.isIcon) item.el.textContent = isEN ? item.labelEN : item.labelPT; });
  }
}

langBtn.addEventListener("click", () => {
  currentLang = currentLang === "pt" ? "en" : "pt";
  langBtn.textContent = currentLang === "pt" ? "EN" : "PT";
  applyLang(currentLang);
  initTyped(currentLang);
});

/* ── LIGHTBOX ── */
function openLightbox(idx) {
  if (!tempImages.length) return;
  lightboxWrapper.innerHTML = tempImages.map(img => `<div class="swiper-slide"><img src="${img}"></div>`).join("");
  lightbox.classList.add("active");
  if (swiperLightbox) swiperLightbox.destroy();
  swiperLightbox = new Swiper(".swiper-lightbox", {
    initialSlide: idx, loop: true,
    navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }, keyboard: { enabled: true }
  });
}
lightboxClose.addEventListener("click", () => {
  lightbox.classList.remove("active");
  if (swiperLightbox) { swiperLightbox.destroy(); swiperLightbox = null; }
});

/* ── DADOS DOS PROJETOS GERAIS ── */
const projectData = {
  membrana:{
    titlePT:"Membrana", titleEN:"Membrana", metaPT:"Exposição coletiva · ACERT, Tondela · 2023–2025", metaEN:"Collective exhibition · ACERT, Tondela · 2023–2025",
    description:`<div class="lang-pt"><p>À medida que as interfaces se tornam o lugar recorrente da experiência quotidiana, impõe-se a urgência de reencontrar formas de relação com o mundo que sejam mais atentas, empáticas e porosas...</p><p style="margin-top: 24px; font-weight: 500; text-align: right; color: var(--blue);">Vera Carmo</p></div><div class="lang-en"><p>As interfaces become the recurring place of everyday experience, there is an urgent need to rediscover ways of relating to the world...</p><p style="margin-top: 24px; font-weight: 500; text-align: right; color: var(--blue);">Vera Carmo</p></div>`,
    images: Array.from({length:11}, (_,i) => `images/membrana/${i+1}.jpg`)
  },
  porvir:{
    titlePT:"Porvir", titleEN:"Porvir", metaPT:"Projeto de arte participativa · Serra do Açor · 2024", metaEN:"Participatory art project · Serra do Açor · 2024",
    description:`<a href="https://porvir.com.pt" target="_blank" class="btn-visit"><span class="lang-pt">VISITAR WEBSITE DO PROJETO ↗</span><span class="lang-en">VISIT PROJECT WEBSITE ↗</span></a><div class="lang-pt"><p>Porvir é um projeto de intercâmbio multidisciplinar...</p></div><div class="lang-en"><p>Porvir is a multidisciplinary exchange project...</p></div>`,
    images: Array.from({length:36}, (_,i) => `images/porvir/${i+1}.jpg`)
  },
  imagens:{
    titlePT:"Imagens Verdes", titleEN:"Imagens Verdes", metaPT:"Oficinas de expressão artística · Porto · 2023–2025", metaEN:"Artistic expression workshops · Porto · 2023–2025",
    description:`<div class="lang-pt"><p>Imagens Verdes é um projeto contínuo de transformação...</p></div><div class="lang-en"><p>Imagens Verdes is an ongoing project...</p></div>`,
    images: Array.from({length:16}, (_,i) => `images/imagensverdes/${i+1}.jpg`)
  },
  casa:{
    titlePT:"A Casa de Falar Baixinho", titleEN:"A Casa de Falar Baixinho", metaPT:"Exposição · Encontros da Imagem · 2025", metaEN:"Exhibition · Encontros da Imagem · 2025",
    description:`<div class="lang-pt"><p>Integrada no núcleo expositivo Argumentários...</p></div><div class="lang-en"><p>Integrated into the exhibition core Argumentários...</p></div>`,
    images: Array.from({length:12}, (_,i) => `images/casafalarbaixinho/${i+1}.jpg`)
  },
  arquivo:{
    titlePT:"Estivemos aqui!", titleEN:"We were here!", metaPT:"Oficinas, palestras e eventos públicos", metaEN:"Workshops, lectures and public events",
    description:`<div class="lang-pt"><p>Espaço dedicado à partilha coletiva...</p></div>`,
    images: []
  }
};

/* ── MOTOR FÍSICO DO SOBRE (QUADRADOS E ANTIDRAG) ── */
const BardaAbout = {
  engine: null, runner: null, items: [],
  init: function() {
    try {
      this.clear();
      const worldContainer = document.getElementById('about-world');
      if (!worldContainer) return;

      const w = worldContainer.clientWidth || window.innerWidth * 0.8;
      const h = worldContainer.clientHeight || 400;

      this.engine = Matter.Engine.create();
      this.engine.gravity.y = 1.1;
      const localWorld = this.engine.world;

      // Chão e Paredes
      Matter.Composite.add(localWorld, [
        Matter.Bodies.rectangle(w/2, h + 50, w * 2, 100, { isStatic: true }),
        Matter.Bodies.rectangle(-50, h/2, 100, h * 2, { isStatic: true }),
        Matter.Bodies.rectangle(w + 50, h/2, 100, h * 2, { isStatic: true })
      ]);

      const members = [
        "Ana Luísa Rego", "Carlos Trancoso", "Diana Sá", 
        "Guida Marques", "Hernâni Sousa", "Inês Fernandes", 
        "Ivan Da Silva", "Juliana Maar", "Marco Duarte"
      ];
      members.sort(() => Math.random() - 0.5);

      // Define o tamanho fixo (Quadrado) consoante o dispositivo
      const boxSize = window.innerWidth <= 768 ? 100 : 140;

      this.items = members.map((name, idx) => {
        const el = document.createElement('div');
        el.className = 'about-member-box';
        el.innerHTML = `<span>${name}</span>`; // O span ajuda no wrap e alinhamento
        
        // Proteção extra via JS contra o "Fantasma" do drag de browser
        el.ondragstart = function() { return false; };
        
        worldContainer.appendChild(el);

        const startX = (w / 2) + (Math.random() - 0.5) * 100;
        const startY = -120 - (idx * 80); // Maior espaçamento vertical para não colidirem logo

        const body = Matter.Bodies.rectangle(startX, startY, boxSize, boxSize, {
          restitution: 0.15, friction: 0.8, frictionAir: 0.02, angle: (Math.random() - 0.5) * 0.4
        });

        Matter.Composite.add(localWorld, body);
        return { el, body, w: boxSize, h: boxSize };
      });

      const mouse = Matter.Mouse.create(worldContainer);
      const mc = Matter.MouseConstraint.create(this.engine, {
        mouse: mouse, constraint: { stiffness: 0.2, render: { visible: false } }
      });
      Matter.Composite.add(localWorld, mc);

      this.runner = Matter.Runner.create();
      Matter.Runner.run(this.runner, this.engine);

      const self = this;
      (function loop() {
        if (!self.engine) return;
        self.items.forEach(item => {
          item.el.style.width = item.w + "px";
          item.el.style.height = item.h + "px";
          item.el.style.left = (item.body.position.x - item.w/2) + "px";
          item.el.style.top  = (item.body.position.y - item.h/2) + "px";
          item.el.style.transform = `rotate(${item.body.angle}rad)`;
        });
        requestAnimationFrame(loop);
      })();

      setupCursorHovers();
    } catch (e) {
      console.error("About Physics Erro: ", e);
    }
  },
  clear: function() {
    if (this.runner) { Matter.Runner.stop(this.runner); this.runner = null; }
    if (this.engine) { Matter.Engine.clear(this.engine); this.engine = null; }
    const worldContainer = document.getElementById('about-world');
    if (worldContainer) worldContainer.innerHTML = "";
    this.items = [];
  }
};

/* ── CONTROLOS DE FLUXO DE CONTEÚDO ── */
function buildSwiper(imgs) {
  if (!imgs || !imgs.length) return "";
  const slides = imgs.map((img, i) => `<div class="swiper-slide"><img src="${img}" onclick="openLightbox(${i})"></div>`).join("");
  return `<div class="swiper main-swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}

function initSwiper() {
  if (swiperInst) swiperInst.destroy();
  swiperInst = new Swiper(".main-swiper", {
    loop: true, pagination: { el: ".swiper-pagination" }, navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }
  });
}

function openProject(key) {
  if (key === "email" || key === "instagram") return;
  BardaAbout.clear(); // Limpa sempre antes de abrir outro
  overlay.classList.add("active");
  worldEl.style.zIndex = "0";
  content.scrollTop = 0;

  if (typedProjectTitleInstance) { typedProjectTitleInstance.destroy(); typedProjectTitleInstance = null; }

  // ── INJEÇÃO COM O TEXTO E FÍSICA NO SOBRE ──
  if (key === "about") {
    const titleText = currentLang === 'en' ? "About" : "Sobre";
    content.innerHTML = `
      <div class="content-inner">
        <h2 id="project-title-typed"></h2>
        <div class="lang-pt"><p>Barda é uma manifestação de vontade colaborativa que ganhou a forma de coletivo, enfatiza as artes visuais como meio de transformação e instrumento de empoderamento para comunidades periféricas, utiliza a imagem como ferramenta de intervenção e questionamento, promovendo a criação de sinergias entre comunidade e território através de diálogos experimentais.</p></div>
        <div class="lang-en" style="${currentLang === 'en' ? 'display:block' : 'display:none'}"><p>Barda is a manifestation of collaborative will that has taken the form of a collective, emphasizes visual arts as a means of transformation and empowerment for peripheral communities, uses imagery as a tool for intervention and questioning, promoting the creation of synergies between community and territory through experimental dialogues.</p></div>
      </div>
      <div class="about-physics-area" id="about-world">
        <div class="static-image-container"><img src="images/logo-barda.png"></div>
      </div>
    `;
    
    applyLang(currentLang);
    typedProjectTitleInstance = new Typed("#project-title-typed", { strings: [titleText], typeSpeed: 40, showCursor: false, loop: false });

    setTimeout(() => { BardaAbout.init(); }, 150);

  } else {
    const item = projectData[key];
    tempImages = item.images;

    let headerHtml = `<div class="content-inner"><h2 id="project-title-typed"></h2>`;
    if (item.metaPT || item.metaEN) {
      headerHtml += `<div style="font-size:13px;color:var(--blue);text-transform:uppercase;margin-bottom:20px;"><span class="lang-pt">${item.metaPT}</span><span class="lang-en">${item.metaEN}</span></div>`;
    }
    headerHtml += `</div>`;

    content.innerHTML = headerHtml + buildSwiper(item.images) + `<div class="content-inner">${item.description}</div>`;
    applyLang(currentLang);

    const titleText = currentLang === 'en' ? item.titleEN : item.titlePT;
    typedProjectTitleInstance = new Typed("#project-title-typed", { strings: [titleText], typeSpeed: 40, showCursor: false, loop: false });

    if (item.images && item.images.length) {
      setTimeout(() => {
        initSwiper();
        const swiperEl = document.querySelector('.main-swiper');
        if (swiperEl && !isMobileDevice) {
          swiperEl.addEventListener('mouseenter', () => cursorContainer.classList.add('plus'));
          swiperEl.addEventListener('mouseleave', () => cursorContainer.classList.remove('plus'));
        }
      }, 100);
    }
  }
  setupCursorHovers();
}

function closeOverlay() {
  BardaAbout.clear();
  overlay.classList.remove("active");
  worldEl.style.zIndex = "10";
  content.innerHTML = "";
  cursorContainer.classList.remove('plus');
  if (swiperInst) { swiperInst.destroy(); swiperInst = null; }
  if (typedProjectTitleInstance) { typedProjectTitleInstance.destroy(); typedProjectTitleInstance = null; }
}

/* ── NAV EVENTOS ── */
function openNav() { navMenu.classList.add("open"); navOverlay.classList.add("open"); siteWrap.classList.add("nav-open"); }
function closeNav() { navMenu.classList.remove("open"); navOverlay.classList.remove("open"); siteWrap.classList.remove("nav-open"); }

hamburger.addEventListener("click", openNav);
navClose.addEventListener("click", closeNav);
navOverlay.addEventListener("click", closeNav);
closeBtn.addEventListener("click", closeOverlay);
document.getElementById("logoHome").addEventListener("click", closeOverlay);
document.getElementById("navAbout").addEventListener("click", () => { closeNav(); openProject("about"); });
document.querySelectorAll(".nav-project-btn").forEach(btn => btn.addEventListener("click", () => { closeNav(); openProject(btn.dataset.key); }));

/* ── FÍSICA DA LANDPAGE (BardaLand) ── */
const BardaLand = {
  engine: null, runner: null, items: [],
  init: function() {
    try {
      this.engine = Matter.Engine.create();
      this.engine.gravity.y = 1.2;
      const landWorld = this.engine.world;

      const W = window.innerWidth, H = window.innerHeight;
      const cx = W / 2, cy = H / 2;

      Matter.Composite.add(landWorld, [
        Matter.Bodies.rectangle(W/2, H+30, W, 60, {isStatic:true}), 
        Matter.Bodies.rectangle(-30, H/2, 60, H, {isStatic:true}),       
        Matter.Bodies.rectangle(W+30, H/2, 60, H, {isStatic:true})        
      ]);

      function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

      const mailIconSVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.144C21.69 2.28 24 3.434 24 5.457z"/></svg>`;
      const instaIconSVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;

      const isMicroMobile = window.innerWidth <= 360;
      const bHeight = isMicroMobile ? 42 : 54; const iconSize = isMicroMobile ? 48 : 60;

      this.items = [
        { labelPT:"Membrana",               labelEN:"Membrana",               key:"membrana",  x:cx-W*.20, y:cy-H*.55, w:clampW(isMicroMobile ? 120 : 190), h:bHeight, isIcon:false },
        { labelPT:"Porvir",                  labelEN:"Porvir",                  key:"porvir",    x:cx+W*.04, y:cy-H*.70, w:clampW(isMicroMobile ? 90 : 140),  h:bHeight, isIcon:false },
        { labelPT:"Imagens Verdes",         labelEN:"Imagens Verdes",         key:"imagens",   x:cx+W*.20, y:cy-H*.62, w:clampW(isMicroMobile ? 150 : 240), h:bHeight, isIcon:false },
        { labelPT:"Casa de Falar Baixinho", labelEN:"Casa de Falar Baixinho", key:"casa",      x:cx-W*.04, y:cy-H*.85, w:clampW(isMicroMobile ? 195 : 320), h:bHeight, isIcon:false },
        { labelPT:"Estivemos aqui!",        labelEN:"We were here!",          key:"arquivo",   x:cx-W*.15, y:cy-H*.68, w:clampW(isMicroMobile ? 150 : 210), h:bHeight, isIcon:false },
        { labelPT:"Sobre",                  labelEN:"About",                  key:"about",     x:cx+W*.28, y:cy-H*.78, w:clampW(isMicroMobile ? 90 : 130),  h:bHeight, isIcon:false },
        { labelPT:"Email",                  labelEN:"Email",                  key:"email",     x:cx-W*.10, y:cy-H*.92, w:iconSize,                                          h:iconSize, isIcon:true, iconSVG:mailIconSVG,  url:"mailto:bardacoletivo@gmail.com" },
        { labelPT:"Instagram",               labelEN:"Instagram",               key:"instagram", x:cx+W*.10, y:cy-H*.95, w:iconSize,                                          h:iconSize, isIcon:true, iconSVG:instaIconSVG, url:"https://instagram.com/bardacoletivo" }
      ];

      this.items.sort(() => Math.random() - 0.5);

      this.items.forEach((item, index) => {
        const jitterX = (Math.random() - 0.5) * (W * 0.15); 
        const sequentialY = cy - H * 0.6 - (index * 75); 
        item.body = Matter.Bodies.rectangle(item.x + jitterX, sequentialY, item.w, item.h, { restitution: .1, friction: .8, frictionAir: .02, angle: (Math.random() - 0.5) * 0.5 });
        Matter.Composite.add(landWorld, item.body);
        item.el = document.createElement("div");
        
        // Bloquear drag nativo nos botões principais também
        item.el.ondragstart = function() { return false; };

        if (item.isIcon) {
          item.el.className = "physics-icon-button"; item.el.innerHTML = item.iconSVG; item.el.title = item.labelPT;
        } else {
          item.el.className = (item.key === "about" || item.key === "arquivo") ? "physics-button featured-blue" : "physics-button";
          item.el.textContent = currentLang === "en" ? item.labelEN : item.labelPT;
        }
        
        worldEl.appendChild(item.el);
        let sX, sY;
        item.el.addEventListener("pointerdown", e => { sX = e.clientX; sY = e.clientY; });
        item.el.addEventListener("pointerup", e => { 
          if (Math.hypot(e.clientX-sX, e.clientY-sY) < 8) {
            if (item.isIcon) { window.open(item.url, "_blank"); } else { openProject(item.key); }
          }
        });
      });

      const mc = Matter.MouseConstraint.create(this.engine, { mouse: Matter.Mouse.create(worldEl), constraint: { stiffness: 0.2, render: { visible: false } } });
      Matter.Composite.add(landWorld, mc);
      
      this.runner = Matter.Runner.create();
      Matter.Runner.run(this.runner, this.engine);

      let ceilingAdded = false;
      const self = this;
      (function tick() {
        if (!ceilingAdded) {
          let allButtonsBelowTop = self.items.every(item => (item.body.position.y - item.h/2) > 10);
          if (allButtonsBelowTop) { Matter.Composite.add(landWorld, Matter.Bodies.rectangle(W/2, -30, W, 60, {isStatic:true})); ceilingAdded = true; }
        }
        self.items.forEach(item => {
          item.el.style.width = item.w + "px"; item.el.style.height = item.h + "px";
          item.el.style.left = (item.body.position.x - item.w/2) + "px"; item.el.style.top  = (item.body.position.y - item.h/2) + "px";
          item.el.style.transform = `rotate(${item.body.angle}rad)`;
        });
        requestAnimationFrame(tick);
      })();
    } catch (e) {
      console.error("Landpage Physics Erro: ", e);
    }
  }
};

// Arranca o site
BardaLand.init();

window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - window.innerWidth) > 50) location.reload(); });
window.addEventListener("load", () => {
  if (window.innerWidth > 768) {
    const w = document.getElementById("logoHome").offsetWidth;
    if (w > 0) hamburger.style.width = w + "px";
  }
});
</script>
</body>
</html>
