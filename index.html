<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BARDA</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
  font-family:'IBM Plex Sans',sans-serif;
  color:black;
}

.logo{
  position:fixed;
  top:20px;
  right:24px;
  z-index:50;
  font-family:'Space Grotesk',sans-serif;
  font-size:21px;
  font-weight:500;
  color:var(--blue);
}

.statement{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(640px,82vw);
  text-align:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;
  line-height:1.35;
  z-index:1;
  pointer-events:none;
}

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:10;
}

.physics-button{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 18px;
  border:1px solid black;
  background:white;
  color:black;
  font-family:'Space Grotesk',sans-serif;
  font-size:20px;
  text-decoration:none;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
  min-width:80px;
  max-width:min(340px,80vw);
  transition:
    background .15s linear,
    color .15s linear,
    border-color .15s linear;
}

.physics-button:hover{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.overlay-container{
  display:none;
  position:fixed;
  inset:0;
  align-items:center;
  justify-content:center;
  z-index:100;
  pointer-events:none;
}

.overlay-content{
  width:min(920px,88vw);
  height:min(84vh,860px);
  padding:46px;
  overflow:auto;
  position:relative;
  border:2px solid var(--blue);
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  pointer-events:auto;
}

.close-button{
  position:absolute;
  top:0;
  right:0;
  width:42px;
  height:42px;
  border:none;
  background:var(--blue);
  color:white;
  font-size:24px;
  cursor:pointer;
}

.content-inner{
  max-width:760px;
}

.content-inner h2{
  margin:0 0 18px 0;
  font-family:'Space Grotesk',sans-serif;
  font-size:34px;
  font-weight:500;
}

.content-inner p{
  margin:0 0 18px 0;
  font-size:15px;
  line-height:1.65;
}

.swiper{
  width:100%;
  height:58vh;
  margin-top:34px;
}

.swiper-slide{
  display:flex;
  align-items:center;
  justify-content:center;
}

.swiper-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.swiper-button-next,
.swiper-button-prev{
  color:var(--blue);
}

.swiper-pagination-bullet-active{
  background:var(--blue);
}

@media(max-width:768px){

  .statement{
    width:84vw;
    font-size:18px;
  }

  .physics-button{
    font-size:17px;
    padding:10px 14px;
  }

  .overlay-content{
    width:94vw;
    height:84vh;
    padding:22px;
  }

  .content-inner h2{
    font-size:26px;
  }

  .swiper{
    height:42vh;
  }

}
</style>
</head>

<body>

<h1 class="logo">BARDA</h1>

<div class="statement">
  Images as tools for collective transformation
</div>

<div id="world"></div>

<div class="overlay-container" id="overlay">
  <div class="overlay-content">
    <button class="close-button" id="close">×</button>
    <div id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
const overlay = document.getElementById("overlay");
const content = document.getElementById("content");
const closeBtn = document.getElementById("close");
const worldElement = document.getElementById("world");

let swiperInstance = null;

const projectData = {
  membrana:{
    title:"Membrana",
    text:`<div class="content-inner"><h2>Membrana</h2><p>Collective exhibition in ACERT, Tondela (2023)</p><p>Membrana explores sensory adaptation and collective perception through immersive devices, colour and movement.</p></div>`,
    images:["images/membrana/01.jpg","images/membrana/02.jpg","images/membrana/03.jpg"]
  },
  porvir:{
    title:"Porvir",
    text:`<div class="content-inner"><h2>Porvir</h2><p>Participatory art project in Serra do Açor (2024)</p><p>Collaborative artistic practices connecting territory, community and future imaginaries.</p></div>`,
    images:["images/porvir/01.jpg","images/porvir/02.jpg","images/porvir/03.jpg"]
  },
  imagens:{
    title:"Imagens Verdes",
    text:`<div class="content-inner"><h2>Imagens Verdes</h2><p>Workshops in Porto (2023)</p><p>Artistic expression and collective memory workshops with participants aged 65 and above.</p></div>`,
    images:["images/imagensverdes/01.jpg","images/imagensverdes/02.jpg","images/imagensverdes/03.jpg"]
  },
  casa:{
    title:"Casa de Falar Baixinho",
    text:`<div class="content-inner"><h2>Casa de Falar Baixinho</h2><p>Exploration of intimacy, silence and collective presence.</p></div>`,
    images:["images/casafalarbaixinho/1.jpg","images/casafalarbaixinho/2.jpg","images/casafalarbaixinho/3.jpg"]
  },
  about:{
    title:"About",
    text:`<div class="content-inner"><h2>BARDA</h2><p>Barda is a collective rooted in visual arts as a tool for transformation and empowerment in peripheral territories.</p><p>The collective develops collaborative practices connecting image, memory and community.</p></div>`,
    images:[]
  }
};

function buildSwiper(images){
  if(!images.length) return "";
  const slides = images.map(img=>`<div class="swiper-slide"><img src="${img}"></div>`).join("");
  return `<div class="swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}

function initSwiper(){
  swiperInstance = new Swiper(".swiper",{
    loop:true,
    pagination:{el:".swiper-pagination"},
    navigation:{nextEl:".swiper-button-next",prevEl:".swiper-button-prev"}
  });
}

function openProject(key){
  const item = projectData[key];
  content.innerHTML = `${item.text}${buildSwiper(item.images)}`;
  overlay.style.display = "flex";
  if(item.images.length){ setTimeout(()=>{ initSwiper(); },50); }
}

closeBtn.onclick = () => {
  overlay.style.display = "none";
  content.innerHTML = "";
  if(swiperInstance){ swiperInstance.destroy(); swiperInstance = null; }
};

const Engine = Matter.Engine;
const Runner = Matter.Runner;
const Bodies = Matter.Bodies;
const Composite = Matter.Composite;
const Mouse = Matter.Mouse;
const MouseConstraint = Matter.MouseConstraint;

const engine = Engine.create();
engine.gravity.y = 1.2;
const world = engine.world;

const W = window.innerWidth;
const H = window.innerHeight;
const cx = W / 2;
const cy = H / 2;

const floor = Bodies.rectangle(W/2, H+30, W, 60, {isStatic:true});
const leftWall = Bodies.rectangle(-30, H/2, 60, H, {isStatic:true});
const rightWall = Bodies.rectangle(W+30, H/2, 60, H, {isStatic:true});
Composite.add(world,[floor,leftWall,rightWall]);

function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

const items = [
  { label:"Membrana",             key:"membrana", x: cx - W*0.22, y: cy - H*0.55, w: clampW(190), h:54 },
  { label:"Porvir",               key:"porvir",   x: cx + W*0.04, y: cy - H*0.70, w: clampW(140), h:54 },
  { label:"Imagens Verdes",       key:"imagens",  x: cx + W*0.20, y: cy - H*0.62, w: clampW(240), h:54 },
  { label:"Casa de Falar Baixinho",key:"casa",    x: cx - W*0.04, y: cy - H*0.85, w: clampW(320), h:54 },
  { label:"About",                key:"about",    x: cx + W*0.28, y: cy - H*0.78, w: clampW(130), h:54 }
];

items.forEach(item => {
  const body = Bodies.rectangle(item.x, item.y, item.w, item.h, {
    restitution:0.1, friction:0.8, frictionAir:0.02
  });
  Composite.add(world,body);

  const el = document.createElement("div");
  el.className = "physics-button";
  el.innerHTML = item.label;
  worldElement.appendChild(el);
  let _px, _py;
  el.addEventListener("pointerdown", e => {
    _px = e.clientX; _py = e.clientY;
  });
  el.addEventListener("pointerup", e => {
    const dx = e.clientX - _px;
    const dy = e.clientY - _py;
    if(Math.sqrt(dx*dx + dy*dy) < 6){ openProject(item.key); }
  });

  item.body = body;
  item.el = el;
});

const mouse = Mouse.create(document.body);
const mouseConstraint = MouseConstraint.create(engine,{
  mouse:mouse,
  constraint:{ stiffness:0.2, render:{ visible:false } }
});
Composite.add(world,mouseConstraint);

const runner = Runner.create();
Runner.run(runner,engine);

function update(){
  items.forEach(item => {
    const body = item.body;
    item.el.style.width  = item.w + "px";
    item.el.style.height = item.h + "px";
    item.el.style.left   = (body.position.x - item.w/2) + "px";
    item.el.style.top    = (body.position.y - item.h/2) + "px";
    item.el.style.transform = `rotate(${body.angle}rad)`;
  });
  requestAnimationFrame(update);
}

update();

window.addEventListener("resize",()=>{ location.reload(); });
</script>

</body>
</html>
