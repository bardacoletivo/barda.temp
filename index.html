<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BARDA</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
  font-family:'IBM Plex Sans',sans-serif;
  color:black;
}

.logo{
  position:fixed;
  top:20px;
  right:24px;
  z-index:50;
  font-family:'Space Grotesk',sans-serif;
  font-size:21px;
  font-weight:500;
  color:var(--blue);
}

.statement{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(640px,82vw);
  text-align:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;
  line-height:1.35;
  z-index:1;
  pointer-events:none;
}

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:10;
}

.physics-button{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 18px;
  border:1px solid black;
  background:white;
  color:black;
  font-family:'Space Grotesk',sans-serif;
  font-size:20px;
  text-decoration:none;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
  min-width:80px;
  max-width:min(340px,80vw);
  transition:
    background .15s linear,
    color .15s linear,
    border-color .15s linear;
}

.physics-button:hover{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.overlay-container{
  display:none;
  position:fixed;
  inset:0;
  align-items:center;
  justify-content:center;
  z-index:100;
  pointer-events:none;
}

.overlay-content{
  width:min(920px,88vw);
  height:min(84vh,860px);
  padding:46px;
  overflow:auto;
  position:relative;
  border:2px solid var(--blue);
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  pointer-events:auto;
}

/* BILINGUAL */

.bilingual{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 40px;
  margin-bottom:18px;
}

.bilingual p{
  margin:0;
}

.lang-label{
  font-size:11px;
  font-weight:500;
  letter-spacing:.08em;
  color:var(--blue);
  text-transform:uppercase;
  margin-bottom:6px !important;
}

/* BIOS */

.bios{
  margin-top:40px;
  border-top:1px solid #e0e0e0;
  padding-top:32px;
}

.bios h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--blue);
  margin:0 0 28px 0;
}

.bio{
  margin-bottom:32px;
  padding-bottom:32px;
  border-bottom:1px solid #f0f0f0;
}

.bio:last-child{
  border-bottom:none;
  margin-bottom:0;
  padding-bottom:0;
}

.bio-name{
  font-family:'Space Grotesk',sans-serif;
  font-size:17px;
  font-weight:500;
  margin:0 0 10px 0;
}

.bio p{
  font-size:14px;
  line-height:1.65;
  color:#333;
  margin:0;
}

@media(max-width:600px){
  .bilingual{
    grid-template-columns:1fr;
  }
}

/* SCROLLBAR */

.overlay-content::-webkit-scrollbar{
  width:4px;
}

.overlay-content::-webkit-scrollbar-track{
  background:transparent;
}

.overlay-content::-webkit-scrollbar-thumb{
  background:var(--blue);
  border-radius:0;
}

.overlay-content::-webkit-scrollbar-button{
  display:none;
}

.overlay-content{
  scrollbar-width:thin;
  scrollbar-color:var(--blue) transparent;
}

.close-button{
  position:absolute;
  top:0;
  right:0;
  width:42px;
  height:42px;
  border:none;
  background:var(--blue);
  color:white;
  font-size:24px;
  cursor:pointer;
}

.content-inner{
  max-width:760px;
}

.content-inner h2{
  margin:0 0 18px 0;
  font-family:'Space Grotesk',sans-serif;
  font-size:34px;
  font-weight:500;
}

.content-inner p{
  margin:0 0 18px 0;
  font-size:15px;
  line-height:1.65;
}

.swiper{
  width:100%;
  height:58vh;
  margin-top:34px;
}

.swiper-slide{
  display:flex;
  align-items:center;
  justify-content:center;
}

.swiper-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.swiper-button-next,
.swiper-button-prev{
  color:var(--blue);
}

.swiper-pagination-bullet-active{
  background:var(--blue);
}

@media(max-width:768px){

  .statement{
    width:84vw;
    font-size:18px;
  }

  .physics-button{
    font-size:17px;
    padding:10px 14px;
  }

  .overlay-content{
    width:94vw;
    height:84vh;
    padding:22px;
  }

  .content-inner h2{
    font-size:26px;
  }

  .swiper{
    height:42vh;
  }

}
</style>
</head>

<body>

<h1 class="logo">BARDA</h1>

<div class="statement">
  Images as tools for collective transformation
</div>

<div id="world"></div>

<div class="overlay-container" id="overlay">
  <div class="overlay-content">
    <button class="close-button" id="close">×</button>
    <div id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
const overlay = document.getElementById("overlay");
const content = document.getElementById("content");
const closeBtn = document.getElementById("close");
const worldElement = document.getElementById("world");

let swiperInstance = null;

const projectData = {

  membrana:{
    title:"Membrana",
    text:`<div class="content-inner">
      <h2>Membrana</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Exposição coletiva · 2023–2025</p>
      <div class="bilingual">
        <div>
          <p class="lang-label">PT</p>
          <p>A exposição parte do conceito científico de adaptação sensorial — uma ferramenta que equilibra a sensibilidade dos estímulos que recebemos — e convoca os visitantes a reflectir sobre os sentidos, alargando os domínios da percepção. É na ligação entre o público e o privado que surge a concepção da "Membrana", expandindo as formas de ver para refletir sobre as conexões entre as pessoas. Através de dispositivos que exploram a cor, o movimento e a interface entre os sentidos e a realidade, a exposição apresenta uma abstração e desconstrução do quotidiano, expondo camadas mais profundas da compreensão da realidade.</p>
        </div>
        <div>
          <p class="lang-label">EN</p>
          <p>The exhibition departs from the scientific concept of sensory adaptation — a tool that balances the sensitivity of the stimuli we receive — calling visitors to reflect on the senses and expand the domains of perception. It is in the connection between the public and the private that the conception of the "Membrane" arises, expanding ways of seeing to reflect on the connections between people. Through devices that explore colour, movement, and the interface between senses and reality, the exhibition presents an abstraction and deconstruction of the everyday, exposing deeper layers of understanding reality.</p>
        </div>
      </div>
    </div>`,
    images:["images/membrana/01.jpg","images/membrana/02.jpg","images/membrana/03.jpg"]
  },

  porvir:{
    title:"Porvir",
    text:`<div class="content-inner">
      <h2>Porvir</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Projeto de arte participativa · Serra do Açor · 2024</p>
      <div class="bilingual">
        <div>
          <p class="lang-label">PT</p>
          <p>Porvir é um projeto de intercâmbio multidisciplinar que envolve artistas locais, artistas externos e a comunidade, com o objetivo de imaginar o futuro através da arte participativa. Focado em quatro aldeias da Serra do Açor, o Porvir procura, através da expressão artística, construir um espaço de partilha, investigação, criação e exposição, estimulando o pensamento crítico das comunidades envolvidas. O projeto culmina em exposições coletivas no espaço público, promovendo discussões abertas e trocas de ideias entre participantes, público e instituições.</p>
        </div>
        <div>
          <p class="lang-label">EN</p>
          <p>Porvir is a multidisciplinary exchange project involving local artists, external artists, and the community, aimed at envisioning the future through participatory art. Focused on four villages in the Serra do Açor region, Porvir seeks, through artistic expression, to build a space for sharing, research, creation, and exhibition, while stimulating the critical thinking of the involved communities. The project culminates in collective exhibitions in the public space, promoting open discussions and idea exchanges among participants, the public, and institutions.</p>
        </div>
      </div>
    </div>`,
    images:["images/porvir/01.jpg","images/porvir/02.jpg","images/porvir/03.jpg"]
  },

  imagens:{
    title:"Imagens Verdes",
    text:`<div class="content-inner">
      <h2>Imagens Verdes</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Oficinas de expressão artística · Porto · 2023–2025</p>
      <div class="bilingual">
        <div>
          <p class="lang-label">PT</p>
          <p>Imagens Verdes é um projeto contínuo de transformação que reúne pessoas com 65 ou mais anos para uma exploração única da autoexpressão. Através de oficinas dinâmicas que integram teatro, música, ilustração e fotografia, os participantes mergulham nas suas memórias, partilhando experiências entre si. Dedicado à promoção do intercâmbio entre artistas e a comunidade sénior do Bonfim no Porto, o projeto explora memórias afetivas através de práticas interdisciplinares, promovendo a democratização cultural e a expressão artística.</p>
        </div>
        <div>
          <p class="lang-label">EN</p>
          <p>Imagens Verdes is an ongoing project aimed at transformation, bringing together individuals aged 65 and above for a unique exploration of self-expression. Through dynamic workshops that integrate theatre, music, illustration, and photography, participants delve into the realms of their memories, sharing their experiences with one another. Dedicated to promoting exchange between artists and the senior community of Bonfim in Porto, we explore affective memories through interdisciplinary practices, fostering cultural democratisation and artistic expression.</p>
        </div>
      </div>
    </div>`,
    images:["images/imagensverdes/01.jpg","images/imagensverdes/02.jpg","images/imagensverdes/03.jpg"]
  },

  casa:{
    title:"A Casa de Falar Baixinho",
    text:`<div class="content-inner">
      <h2>A Casa de Falar Baixinho</h2>
      <p style="font-size:13px;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;">Exposição · Encontros da Imagem · 2025</p>
      <div class="bilingual">
        <div>
          <p class="lang-label">PT</p>
          <p>Integrada no núcleo expositivo Argumentários, que celebra e revisita a história do festival, a intervenção do Colectivo Barda responde ao desafio de recuperar memórias e experiências que moldaram de forma sensível e contínua a identidade dos Encontros da Imagem. Partindo de eventos reais da Semana de Abertura de 2018, o coletivo explora encontros, trocas e gestos inscritos na memória da comunidade reunida em torno do festival. Cada imagem em A casa de falar baixinho evoca episódios específicos, convocando afetos, práticas e momentos que, embora ausentes da documentação formal, ficaram marcados nos corpos e na memória particular de cada edição.</p>
        </div>
        <div>
          <p class="lang-label">EN</p>
          <p>Integrated into the exhibition core Argumentários, which aims to celebrate and revisit the history of the festival, the intervention by Colectivo Barda responds to the challenge of recovering memories and experiences that have sensitively shaped the identity of Encontros da Imagem. Drawing from real events during the Opening Week of 2018, the collective explores encounters, exchanges and gestures inscribed in the memory of the community gathered around the festival. Each image in A casa de falar baixinho evokes specific episodes, calling forth affects, practices and moments that, although absent from formal documentation, left their mark on bodies and became embedded in the memory of each edition.</p>
        </div>
      </div>
    </div>`,
    images:["images/casafalarbaixinho/1.jpg","images/casafalarbaixinho/2.jpg","images/casafalarbaixinho/3.jpg"]
  },

  about:{
    title:"About",
    text:`<div class="content-inner">
      <h2>BARDA</h2>
      <div class="bilingual" style="margin-bottom:28px;">
        <div>
          <p class="lang-label">PT</p>
          <p>O Colectivo Barda enfatiza as artes visuais como meio de transformação e capacitação de comunidades periféricas, usando a imagem como ferramenta de intervenção e questionamento, promovendo a criação de sinergias entre comunidade e território através de diálogos experimentais. Barda é uma manifestação de vontade colaborativa que tomou a forma de um coletivo.</p>
        </div>
        <div>
          <p class="lang-label">EN</p>
          <p>Barda Collective emphasises visual arts as a means of transformation and empowerment for peripheral communities, using imagery as a tool for intervention and questioning, promoting the creation of synergies between community and territory through experimental dialogues. Barda is a manifestation of collaborative will that has taken the form of a collective.</p>
        </div>
      </div>

      <div class="bios">
        <h3>Who is Barda?</h3>

        <div class="bio">
          <p class="bio-name">Ana Luísa Rego</p>
          <p>Born in Cinfães (1974), lives in Porto. She began her journey in photography during the analog era, complementing her education with a Photography course at Oficina Da Imagem (2009), a documentary photography workshop at Instituto Português de Fotografia (2015), and a Master's in Artistic Photography at IPCI (2019). She was a founding member of cultural association Espaço Compasso and social association Moving Cause. In her practice, she documents themes inspired by social, cultural, and scientific issues through an interdisciplinary and collaborative approach. She exhibits individually and collectively in Portugal and abroad, with highlights at Fnac Galleries, Fundação Oriente Dili-Timor, Encontros de Imagem, PhotoAlicante, and HybridArt Space Gallery in Budapest.</p>
        </div>

        <div class="bio">
          <p class="bio-name">Carlos Trancoso</p>
          <p>Born in 1989, visual artist based in Porto. Trained in Architecture at FAUP and holding a Master's in Artistic Photography from IPCI, his practice explores the intersections between nature, technology and systems of observation, combining photographic thinking with spatial, sonic and computational processes. He works across photography, installation, video and experimental image-making devices. Since 2022 he has been a member of the European Futures Photography platform through Ci.Clo. In 2024 he won the Intergalactica Open Call, leading to the publication of his photobook <em>How to Build a Telescope</em> by XYZ Books in 2025.</p>
        </div>

        <div class="bio">
          <p class="bio-name">Diana Sá</p>
          <p>Born in Espinho in 1985. She attended the professional photography course at the Portuguese Institute of Photography and the Master's in Artistic Photography at IPCI. In 2020, she participated in an artistic residency in the Azores and received an honorable mention from FNAC in photography. She has participated in group exhibitions in Portugal and abroad. She is interested in long-term projects about territory, everyday life, and the ephemeral.</p>
        </div>

        <div class="bio">
          <p class="bio-name">Guida Marques</p>
          <p>Born in 1986, neo-rural, lives in Serra do Açor since 2017. Master's in Multimedia Art – Performance/Installation at Fine Arts of Lisbon (2019) and Master's in Architecture at the University of Coimbra (2011). She develops reconstructions of schist houses and performances/installations focused on the body/place/memory relationship. Activist in defense of the forest, organic agriculture, and traditional architecture. She participated in the Manifesta 12 Contemporary Art Biennial and is one of the invited architects for the Portuguese representation at the Venice Architecture Biennale 2023.</p>
        </div>

        <div class="bio">
          <p class="bio-name">Hernâni Sousa</p>
          <p>Born in Espinho in 1982. Holds a Master's in Information Science from the Faculty of Engineering at the University of Porto. Completed the Professional Photography Course at the Portuguese Institute of Photography (2018) and the Master's in Artistic Photography at IPCI (2019). He develops personal projects using the photographic medium around themes of intimacy and territory, with particular interest in semiotics and the politicisation of things.</p>
        </div>

        <div class="bio">
          <p class="bio-name">Inês Fernandes</p>
          <p>Born in Porto (1996). Graduated in New Communication Technologies from the University of Aveiro and attended the Master's in Artistic Photography at IPCI. In 2019, she interned at Jornal Público, and since then has worked simultaneously as a photographer and freelancer in graphic design and video editing. Her projects address contemporary themes focused on social and environmental issues, with a preference for rural and decentralised contexts. Her work has been featured in international publications including Musée Magazine (New York) and Gallery Photographs (Tokyo).</p>
        </div>

        <div class="bio">
          <p class="bio-name">Ivan Da Silva</p>
          <p>Born in the late 80s, finds the theme of his work in neighboring centuries, shifting digital images to analog processes. Through experimental image analysis systems, he deconstructs everyday images in an ecology of images. He has participated in exhibitions at Circulation(s), Encontros da Imagem, Museu da Vila Velha de Vila Real, and Museu do Douro. He works as a visual arts teacher and was coordinator of the Imagens Verdes project.</p>
        </div>

        <div class="bio">
          <p class="bio-name">Juliana Maar</p>
          <p>Born in 1981, began her journey in photography in 2013. She participated in group exhibitions in Lisbon and Paris, collaborated with publisher "do lado esquerdo" and launched the fanzine <em>underword</em>. She uses the body and self-portraiture as her main vehicles of expression. She attended the Master's in Artistic Photography at IPCI in 2019. Neo-rural in Serra do Açor for six years.</p>
        </div>

        <div class="bio">
          <p class="bio-name">Marco Duarte</p>
          <p>Born in 1978, freelance documentary photographer tackling social issues in his visual projects. In 2021 he joined the community participation project "Alquimia – Como vejo o meu bairro" in Guimarães. In 2022, he co-founded the Barda collective, participating in various collaborative projects since then.</p>
        </div>

      </div>
    </div>`,
    images:[]
  }

};

function buildSwiper(images){
  if(!images.length) return "";
  const slides = images.map(img=>`<div class="swiper-slide"><img src="${img}"></div>`).join("");
  return `<div class="swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}

function initSwiper(){
  swiperInstance = new Swiper(".swiper",{
    loop:true,
    pagination:{el:".swiper-pagination"},
    navigation:{nextEl:".swiper-button-next",prevEl:".swiper-button-prev"}
  });
}

function openProject(key){
  const item = projectData[key];
  content.innerHTML = `${item.text}${buildSwiper(item.images)}`;
  overlay.style.display = "flex";
  worldElement.style.zIndex = "0";
  if(item.images.length){ setTimeout(()=>{ initSwiper(); },50); }
}

closeBtn.onclick = () => {
  overlay.style.display = "none";
  worldElement.style.zIndex = "10";
  content.innerHTML = "";
  if(swiperInstance){ swiperInstance.destroy(); swiperInstance = null; }
};

const Engine = Matter.Engine;
const Runner = Matter.Runner;
const Bodies = Matter.Bodies;
const Composite = Matter.Composite;
const Mouse = Matter.Mouse;
const MouseConstraint = Matter.MouseConstraint;

const engine = Engine.create();
engine.gravity.y = 1.2;
const world = engine.world;

const W = window.innerWidth;
const H = window.innerHeight;
const cx = W / 2;
const cy = H / 2;

const floor = Bodies.rectangle(W/2, H+30, W, 60, {isStatic:true});
const leftWall = Bodies.rectangle(-30, H/2, 60, H, {isStatic:true});
const rightWall = Bodies.rectangle(W+30, H/2, 60, H, {isStatic:true});
Composite.add(world,[floor,leftWall,rightWall]);

function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

const items = [
  { label:"Membrana",             key:"membrana", x: cx - W*0.22, y: cy - H*0.55, w: clampW(190), h:54 },
  { label:"Porvir",               key:"porvir",   x: cx + W*0.04, y: cy - H*0.70, w: clampW(140), h:54 },
  { label:"Imagens Verdes",       key:"imagens",  x: cx + W*0.20, y: cy - H*0.62, w: clampW(240), h:54 },
  { label:"Casa de Falar Baixinho",key:"casa",    x: cx - W*0.04, y: cy - H*0.85, w: clampW(320), h:54 },
  { label:"About",                key:"about",    x: cx + W*0.28, y: cy - H*0.78, w: clampW(130), h:54 }
];

items.forEach(item => {
  const body = Bodies.rectangle(item.x, item.y, item.w, item.h, {
    restitution:0.1, friction:0.8, frictionAir:0.02
  });
  Composite.add(world,body);

  const el = document.createElement("div");
  el.className = "physics-button";
  el.innerHTML = item.label;
  worldElement.appendChild(el);
  let _px, _py;
  el.addEventListener("pointerdown", e => {
    _px = e.clientX; _py = e.clientY;
  });
  el.addEventListener("pointerup", e => {
    const dx = e.clientX - _px;
    const dy = e.clientY - _py;
    if(Math.sqrt(dx*dx + dy*dy) < 6){ openProject(item.key); }
  });

  item.body = body;
  item.el = el;
});

const mouse = Mouse.create(document.body);
const mouseConstraint = MouseConstraint.create(engine,{
  mouse:mouse,
  constraint:{ stiffness:0.2, render:{ visible:false } }
});
Composite.add(world,mouseConstraint);

const runner = Runner.create();
Runner.run(runner,engine);

function update(){
  items.forEach(item => {
    const body = item.body;
    item.el.style.width  = item.w + "px";
    item.el.style.height = item.h + "px";
    item.el.style.left   = (body.position.x - item.w/2) + "px";
    item.el.style.top    = (body.position.y - item.h/2) + "px";
    item.el.style.transform = `rotate(${body.angle}rad)`;
  });
  requestAnimationFrame(update);
}

update();

window.addEventListener("resize",()=>{ location.reload(); });
</script>

</body>
</html>
