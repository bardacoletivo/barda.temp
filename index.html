<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BARDA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root{
  --blue:#1f4fff;
  --footer-h:44px;
  --nav-w:280px;
  --header-h:90px; /* logo + hamburger zone */
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body{
  margin:0; width:100%; height:100%;
  overflow:hidden;
  background:white;
  font-family:'IBM Plex Sans',sans-serif;
  color:black;
}

/* ── PUSH WRAPPER ─────────────────────────────── */
#site-wrap{
  position:fixed; inset:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
#site-wrap.nav-open{ transform:translateX(calc(-1 * var(--nav-w))); }

/* ── LOGO ─────────────────────────────────────── */
.logo{
  position:fixed; top:20px; right:24px; z-index:500;
  font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:500;
  color:var(--blue); cursor:pointer; margin:0; line-height:1;
}

/* ── HAMBURGER ────────────────────────────────── */
.hamburger{
  position:fixed; top:50px; right:24px; z-index:500; width:32px;
  display:flex; flex-direction:column; gap:6px;
  cursor:pointer; padding:4px 0; background:none; border:none;
  touch-action:manipulation;
}
.hamburger span{ display:block; height:2px; background:var(--blue); }

/* ── LANG TOGGLE ──────────────────────────────── */
.lang-toggle{
  position:fixed; top:20px; left:24px; z-index:500;
  font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:500;
  border:1px solid black; background:white; padding:5px 12px; cursor:pointer;
  touch-action:manipulation;
  transition:background .2s,color .2s,border-color .2s;
}
.lang-toggle:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* ── STATEMENT ────────────────────────────────── */
.statement{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(640px,82vw); text-align:center;
  font-family:'Space Grotesk',sans-serif; font-size:22px; line-height:1.35;
  z-index:1; pointer-events:none;
}

/* ── PHYSICS WORLD ────────────────────────────── */
#world{
  position:fixed; inset:0; overflow:hidden; z-index:10;
  touch-action:none;
}

/* ── UI always above world ────────────────────── */
.logo,.hamburger,.lang-toggle,.close-button,
.nav-menu,.nav-overlay,.site-footer{ pointer-events:auto; }

/* ── PHYSICS BUTTONS ──────────────────────────── */
.physics-button{
  position:absolute; display:flex; align-items:center; justify-content:center;
  padding:12px 18px; border:1px solid black; background:white;
  font-family:'Space Grotesk',sans-serif; font-size:20px; cursor:pointer;
  user-select:none; white-space:nowrap;
  min-width:80px; max-width:min(340px,80vw);
  touch-action:none;
  transition:background .15s,color .15s,border-color .15s;
}
.physics-button:hover{ background:var(--blue); color:white; border-color:var(--blue); }

/* ── NAV OVERLAY ──────────────────────────────── */
.nav-overlay{
  display:none; position:fixed; inset:0; z-index:550;
  background:rgba(0,0,0,.15);
}
.nav-overlay.open{ display:block; }

/* ── NAV MENU ─────────────────────────────────── */
.nav-menu{
  position:fixed; top:0; right:calc(-1 * var(--nav-w));
  width:var(--nav-w); height:100%; background:white;
  border-left:1px solid #e0e0e0; z-index:600;
  display:flex; flex-direction:column;
  padding:80px 32px 32px 32px; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  transition:right .32s cubic-bezier(.4,0,.2,1);
}
.nav-menu.open{ right:0; }

.nav-menu-close{
  position:absolute; top:0; left:0; width:35px; height:35px;
  border:none; background:var(--blue); color:white;
  font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation;
}

.nav-about-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:500; letter-spacing:.1em;
  text-transform:uppercase; color:var(--blue);
  margin:0 0 20px 0; text-align:left;
  cursor:pointer; background:none; border:none; padding:0;
  touch-action:manipulation;
}
.nav-about-label:hover{ opacity:.7; }
.nav-divider{ border:none; border-top:1px solid #e0e0e0; margin:20px 0; }
.nav-project-btn{
  font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:400;
  background:none; border:none; padding:12px 0;
  cursor:pointer; text-align:right; width:100%; color:black;
  touch-action:manipulation; transition:color .15s;
}
.nav-project-btn:hover{ color:var(--blue); }

/* ── OVERLAY (project windows) ────────────────── */
.overlay-container{
  display:none; position:fixed;
  /* start below logo+hamburger, stop above footer */
  top:var(--header-h);
  left:0; right:0;
  bottom:var(--footer-h);
  align-items:center; justify-content:center;
  z-index:300; pointer-events:none;
  padding:12px 4vw;
}
.overlay-container.active{ display:flex; }

.overlay-content{
  width:min(980px,92vw);
  height:100%;
  display:flex; flex-direction:column; position:relative;
  border:2px solid var(--blue);
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  pointer-events:auto; overflow:hidden;
}

/* ── CLOSE BUTTON ─────────────────────────────── */
.close-button{
  position:absolute; top:0; right:0;
  width:35px; height:35px;
  border:none; background:var(--blue); color:white;
  font-size:22px; cursor:pointer; z-index:10;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; flex-shrink:0;
}

/* ── SCROLLABLE CONTENT ───────────────────────── */
#content{
  flex:1; overflow-y:auto; overflow-x:hidden;
  /* top margin clears the close button (35px) */
  padding:52px 52px 52px 52px;
  margin-top:35px;
  padding-top:16px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:var(--blue) transparent;
}
#content::-webkit-scrollbar{ width:4px; }
#content::-webkit-scrollbar-track{ background:transparent; }
#content::-webkit-scrollbar-thumb{ background:var(--blue); border-radius:0; }
#content::-webkit-scrollbar-button{ display:none; }

/* ── BILINGUAL / LANG CLASSES ─────────────────── */
.lang-label{
  font-size:11px; font-weight:500; color:var(--blue);
  text-transform:uppercase; margin-bottom:10px !important;
}

/* ── CONTENT INNER ────────────────────────────── */
.content-inner{ max-width:760px; }
.content-inner h2{ margin:0 0 18px 0; font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:500; }
.content-inner p{ margin:0 0 18px 0; font-size:16px; line-height:1.65; }

.btn-visit{
  display:inline-block; padding:10px 20px; border:1px solid var(--blue);
  color:var(--blue); text-decoration:none; font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:500; margin-bottom:30px; transition:all .2s;
}
.btn-visit:hover{ background:var(--blue); color:white; }

/* ── BIOS ─────────────────────────────────────── */
.bios{ margin-top:40px; border-top:1px solid #e0e0e0; padding-top:32px; }
.bios h3{ font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--blue); text-transform:uppercase; margin:0 0 28px 0; }
.bio{ margin-bottom:32px; padding-bottom:32px; border-bottom:1px solid #f0f0f0; }
.bio:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
.bio-name{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:500; margin:0 0 10px 0; }
.bio p{ font-size:14px; line-height:1.65; color:#333; margin:0; }

/* ── SWIPER ───────────────────────────────────── */
.swiper{ width:100%; height:55vh; margin-top:34px; }
.swiper-slide{ display:flex; align-items:center; justify-content:center; }
.swiper-slide img{ width:100%; height:100%; object-fit:contain; cursor:zoom-in; }
.swiper-button-next,.swiper-button-prev{ color:var(--blue); }
.swiper-pagination-bullet-active{ background:var(--blue); }

/* ── LIGHTBOX ─────────────────────────────────── */
#lightbox{
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.98); z-index:2000;
  flex-direction:column; align-items:center; justify-content:center;
}
#lightbox.active{ display:flex; }
.lightbox-close{
  position:absolute; top:20px; right:24px;
  width:44px; height:44px; border:none; background:none;
  color:white; font-size:40px; cursor:pointer; z-index:2100;
  touch-action:manipulation;
}
.swiper-lightbox{ width:100%; height:100%; }
.swiper-lightbox img{ max-width:95vw; max-height:90vh; object-fit:contain; }
.swiper-lightbox .swiper-button-next,
.swiper-lightbox .swiper-button-prev{ color:white; }

/* ── FOOTER ───────────────────────────────────── */
.site-footer{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:var(--blue); color:white; height:var(--footer-h);
  display:flex; align-items:center; justify-content:center; gap:28px;
}
.site-footer a{
  color:white; text-decoration:none;
  display:flex; align-items:center;
  opacity:.85; transition:opacity .15s;
}
.site-footer a:hover{ opacity:1; }

/* ── MOBILE ───────────────────────────────────── */
@media(max-width:768px){
  :root{ --header-h:88px; }
  .statement{ width:84vw; font-size:18px; }
  .physics-button{ font-size:17px; padding:10px 14px; }
  .overlay-content{ width:96vw; }
  #content{ padding:52px 20px 20px 20px; }
  .content-inner h2{ font-size:26px; }
  .swiper{ height:38vh; }
}
</style>
</head>
<body>

</div>

<!-- lightbox lives outside site-wrap to avoid clipping -->
<div id="lightbox">
  <button class="lightbox-close">×</button>
  <div class="swiper swiper-lightbox">
    <div class="swiper-wrapper" id="lightbox-wrapper"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>
</div>

<!-- nav lives outside site-wrap -->
<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-menu" id="navMenu">
  <button class="nav-menu-close" id="navClose">×</button>
  <button class="nav-about-label" id="navAbout">
    <span class="lang-pt">Sobre</span><span class="lang-en" style="display:none">About</span>
  </button>
  <hr class="nav-divider">
  <button class="nav-project-btn" data-key="membrana">Membrana</button>
  <button class="nav-project-btn" data-key="porvir">Porvir</button>
  <button class="nav-project-btn" data-key="imagens">Imagens Verdes</button>
  <button class="nav-project-btn" data-key="casa">A Casa de Falar Baixinho</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
/* ── REFS ─────────────────────────────────────── */
const siteWrap       = document.getElementById("site-wrap");
const overlay        = document.getElementById("overlay");
const content        = document.getElementById("content");
const closeBtn       = document.getElementById("close");
const worldEl        = document.getElementById("world");
const langBtn        = document.getElementById("langToggle");
const hamburger      = document.getElementById("hamburger");
const navMenu        = document.getElementById("navMenu");
const navOverlay     = document.getElementById("navOverlay");
const navClose       = document.getElementById("navClose");
const lightbox       = document.getElementById("lightbox");
const lightboxWrapper= document.getElementById("lightbox-wrapper");
const lightboxClose  = document.querySelector(".lightbox-close");

let swiperInst = null, swiperLightbox = null, currentLang = "pt", tempImages = [];

/* ── LANGUAGE ─────────────────────────────────── */
function applyLang(lang){
  const isEN = lang === "en";
  document.querySelectorAll(".lang-pt").forEach(el => el.style.display = isEN ? "none" : "block");
  document.querySelectorAll(".lang-en").forEach(el => el.style.display = isEN ? "block" : "none");
}

langBtn.addEventListener("click", () => {
  currentLang = currentLang === "pt" ? "en" : "pt";
  langBtn.textContent = currentLang === "pt" ? "EN" : "PT";
  applyLang(currentLang);
});

/* ── LIGHTBOX ─────────────────────────────────── */
function openLightbox(idx){
  lightboxWrapper.innerHTML = tempImages.map(img =>
    `<div class="swiper-slide"><img src="${img}"></div>`).join("");
  lightbox.classList.add("active");
  if(swiperLightbox) swiperLightbox.destroy();
  swiperLightbox = new Swiper(".swiper-lightbox", {
    initialSlide: idx, loop:true,
    navigation:{ nextEl:".swiper-button-next", prevEl:".swiper-button-prev" },
    keyboard:{ enabled:true }
  });
}
lightboxClose.addEventListener("click", () => lightbox.classList.remove("active"));

/* ── PROJECT DATA ─────────────────────────────── */
const projectData = {
  membrana:{
    text:`<div class="content-inner">
      <h2>Membrana</h2>
      <div style="font-size:13px;color:var(--blue);text-transform:uppercase;margin-bottom:20px;">
        <span class="lang-pt">Exposição coletiva · ACERT, Tondela · 2023–2025</span>
        <span class="lang-en">Collective exhibition · ACERT, Tondela · 2023–2025</span>
      </div>
      <div class="lang-pt">
        <p>Todas as pessoas vivem vidas diferentes, mas há coisas que fazem parte da experiência coletiva que partilhamos como seres humanos: uma delas é a experiência de navegação no mundo exterior.</p>
        <p>De manhã, quando trocamos de roupa para sair de casa, durante quanto tempo sentimos a roupa na nossa pele? Ao sair de casa, quanto tempo demoramos até deixarmos de sentir o desconforto da temperatura? E o ruído dos automóveis na calçada? Quanto desse ruído desaparece quando encontramos alguém conhecido na rua e ficamos a conversar?</p>
        <p>O corpo e a mente humana estabelecem diversas ferramentas para nos podermos guiar nessa navegação. A exposição, partindo do conceito científico de adaptação sensorial — uma ferramenta que equilibra a sensibilidade dos estímulos que recebemos — é uma passagem que convoca os visitantes a reflectir sobre os sentidos alargando os domínios da percepção.</p>
        <p>É na ligação entre o público e o privado que surge a concepção da "Membrana", expandindo as formas de ver para refletir sobre as conexões entre as pessoas. Ao atravessar essa membrana entre o público e o privado, a exposição revela interstícios invisíveis que formam a base da construção do ser social e dos territórios em que vivemos.</p>
        <p>Através de dispositivos que exploram a cor, o movimento e a interface entre os sentidos e a realidade, a exposição apresenta uma abstração e desconstrução do quotidiano, expondo camadas mais profundas da compreensão da realidade.</p>
      </div>
      <div class="lang-en">
        <p>All people live different lives, but there are things that are part of the collective experience we share as human beings: one of them is the experience of navigating the external world.</p>
        <p>In the morning, when we change clothes to leave home, how long do we feel the clothes on our skin? When leaving home, how long does it take until we stop feeling the discomfort of the temperature? And the noise of cars on the sidewalk? How much of that noise disappears when we encounter someone we know on the street and start talking?</p>
        <p>The human body and mind establish various tools for us to navigate this journey. The exhibition, starting from the scientific concept of sensory adaptation — a tool that balances the sensitivity of the stimuli we receive — is a passage that calls visitors to reflect on the senses, expanding the domains of perception.</p>
        <p>It is in the connection between the public and the private that the conception of the "Membrane" arises, expanding the ways of seeing to reflect on the connections between people. By crossing this membrane between the public and the private, the exhibition reveals invisible interstices that form the basis of the construction of social beings and the territories in which we live.</p>
        <p>Through devices that explore color, movement, and the interface between senses and reality, the exhibition presents an abstraction and deconstruction of the everyday, exposing deeper layers of understanding reality.</p>
      </div>
    </div>`,
    images: Array.from({length:11}, (_,i) => `images/membrana/${i+1}.jpg`)
  },
  porvir:{
    text:`<div class="content-inner">
      <h2>Porvir</h2>
      <div style="font-size:13px;color:var(--blue);text-transform:uppercase;margin-bottom:20px;">
        <span class="lang-pt">Projeto de arte participativa · Serra do Açor · 2024</span>
        <span class="lang-en">Participatory art project · Serra do Açor · 2024</span>
      </div>
      <a href="https://porvir.com.pt" target="_blank" class="btn-visit">
        <span class="lang-pt">VISITAR WEBSITE DO PROJETO ↗</span>
        <span class="lang-en">VISIT PROJECT WEBSITE ↗</span>
      </a>
      <div class="lang-pt">
        <p>Porvir é um projeto de intercâmbio multidisciplinar que envolve artistas locais, artistas externos e a comunidade, com o objetivo de imaginar o futuro através da arte participativa. Focado em quatro aldeias da Serra do Açor, o Porvir procura, através da expressão artística, construir um espaço de partilha, investigação, criação e exposição, estimulando o pensamento crítico das comunidades envolvidas.</p>
        <p>Oficinas participativas são realizadas em três aldeias diferentes, onde artistas e membros da comunidade colaboram em projetos únicos. Cada aldeia acolhe um artista em residência, que desenvolve obras originais inspiradas nas experiências e dinâmicas locais. O projeto culmina em exposições coletivas no espaço público, promovendo discussões abertas e trocas de ideias entre participantes, público e instituições.</p>
      </div>
      <div class="lang-en">
        <p>Porvir is a multidisciplinary exchange project involving local artists, external artists, and the community, aimed at envisioning the future through participatory art. Focused on four villages in the Serra do Açor region, Porvir seeks, through artistic expression, to build a space for sharing, research, creation, and exhibition, while stimulating the critical thinking of the involved communities.</p>
        <p>Participatory workshops are held in three different villages, where artists and community members collaborate on unique projects. Each village hosts an artist-in-residence, who develops original artworks inspired by local experiences and dynamics. The project culminates in collective exhibitions in the public space, promoting open discussions and idea exchanges among participants, the public, and institutions.</p>
      </div>
    </div>`,
    images: Array.from({length:36}, (_,i) => `images/porvir/${i+1}.jpg`)
  },
  imagens:{
    text:`<div class="content-inner">
      <h2>Imagens Verdes</h2>
      <div style="font-size:13px;color:var(--blue);text-transform:uppercase;margin-bottom:20px;">
        <span class="lang-pt">Oficinas de expressão artística · Porto · 2023–2025</span>
        <span class="lang-en">Artistic expression workshops · Porto · 2023–2025</span>
      </div>
      <div class="lang-pt">
        <p>Imagens Verdes é um projeto contínuo de transformação que reúne pessoas com 65 ou mais anos para uma exploração única da autoexpressão. Através de oficinas dinâmicas que integram teatro, música, ilustração e fotografia, os participantes mergulham nas suas memórias, partilhando experiências entre si.</p>
        <p>Dedicado à promoção do intercâmbio entre artistas e a comunidade sénior do Bonfim no Porto, exploramos memórias afetivas através de práticas interdisciplinares. A partir de memórias afetivas e coletivas, interpretamos experiências num ambiente de apoio e comunhão, envolvendo os participantes através de diversas atividades desenhadas para promover a democratização cultural na zona e incentivar a expressão artística.</p>
      </div>
      <div class="lang-en">
        <p>Imagens Verdes is an ongoing project aimed at transformation, bringing together individuals aged 65 and above for a unique exploration of self-expression. Through dynamic workshops that integrate theater, music, illustration, and photography, participants delve into the realms of their memories, sharing their experiences with one another.</p>
        <p>Dedicated to promoting exchange between artists and the senior community of Bonfim in Porto, we explore affective memories through interdisciplinary practices. Drawing from both affective and collective memories, we interpret experiences within a supportive and communal environment, engaging participants through various activities designed to promote cultural democratization in the area and encourage artistic expression.</p>
      </div>
    </div>`,
    images: Array.from({length:16}, (_,i) => `images/imagensverdes/${i+1}.jpg`)
  },
  casa:{
    text:`<div class="content-inner">
      <h2>A Casa de Falar Baixinho</h2>
      <div style="font-size:13px;color:var(--blue);text-transform:uppercase;margin-bottom:20px;">
        <span class="lang-pt">Exposição · Encontros da Imagem · 2025</span>
        <span class="lang-en">Exhibition · Encontros da Imagem · 2025</span>
      </div>
      <div class="lang-pt">
        <p>Integrada no núcleo expositivo Argumentários, que celebra e revisita a história do festival, a intervenção do Colectivo Barda responde ao desafio de recuperar memórias e experiências que moldaram de forma sensível e contínua a identidade dos Encontros da Imagem.</p>
        <p>Partindo de eventos reais da Semana de Abertura de 2018, o coletivo explora encontros, trocas e gestos inscritos na memória da comunidade reunida em torno do festival. Cada imagem em A casa de falar baixinho evoca episódios específicos, convocando afetos, práticas e momentos que, embora ausentes da documentação formal, ficaram marcados nos corpos e na memória particular de cada edição.</p>
      </div>
      <div class="lang-en">
        <p>Integrated into the exhibition core Argumentários, which aims to celebrate and revisit the history of the festival, the intervention by Colectivo Barda responds to the challenge of recovering memories and experiences that have sensitively shaped the identity of Encontros da Imagem.</p>
        <p>Drawing from real events during the Opening Week of 2018, the collective explores encounters, exchanges and gestures inscribed in the memory of the community gathered around the festival. Each image in A casa de falar baixinho evokes specific episodes, calling forth affects, practices and moments that, although absent from formal documentation, left their mark on bodies and became embedded in the memory of each edition.</p>
      </div>
    </div>`,
    images: Array.from({length:12}, (_,i) => `images/casafalarbaixinho/${i+1}.jpg`)
  },
  about:{
    text:`<div class="content-inner">
      <h2>BARDA</h2>
      <div class="lang-pt"><p>O Colectivo Barda enfatiza as artes visuais como meio de transformação e capacitação de comunidades periféricas, usando a imagem como ferramenta de intervenção e questionamento, promovendo a criação de sinergias entre comunidade e território através de diálogos experimentais. Barda é uma manifestação de vontade colaborativa que tomou a forma de um coletivo.</p></div>
      <div class="lang-en"><p>Barda Collective emphasizes visual arts as a means of transformation and empowerment for peripheral communities, using imagery as a tool for intervention and questioning, promoting the creation of synergies between community and territory through experimental dialogues. Barda is a manifestation of collaborative will that has taken the form of a collective.</p></div>
      <div class="bios">
        <div style="margin-bottom:28px;"><h3 class="lang-pt">Quem é o Barda?</h3><h3 class="lang-en">Who is Barda?</h3></div>
        <div class="bio"><p class="bio-name">Ana Luísa Rego</p><p><span class="lang-pt">Nasceu em Cinfães (1974), vive no Porto. Iniciou o seu percurso na fotografia ainda na era analógica. Na sua prática, documenta temas inspirados em questões sociais, culturais e científicas através de uma abordagem interdisciplinar e colaborativa. Expõe individualmente e coletivamente em Portugal e no estrangeiro.</span><span class="lang-en">Born in Cinfães (1974), lives in Porto. Started her journey in photography in the analog era. In her practice, she documents themes inspired by social, cultural, and scientific issues through an interdisciplinary and collaborative approach.</span></p></div>
        <div class="bio"><p class="bio-name">Carlos Trancoso</p><p><span class="lang-pt">Artista visual sediado no Porto. A sua prática explora as interseções entre natureza, tecnologia e sistemas de observação, combinando o pensamento fotográfico com processos espaciais, sonoros e computacionais. Em 2024 ganhou a Open Call INTERGALACTICA, resultando na publicação do fotolivro <em>How to Build a Telescope</em> pela XYZ Books em 2025.</span><span class="lang-en">Visual artist based in Porto. His practice explores the intersections between nature, technology, and systems of observation, combining photographic thought with spatial, sonic, and computational processes. In 2024 he won the INTERGALACTICA Open Call, leading to the publication of his photobook <em>How to Build a Telescope</em> by XYZ Books in 2025.</span></p></div>
        <div class="bio"><p class="bio-name">Diana Sá</p><p><span class="lang-pt">Nasceu em Espinho em 1985. Frequentou o curso profissional de fotografia no IPF e o Mestrado em Fotografia Artística no IPCI. Interessa-se por projetos de longo prazo sobre o território, o quotidiano e o efémero.</span><span class="lang-en">Born in Espinho in 1985. Attended the professional photography course at IPF and the Master's in Artistic Photography at IPCI. Interested in long-term projects regarding territory, daily life, and the ephemeral.</span></p></div>
        <div class="bio"><p class="bio-name">Guida Marques</p><p><span class="lang-pt">Nascida em 1986, neo-rural na Serra do Açor desde 2017. Desenvolve reconstruções de casas de xisto e performances/instalações focadas na relação corpo/lugar/memória. Ativista na defesa da floresta e da arquitetura tradicional.</span><span class="lang-en">Born in 1986, neo-rural in Serra do Açor since 2017. Develops reconstructions of schist houses and performances/installations focused on the body/place/memory relationship. Forest and traditional architecture activist.</span></p></div>
        <div class="bio"><p class="bio-name">Hernâni Sousa</p><p><span class="lang-pt">Mestre em Ciência da Informação. Desenvolve projetos pessoais em torno de temas como a intimidade e o território, com particular interesse na semiótica e na politização das coisas.</span><span class="lang-en">Master's in Information Science. Develops personal projects around themes of intimacy and territory, with a particular interest in semiotics and the politicisation of things.</span></p></div>
        <div class="bio"><p class="bio-name">Inês Fernandes</p><p><span class="lang-pt">Nasceu no Porto em 1996. Os seus projetos abordam temas contemporâneos focados em questões sociais e ambientais, com preferência por contextos rurais e descentralizados.</span><span class="lang-en">Born in Porto in 1996. Her projects address contemporary themes focused on social and environmental issues, with a preference for rural and decentralized contexts.</span></p></div>
        <div class="bio"><p class="bio-name">Ivan Da Silva</p><p><span class="lang-pt">Desconstrói imagens do quotidiano numa ecologia de imagens através de sistemas experimentais de análise de imagem. Coordenador do projeto Imagens Verdes.</span><span class="lang-en">Deconstructs everyday imagery into an ecology of images through experimental image analysis systems. Coordinator of the Imagens Verdes project.</span></p></div>
        <div class="bio"><p class="bio-name">Juliana Maar</p><p><span class="lang-pt">Nasceu em 1981. Utiliza o corpo e o autorretrato como principais veículos de expressão. Neo-rural na Serra do Açor há seis anos.</span><span class="lang-en">Born in 1981. Uses the body and self-portraiture as her main vehicles of expression. Neo-rural in Serra do Açor for six years.</span></p></div>
        <div class="bio"><p class="bio-name">Marco Duarte</p><p><span class="lang-pt">Fotógrafo documental freelancer que aborda questões sociais nos seus projetos visuais. Co-fundador do coletivo Barda em 2022.</span><span class="lang-en">Freelance documentary photographer addressing social issues in his visual projects. Co-founder of the Barda collective in 2022.</span></p></div>
      </div>
    </div>`,
    images:[]
  }
};

/* ── SWIPER / PROJECT ─────────────────────────── */
function buildSwiper(imgs){
  if(!imgs.length) return "";
  const slides = imgs.map((img,i) =>
    `<div class="swiper-slide"><img src="${img}" onclick="openLightbox(${i})"></div>`).join("");
  return `<div class="swiper main-swiper"><div class="swiper-wrapper">${slides}</div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div><div class="swiper-pagination"></div></div>`;
}
function initSwiper(){
  if(swiperInst) swiperInst.destroy();
  swiperInst = new Swiper(".main-swiper",{
    loop:true,
    pagination:{ el:".swiper-pagination" },
    navigation:{ nextEl:".swiper-button-next", prevEl:".swiper-button-prev" }
  });
}
function openProject(key){
  const item = projectData[key];
  tempImages = item.images;
  content.innerHTML = item.text + buildSwiper(item.images);
  overlay.classList.add("active");
  worldEl.style.zIndex = "0";
  applyLang(currentLang);
  content.scrollTop = 0;
  if(item.images.length) setTimeout(initSwiper, 100);
}
function closeOverlay(){
  overlay.classList.remove("active");
  worldEl.style.zIndex = "10";
  content.innerHTML = "";
  if(swiperInst){ swiperInst.destroy(); swiperInst = null; }
}

/* ── NAV ──────────────────────────────────────── */
function openNav(){ navMenu.classList.add("open"); navOverlay.classList.add("open"); siteWrap.classList.add("nav-open"); }
function closeNav(){ navMenu.classList.remove("open"); navOverlay.classList.remove("open"); siteWrap.classList.remove("nav-open"); }

hamburger.addEventListener("click", openNav);
navClose.addEventListener("click", closeNav);
navOverlay.addEventListener("click", closeNav);
closeBtn.addEventListener("click", closeOverlay);
document.getElementById("logoHome").addEventListener("click", closeOverlay);
document.getElementById("navAbout").addEventListener("click", () => { closeNav(); openProject("about"); });
document.querySelectorAll(".nav-project-btn").forEach(btn =>
  btn.addEventListener("click", () => { closeNav(); openProject(btn.dataset.key); })
);

/* ── HAMBURGER width = logo width ─────────────── */
window.addEventListener("load", () => {
  const w = document.getElementById("logoHome").offsetWidth;
  if(w > 0) hamburger.style.width = w + "px";
});

/* ── PHYSICS ──────────────────────────────────── */
const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;
const engine = Engine.create();
engine.gravity.y = 1.2;
const world = engine.world;

const W  = window.innerWidth;
const H  = window.innerHeight;
const cx = W / 2;
const cy = H / 2;

// Read footer height from CSS variable — floor sits just above it
const FOOTER_H = parseInt(
  getComputedStyle(document.documentElement).getPropertyValue("--footer-h")
) || 44;
const floorY = H - FOOTER_H;

const floor     = Bodies.rectangle(W/2, floorY + 30, W, 60, { isStatic:true });
const leftWall  = Bodies.rectangle(-30,  H/2, 60, H,  { isStatic:true });
const rightWall = Bodies.rectangle(W+30, H/2, 60, H,  { isStatic:true });
Composite.add(world, [floor, leftWall, rightWall]);

function clampW(w){ return Math.min(w, Math.floor(W * 0.78)); }

const items = [
  { labelPT:"Membrana",              labelEN:"Membrana",              key:"membrana", x:cx-W*.20, y:cy-H*.55, w:clampW(190), h:54 },
  { labelPT:"Porvir",                labelEN:"Porvir",                key:"porvir",   x:cx+W*.04, y:cy-H*.70, w:clampW(140), h:54 },
  { labelPT:"Imagens Verdes",        labelEN:"Imagens Verdes",        key:"imagens",  x:cx+W*.20, y:cy-H*.62, w:clampW(240), h:54 },
  { labelPT:"Casa de Falar Baixinho",labelEN:"Casa de Falar Baixinho",key:"casa",     x:cx-W*.04, y:cy-H*.85, w:clampW(320), h:54 },
  { labelPT:"Sobre",                 labelEN:"About",                 key:"about",    x:cx+W*.28, y:cy-H*.78, w:clampW(130), h:54 }
];

items.forEach(item => {
  item.body = Bodies.rectangle(item.x, item.y, item.w, item.h, {
    restitution:.1, friction:.8, frictionAir:.02
  });
  Composite.add(world, item.body);

  item.el = document.createElement("div");
  item.el.className = "physics-button";
  worldEl.appendChild(item.el);

  let sX, sY;
  item.el.addEventListener("pointerdown", e => { sX = e.clientX; sY = e.clientY; });
  item.el.addEventListener("pointerup",   e => {
    if(Math.hypot(e.clientX - sX, e.clientY - sY) < 8) openProject(item.key);
  });
});

// Bind Matter mouse only to #world so UI buttons get touch events freely
const mouse = Mouse.create(worldEl);
mouse.pixelRatio = window.devicePixelRatio || 1;
const mc = MouseConstraint.create(engine, {
  mouse, constraint:{ stiffness:.2, render:{ visible:false } }
});
mc.mouse.element.removeEventListener("touchstart", mc.mouse.mousedown);
mc.mouse.element.removeEventListener("touchmove",  mc.mouse.mousemove);
mc.mouse.element.removeEventListener("touchend",   mc.mouse.mouseup);
mc.mouse.element.addEventListener("touchstart", mc.mouse.mousedown, { passive:true });
mc.mouse.element.addEventListener("touchmove",  mc.mouse.mousemove, { passive:true });
mc.mouse.element.addEventListener("touchend",   mc.mouse.mouseup,   { passive:true });
Composite.add(world, mc);

Runner.run(Runner.create(), engine);

(function tick(){
  items.forEach(item => {
    item.el.style.width     = item.w + "px";
    item.el.style.height    = item.h + "px";
    item.el.style.left      = (item.body.position.x - item.w/2) + "px";
    item.el.style.top       = (item.body.position.y - item.h/2) + "px";
    item.el.style.transform = `rotate(${item.body.angle}rad)`;
    item.el.textContent     = currentLang === "en" ? item.labelEN : item.labelPT;
  });
  requestAnimationFrame(tick);
})();

window.addEventListener("resize", () => { if(Math.abs(window.innerWidth - W) > 50) location.reload(); });
</script>
</body>
</html>
