<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARDA</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root {
  --blue: #1f4fff;
}

body {
  font-family: 'IBM Plex Sans', sans-serif;
  margin:0;
  background:white;
  color:black;
  overflow-x:hidden;
}

/* LOGO */
h1.logo {
  position: fixed;
  top: 20px;
  right: 25px;
  font-size: 21px;
  text-transform: uppercase;
  color: var(--blue);
}

/* CENTER TEXT */
.statement {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px;
  text-align: center;
  max-width: 600px;
}

/* LINKS */
.text-links {
  position: fixed;
  bottom: 40px;
  left: 40px;
}

.text-links a {
  display:block;
  font-family:'Space Grotesk';
  font-size:22px;
  text-decoration:none;
  color:black;
  margin-bottom:10px;
}

/* PROJECT LIST */
.works-container {
  display:none;
}

.projects {
  display:block;
  border:1px solid black;
  padding:8px 14px;
  margin:5px 0;
  text-decoration:none;
  color:black;
  background:white;
}

/* OVERLAY */
.overlay-container {
  display:none;
  position:fixed;
  inset:0;
  background:white;
  z-index:999;
  align-items:center;
  justify-content:center;
}

.overlay-content {
  width:80vw;
  height:85vh;
  border:2px solid var(--blue);
  overflow:auto;
  background:white;
  position:relative;
  padding:40px;
  box-sizing:border-box;
}

/* CLOSE */
.close-button {
  position:absolute;
  top:0;
  right:0;
  width:40px;
  height:40px;
  background:var(--blue);
  color:white;
  border:none;
  font-size:24px;
  cursor:pointer;
}

/* SLIDESHOW */
.swiper {
  width: 100%;
  height: 60vh;
  margin-bottom: 40px;
}

.swiper-slide img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.swiper-button-next,
.swiper-button-prev {
  color: var(--blue);
}

.swiper-pagination-bullet-active {
  background: var(--blue);
}

/* MOBILE */
@media (max-width: 768px) {
  .overlay-content {
    width:92vw;
    height:80vh;
    padding:20px;
  }

  .statement {
    font-size:18px;
  }
}
</style>
</head>

<body>

<h1 class="logo">BARDA</h1>

<div class="statement">
  Images as tools for collective transformation
</div>

<div class="text-links">
  <a href="#" id="projectsBtn">Projects</a>

  <div class="works-container" id="worksList">
    <a href="#" class="projects" data-project="membrana">Membrana</a>
    <a href="#" class="projects" data-project="porvir">Porvir</a>
    <a href="#" class="projects" data-project="imagens">Imagens Verdes</a>
    <a href="#" class="projects" data-project="casa">Casa de Falar Baixinho</a>
  </div>

  <a href="#" id="aboutBtn">About</a>
</div>

<div class="overlay-container" id="overlay">
  <div class="overlay-content">
    <button class="close-button" id="close">×</button>
    <div id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

<script>
const projectsBtn = document.getElementById("projectsBtn");
const worksList = document.getElementById("worksList");
const aboutBtn = document.getElementById("aboutBtn");
const overlay = document.getElementById("overlay");
const closeBtn = document.getElementById("close");
const content = document.getElementById("content");

let swiperInstance = null;

/* IMAGENS POR PROJETO */
const projectImages = {
  membrana: [
    "images/membrana/01.jpg",
    "images/membrana/02.jpg",
    "images/membrana/03.jpg"
  ],
  porvir: [
    "images/porvir/01.jpg",
    "images/porvir/02.jpg",
    "images/porvir/03.jpg"
  ],
  imagens: [
    "images/imagensverdes/01.jpg",
    "images/imagensverdes/02.jpg",
    "images/imagensverdes/03.jpg"
  ],
  casa: [
    "images/casafalarbaixinho/1.jpg",
    "images/casafalarbaixinho/2.jpg",
    "images/casafalarbaixinho/3.jpg"
    "images/casafalarbaixinho/4.jpg"
  "images/casafalarbaixinho/5.jpg"
  "images/casafalarbaixinho/6.jpg"
  "images/casafalarbaixinho/7.jpg"
  "images/casafalarbaixinho/8.jpg"
  "images/casafalarbaixinho/9.jpg"
  "images/casafalarbaixinho/10.jpg"
  "images/casafalarbaixinho/11.jpg"
  ]
};

/* TEXTOS */
const projectText = {
  membrana: "Membrana explora estruturas coletivas e percepção.",
  porvir: "Porvir investiga futuros possíveis e narrativas.",
  imagens: "Imagens Verdes trabalha ecologias visuais.",
  casa: "Casa de Falar Baixinho explora intimidade e espaço."
};

function buildSwiper(images) {
  let slides = images.map(img =>
    `<div class="swiper-slide"><img src="${img}"></div>`
  ).join("");

  return `
    <div class="swiper">
      <div class="swiper-wrapper">
        ${slides}
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
  `;
}

function initSwiper() {
  swiperInstance = new Swiper(".swiper", {
    loop: true,
    pagination: { el: ".swiper-pagination" },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev"
    }
  });
}

/* PROJECT OPEN */
document.querySelectorAll(".projects").forEach(btn => {
  btn.onclick = (e) => {
    e.preventDefault();

    const key = btn.dataset.project;

    content.innerHTML = `
      <h2 style="margin-bottom:20px;">${key}</h2>
      <p style="margin-bottom:30px;">${projectText[key]}</p>
      ${buildSwiper(projectImages[key])}
    `;

    overlay.style.display = "flex";

    setTimeout(() => {
      initSwiper();
    }, 50);
  };
});

/* TOGGLES */
projectsBtn.onclick = (e) => {
  e.preventDefault();
  worksList.style.display =
    worksList.style.display === "block" ? "none" : "block";
};

aboutBtn.onclick = (e) => {
  e.preventDefault();
  content.innerHTML = `<h2>About</h2><p>Texto about aqui.</p>`;
  overlay.style.display = "flex";
};

closeBtn.onclick = () => {
  overlay.style.display = "none";
  content.innerHTML = "";
  if (swiperInstance) swiperInstance.destroy();
};
</script>

</body>
</html>
