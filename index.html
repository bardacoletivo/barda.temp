<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARDA</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');

:root {
  --blue: #1f4fff;
}

body {
  font-family: 'IBM Plex Sans', sans-serif;
  margin:0;
  background:white;
  color:black;
  overflow-x:hidden;
}

/* LOGO */
h1.logo {
  position: fixed;
  top: 20px;
  right: 25px;
  font-size: 21px;
  text-transform: uppercase;
  color: var(--blue);
}

/* CENTER TEXT */
.statement {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px;
  text-align: center;
  max-width: 600px;
}

/* LINKS */
.text-links {
  position: fixed;
  bottom: 40px;
  left: 40px;
}

.text-links a {
  display:block;
  font-family:'Space Grotesk';
  font-size:22px;
  text-decoration:none;
  color:black;
  margin-bottom:10px;
}

/* PROJECT LIST */
.works-container {
  display:none;
}

.projects {
  display:block;
  border:1px solid black;
  padding:8px 14px;
  margin:5px 0;
  text-decoration:none;
  color:black;
  background:white;
}

/* OVERLAY */
.overlay-container {
  display:none;
  position:fixed;
  inset:0;
  background:white;
  z-index:999;
  align-items:center;
  justify-content:center;
}

.overlay-content {
  width:80vw;
  height:85vh;
  border:2px solid var(--blue);
  overflow:auto;
  background:white;
  position:relative;
  padding:40px;
  box-sizing:border-box;
}

/* CLOSE */
.close-button {
  position:absolute;
  top:0;
  right:0;
  width:40px;
  height:40px;
  background:var(--blue);
  color:white;
  border:none;
  font-size:24px;
  cursor:pointer;
}

/* SLIDESHOW */
.swiper {
  width: 100%;
  height: 60vh;
  margin-bottom: 40px;
}

.swiper-slide {
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
}

.swiper-slide img {
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}

.swiper-button-next,
.swiper-button-prev {
  color: var(--blue);
}

.swiper-pagination-bullet-active {
  background: var(--blue);
}

/* MOBILE */
@media (max-width: 768px) {
  .overlay-content {
    width:92vw;
    height:80vh;
    padding:20px;
  }

  .statement {
    font-size:18px;
  }
}
</style>
</head>

<body>

<h1 class="logo">BARDA</h1>

<div class="statement">
  Images as tools for collective transformation
</div>

<div class="text-links">
  <a href="#" id="projectsBtn">Projects</a>

  <div class="works-container" id="worksList">
    <a href="#" class="projects" data-project="membrana">Membrana</a>
    <a href="#" class="projects" data-project="porvir">Porvir</a>
    <a href="#" class="projects" data-project="imagens">Imagens Verdes</a>
    <a href="#" class="projects" data-project="casa">Casa de Falar Baixinho</a>
  </div>

  <a href="#" id="aboutBtn">About</a>
</div>

<div class="overlay-container" id="overlay">
  <div class="overlay-content">
    <button class="close-button" id="close">×</button>
    <div id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

<script>
const projectsBtn = document.getElementById("projectsBtn");
const worksList = document.getElementById("worksList");
const aboutBtn = document.getElementById("aboutBtn");
const overlay = document.getElementById("overlay");
const closeBtn = document.getElementById("close");
const content = document.getElementById("content");

let swiperInstance = null;

/* IMAGENS */
const projectImages = {
  membrana: [
    "images/membrana/01.jpg",
    "images/membrana/02.jpg",
    "images/membrana/03.jpg"
  ],
  porvir: [
    "images/porvir/01.jpg",
    "images/porvir/02.jpg",
    "images/porvir/03.jpg"
  ],
  imagens: [
    "images/imagensverdes/01.jpg",
    "images/imagensverdes/02.jpg",
    "images/imagensverdes/03.jpg"
  ],
  casa: [
    "images/casafalarbaixinho/1.jpg",
    "images/casafalarbaixinho/2.jpg",
    "images/casafalarbaixinho/3.jpg",
    "images/casafalarbaixinho/4.jpg",
    "images/casafalarbaixinho/5.jpg",
    "images/casafalarbaixinho/6.jpg",
    "images/casafalarbaixinho/7.jpg",
    "images/casafalarbaixinho/8.jpg",
    "images/casafalarbaixinho/9.jpg",
    "images/casafalarbaixinho/10.jpg",
    "images/casafalarbaixinho/11.jpg"
  ]
};

/* TEXTOS EDITADOS */
const projectText = {
  membrana: `
    <p><strong>Membrana</strong><br>
    Collective exhibition — ACERT, Tondela (2023)</p>

    <p>
    Membrana explores sensory adaptation as a way of thinking perception.
    It investigates how bodies filter, adjust and negotiate stimuli in everyday life.
    </p>

    <p>
    The exhibition operates as a threshold between public and private space,
    revealing invisible layers that structure social experience and territory.
    Through colour, movement and immersive devices, it invites reflection
    on perception and collective presence.
    </p>

    <p>
    Works:
    Iridiscent paper · wet collodion · video projection · backlit acetate · prints
    </p>
  `,

  porvir: `
    <p><strong>Porvir</strong><br>
    Participatory art project — Serra do Açor (2024)</p>

    <p>
    Porvir is a collaborative project that brings together local communities
    and artists to imagine possible futures through collective artistic practice.
    </p>

    <p>
    Developed across villages in Serra do Açor, it combines workshops,
    residencies and public exhibitions in shared spaces, fostering dialogue
    between participants, territory and institutions.
    </p>
  `,

  imagens: `
    <p><strong>Imagens Verdes</strong><br>
    Workshops — Porto (2023)</p>

    <p>
    Imagens Verdes is an ongoing project focused on transformation through
    artistic expression with participants aged 65 and above.
    </p>

    <p>
    Through theatre, music, illustration and photography, participants explore
    memory and collective storytelling in a supportive environment.
    </p>

    <p>
    The project promotes cultural participation, conviviality and informal learning.
    </p>
  `,

  casa: `
    <p><strong>Casa de Falar Baixinho</strong></p>

    <p>
    An exploration of intimacy, shared space and quiet communication through
    collective practice and situated experience.
    </p>
  `
};

function buildSwiper(images) {
  let slides = images.map(img =>
    `<div class="swiper-slide"><img src="${img}"></div>`
  ).join("");

  return `
    <div class="swiper">
      <div class="swiper-wrapper">
        ${slides}
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
  `;
}

function initSwiper() {
  swiperInstance = new Swiper(".swiper", {
    loop: true,
    pagination: { el: ".swiper-pagination" },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev"
    }
  });
}

/* OPEN PROJECT */
document.querySelectorAll(".projects").forEach(btn => {
  btn.onclick = (e) => {
    e.preventDefault();

    const key = btn.dataset.project;

    content.innerHTML = `
      ${projectText[key]}
      ${buildSwiper(projectImages[key])}
    `;

    overlay.style.display = "flex";

    setTimeout(() => initSwiper(), 50);
  };
});

/* TOGGLES */
projectsBtn.onclick = (e) => {
  e.preventDefault();
  worksList.style.display =
    worksList.style.display === "block" ? "none" : "block";
};

aboutBtn.onclick = (e) => {
  e.preventDefault();
  content.innerHTML = `
    <p>
    Barda is a collective practice rooted in visual arts as a tool for transformation
    and empowerment in peripheral territories.
    </p>

    <p>
    It works through collaborative processes that connect community, image and territory,
    using experimental dialogues as a method of research and creation.
    </p>

    <p>
    Cepos, Serra do Açor — Photography residency (2022)
    <br>
    Emancipação da Memória
    </p>
  `;
  overlay.style.display = "flex";
};

closeBtn.onclick = () => {
  overlay.style.display = "none";
  content.innerHTML = "";
  if (swiperInstance) swiperInstance.destroy();
};
</script>

</body>
</html>
